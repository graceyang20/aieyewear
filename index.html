<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WEAR — In-Sight OS</title>
<meta name="description" content="관측세의 시대를 위한 AI 아이웨어, WEAR의 In-Sight OS 인터랙티브 프로토타입" />
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#000000;
  --lens:#000000;
  --line:#1C1E1B;
  --line2:#2A2C29;
  --text:rgba(255,255,255,.85);
  --muted:#8C8F89;
  --dim:#5A5D57;
  --faint:#343631;
  --amber:#CD432C;
  --amber-dim:#6d2418;
  --rust:#CD432C;
  --teal:#8C8F89;
  --hl2:#8C8F89;          /* 두 번째 하이라이트 — 호버 */
  --sans: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
  /* 라틴·숫자는 JetBrains Mono, 한글 글리프는 Pretendard 로 폴백된다 */
  --mono: 'JetBrains Mono', Pretendard, ui-monospace, 'SF Mono', Consolas, monospace;
  /* 영문 전용 — 로컬에 Gentle Monster가 설치돼 있으면 그것을 쓴다 */
  --eng: 'GentleMonster', 'Gentle Monster', 'GentleMonster-Condensed',
         'Archivo Narrow', Pretendard, sans-serif;  /* 한글은 Pretendard */
  --title-size: 36px;
}

/* 로컬에 설치된 Gentle Monster를 자동으로 집어온다.
   라이선스 파일이 따로 있으면 아래 url() 줄의 주석을 풀고 경로만 넣으면 된다. */
@font-face{
  font-family:'GentleMonster';
  src: local('GentleMonster'), local('GentleMonster-Condensed'), local('Gentle Monster');
  /* src: url('./GentleMonster-Condensed.woff2') format('woff2'); */
  font-display:swap;
}

/* 영문·숫자는 --eng, 한글은 --sans 로 자동 분리 */
.eng, .panel-title, #sysMenu li .k, .corner-brand,
.hud-readout .rv, .readout-cell .rv, .stat-row span:last-child,
.invoice-row span:last-child, .flt-meta, .big-metric, .pbar-legend,
.hold-compare, .cam-chip .eb, .calib-num, .calib-eng{
  font-family:var(--eng);
  font-feature-settings:'tnum' 1;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
  font-family:var(--sans); overflow:hidden; user-select:none;
  overscroll-behavior:none; -webkit-user-select:none;
}
#app{ position:fixed; top:0; right:0; bottom:0; left:0; }

/* ---------- shared bits ---------- */
.voice-line{ font-size:var(--title-size); font-weight:600; line-height:1.35; letter-spacing:-.01em;
  color:var(--text); max-width:960px; margin:0 auto 18px; text-align:center; opacity:0; animation:riseIn .9s ease forwards; }
.voice-line.dim{ color:var(--muted); font-size:14px; font-weight:400; line-height:1.7; letter-spacing:0; }
@keyframes riseIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.micro{ font-size:11.5px; color:var(--dim); text-align:center; margin-top:26px; max-width:630px; margin-left:auto; margin-right:auto; line-height:1.7; }
/* 손 조작 안내 */
.hg{ max-width:75vw; margin:34px auto 0; text-align:left; display:flex; flex-direction:column; gap:2px; }
.hg-row{ display:flex; align-items:center; gap:20px; padding:20px 4px; border-bottom:1px solid var(--line); }
.hg-row:last-child{ border-bottom:none; }
.hg-ic{ flex:none; width:64px; height:56px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line2); }
.hg-tx b{ display:block; font-size:14px; font-weight:600; color:var(--text); letter-spacing:-.01em; }
.hg-svg{ width:30px; height:30px; color:var(--amber); display:block; }
.hg-alt{ font-family:var(--eng); font-size:10px; font-weight:700; letter-spacing:.22em; color:var(--faint); }
/* 커서 아이콘 — 점+링이 은은히 움직인다 */
.hg-cursor{ position:relative; width:30px; height:30px; }
.hg-cursor i{ position:absolute; left:50%; top:50%; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
  border-radius:50%; background:var(--amber); box-shadow:0 0 8px 1px rgba(205,67,44,.5);
  animation:hgFloat 2s ease-in-out infinite; }
.hg-cursor::after{ content:''; position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
  border:1px solid rgba(205,67,44,.45); border-radius:50%; }
@keyframes hgFloat{ 0%,100%{ transform:translate(-3px,-2px); } 50%{ transform:translate(3px,2px); } }
/* 주먹 아이콘 — 네 손가락이 접혔다 폈다 */
.hg-fist{ display:flex; gap:2.5px; align-items:flex-end; height:26px; }
.hg-fist i{ width:4px; background:var(--amber); opacity:.85; border-radius:2px 2px 0 0;
  height:22px; animation:hgFold 1.8s ease-in-out infinite; }
.hg-fist i:nth-child(2){ animation-delay:.08s; } .hg-fist i:nth-child(3){ animation-delay:.16s; }
.hg-fist i:nth-child(4){ animation-delay:.24s; }
@keyframes hgFold{ 0%,100%{ height:22px; } 45%,70%{ height:8px; } }
@media (max-width:560px){ .hg-row{ gap:14px; padding:16px 2px; } .hg-ic{ width:52px; height:48px; } }
.ghost-btn{
  display:block; margin:34px auto 0; background:transparent; border:1px solid currentColor;
  color:var(--text); font-family:var(--sans); font-size:13px; padding:10px 26px; border-radius:999px;
  cursor:pointer; letter-spacing:.02em; transition:color .2s;
}
.ghost-btn:hover{ color:var(--amber); }
.ghost-btn:focus-visible{ outline:1px solid var(--amber); outline-offset:3px; }
.ghost-btn.reject{ color:var(--muted); }
.ghost-btn:disabled{ opacity:.3; cursor:default; color:var(--muted); }
.ghost-btn:disabled:hover{ color:var(--muted); }
/* 끄덕임/음성으로 조작하는 CTA — 안내 중이면 테두리가 맥동한다 */
.ghost-btn.await{ animation:ctaAwait 1.9s ease-in-out infinite; }
@keyframes ctaAwait{ 0%,100%{ box-shadow:0 0 0 0 rgba(205,67,44,0); } 50%{ box-shadow:0 0 0 3px rgba(205,67,44,.16); } }
.cta-hint{ display:flex; align-items:center; justify-content:center; gap:9px;
  margin:14px auto 0; font-size:11.5px; color:var(--dim); letter-spacing:.01em;
  opacity:0; transition:opacity .3s ease; pointer-events:none; }
.cta-hint.show{ opacity:1; }
.cta-hint .k{ font-family:var(--eng); font-size:9px; font-weight:700; letter-spacing:.16em;
  color:var(--muted); border:1px solid var(--line2); padding:3px 7px; }
.cta-hint .nod i{ display:inline-block; animation:nodBob 1.4s ease-in-out infinite; }
@keyframes nodBob{ 0%,100%{ transform:translateY(-1px); } 50%{ transform:translateY(2px); } }
.cta-hint .sep{ color:var(--faint); }
.cta-hint .shake i{ display:inline-block; animation:shakeWag 1.2s ease-in-out infinite; }
@keyframes shakeWag{ 0%,100%{ transform:translateX(-2px); } 50%{ transform:translateX(2px); } }
.vc-chip.listening .lbl{ color:var(--amber); }
.amount{ font-family:var(--mono); color:var(--amber); font-size:38px; text-align:center; margin:18px 0 6px; font-weight:500; }

/* ---------- onboarding ---------- */
#onboarding{
  position:absolute; top:0; right:0; bottom:0; left:0; overflow:hidden;
  background:var(--bg); transition:opacity .6s ease; text-align:center; white-space:nowrap;
}
#onboarding::before{
  content:''; display:inline-block; height:100%; vertical-align:middle; width:0;
}
#onboarding.fade-out{ opacity:0; pointer-events:none; }
#ob-content{
  display:inline-block; vertical-align:middle; white-space:normal; text-align:center;
  width:100%; max-width:75vw; padding:44px 10px;
}
.breathe-dot{ width:6px; height:6px; border-radius:50%; background:var(--amber); margin:0 auto 40px; box-shadow:0 0 0 0 rgba(205,67,44,.4); animation:breathe 2.6s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ box-shadow:0 0 0 0 rgba(205,67,44,.35);} 50%{ box-shadow:0 0 0 22px rgba(205,67,44,0);} }
.case-illust{ width:210px; height:78px; border:1.4px solid var(--faint); border-radius:39px; margin:0 auto 34px; position:relative; }
.case-illust::before{ content:''; position:absolute; left:16px; right:16px; top:50%; height:1px; background:var(--faint); opacity:.5; }
.case-illust::after{ content:''; position:absolute; right:22px; top:50%; width:6px; height:6px; margin-top:-3px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 8px rgba(205,67,44,.14); }
.invoice{ max-width:75vw; margin:20px auto 0; }
.invoice-row{ display:flex; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line); font-size:13px; }
.invoice-row span:first-child{ color:var(--muted); }
.invoice-row span:last-child{ font-family:var(--mono); color:var(--text); font-size:15px; }
.invoice-row.hl{ border-bottom:none; padding-top:18px; align-items:baseline; }
.invoice-row.hl span:first-child{ color:var(--text); font-size:14px; font-weight:600; }
.invoice-row.hl span:last-child{ font-family:var(--eng); font-feature-settings:'tnum' 1;
  color:var(--amber); font-size:30px; font-weight:700; letter-spacing:-.01em; line-height:1; }
.invoice-row.hl span:last-child em{ font-style:normal; font-size:13px; font-weight:600; margin-left:7px; opacity:.8; }
.invoice-note{ text-align:right; font-size:11.5px; color:var(--amber); margin:6px 0 4px; letter-spacing:.01em; }
.invoice-div{ height:1px; background:var(--line2); margin:10px 0 2px; }
/* ---------- 결정도 — 계측 레일 ---------- */
.dcx{ max-width:75vw; margin:32px auto 0; text-align:left; }

.dcx-big{ display:flex; align-items:flex-end; gap:16px; margin:26px 0 4px; }
.dcx-val{ font-family:var(--eng); font-weight:700; font-size:clamp(64px,15vw,116px);
  line-height:.86; letter-spacing:-.03em; color:var(--text); font-feature-settings:'tnum' 1; }
.dcx-band{ position:relative; font-size:15px; font-weight:600; color:var(--amber);
  letter-spacing:.02em; padding:0 0 9px 20px; transition:color .2s ease; }
.dcx-band::before{ content:''; position:absolute; left:0; top:3px; bottom:12px; width:1px; background:var(--line2); }
.dcx-band em{ display:block; font-family:var(--eng); font-style:normal; font-size:9px;
  font-weight:600; letter-spacing:.24em; color:var(--dim); margin-bottom:5px; }

.dcx-rail{ position:relative; height:52px; margin-top:52px; }
.dcx-seg{ position:absolute; top:0; bottom:0; cursor:pointer;
  background:var(--line); overflow:hidden;
  transition:background .28s ease, box-shadow .28s ease; }
.dcx-seg:hover{ background:var(--line2); }
.dcx-seg.on{ background:var(--amber); box-shadow:0 0 22px -4px rgba(205,67,44,.65); }
.dcx-seg b{ position:absolute; left:9px; bottom:8px; font-size:11.5px; font-weight:600;
  color:var(--muted); letter-spacing:.01em; transition:color .28s ease; }
.dcx-seg u{ position:absolute; left:9px; top:8px; font-family:var(--eng); font-size:8.5px;
  font-weight:600; text-decoration:none; letter-spacing:.2em; color:var(--faint);
  transition:color .28s ease; }
.dcx-seg.on b{ color:var(--bg); }
.dcx-seg.on u{ color:rgba(0,0,0,.5); }

/* 앰버 띠 위에 선을 얹으면 묻힌다. 띠를 아예 뚫어 검은 채널을 낸다. */
.dcx-mark{ position:absolute; top:-8px; bottom:-8px; width:10px; margin-left:-5px;
  background:var(--bg); pointer-events:none; z-index:3;
  transition:left 1.05s cubic-bezier(.2,.85,.25,1); }
.dcx-mark i{ position:absolute; left:4px; top:0; bottom:0; width:2px; background:var(--text); }
.dcx-mark b{ position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
  margin-bottom:10px; padding:2px 7px; background:var(--bg);
  border:1px solid var(--text); font-family:var(--eng); font-weight:700; font-size:12px;
  letter-spacing:.03em; color:var(--text); white-space:nowrap; }
.dcx-mark u{ position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:10px;
  font-family:var(--eng); font-size:8.5px; font-weight:700; letter-spacing:.22em;
  color:var(--dim); text-decoration:none; }

.dcx-scale{ position:relative; height:14px; margin-top:32px; }
.dcx-scale span{ position:absolute; top:0; transform:translateX(-50%); font-family:var(--eng);
  font-size:9.5px; letter-spacing:.12em; color:var(--faint); }
.dcx-scale span:first-child{ transform:none; }
.dcx-scale span:last-child{ transform:translateX(-100%); }

@media (max-width:560px){
  .dcx-rail{ height:46px; }
  .dcx-seg b{ font-size:10px; left:6px; }
  .dcx-seg u{ left:6px; letter-spacing:.1em; }
  .dcx-big{ gap:8px; }
  .dcx-band{ padding-left:12px; }
  .dcx-rail{ margin-top:46px; }
  .dcx-mark b{ font-size:11px; padding:2px 5px; }
}

.profile-form{ max-width:75vw; margin:30px auto 0; text-align:center; }
.field{ margin-bottom:22px; }
.field-label{ font-size:11px; color:var(--dim); margin-bottom:10px; letter-spacing:.03em; text-align:center; }
.chips{ font-size:0; text-align:center; }
.chip{
  display:inline-block; margin:0 4px 8px;
  background:transparent; border:1px solid currentColor; color:var(--muted);
  font-family:var(--sans); font-size:12.5px; padding:8px 15px; border-radius:999px;
  cursor:pointer; transition:color .18s, background .18s;
}
.chip:hover{ color:var(--text); }
.chip.on{ color:var(--amber); background:rgba(205,67,44,.10); }
.chip:focus-visible{ outline:1px solid var(--amber); outline-offset:2px; }
/* 한 페이지에 질문 하나만 있을 때 — 크게 */
.profile-form.solo{ max-width:75vw; margin-top:44px; }
.chips.lg .chip{ font-size:16px; padding:15px 32px; margin:0 5px 12px; }
@media (max-width:560px){ .chips.lg .chip{ font-size:14.5px; padding:13px 24px; } }

/* ---------- 예산 슬라이더 ---------- */
.bd-wrap{ max-width:75vw; margin:36px auto 0; }
.bd-amount{ font-family:var(--eng); font-weight:700; font-size:46px; line-height:1.05; letter-spacing:-.01em;
  color:var(--amber); text-align:center; transition:color .2s, font-size .2s; }
.bd-amount.off{ color:var(--muted); font-size:30px; }
.bd-unit{ font-family:var(--mono); font-size:10.5px; color:var(--dim); text-align:center; margin-top:8px; letter-spacing:.06em; }
.bd-range{
  -webkit-appearance:none; appearance:none; display:block; width:100%; height:28px;
  margin:26px 0 0; background:transparent; cursor:pointer; touch-action:none;
}
.bd-range::-webkit-slider-runnable-track{ height:1px; background:var(--line2); border:none; }
.bd-range::-moz-range-track{ height:1px; background:var(--line2); border:none; }
.bd-range::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:13px; height:13px; margin-top:-6px;
  border-radius:50%; background:var(--amber); border:none; transition:transform .15s;
}
.bd-range::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:var(--amber); border:none; }
.bd-range:active::-webkit-slider-thumb{ transform:scale(1.25); }
.bd-range:focus-visible{ outline:1px solid var(--amber); outline-offset:6px; }
.bd-range:disabled{ opacity:.22; cursor:default; }
/* 슬라이더 눈금 — 정중앙이 동일 조건 평균, 맨 오른쪽이 무제한 */
.bd-track{ position:relative; }
.bd-avgtick{ position:absolute; left:50%; top:47px; margin-left:-.5px; width:1px; height:9px;
  background:var(--line2); pointer-events:none; }
.bd-marks{ position:relative; height:15px; margin-top:6px; font-family:var(--eng);
  font-size:9.5px; letter-spacing:.06em; color:var(--dim); }
.bd-marks span{ position:absolute; white-space:nowrap; }
.bd-marks .l{ left:0; }
.bd-marks .r{ right:0; }
.bd-marks .c{ left:50%; transform:translateX(-50%); }
.bd-marks .c b{ color:var(--muted); font-weight:700; }
.bd-marks .r.on{ color:var(--amber); }

/* 블러 처리 예시 */
.bd-demo-lead{ display:flex; justify-content:center; margin:16px 0 28px; }
.bd-demo-btn{
  display:inline-block; background:transparent; border:1px solid var(--line2);
  color:var(--muted); font-family:var(--sans); font-size:11.5px; padding:8px 16px;
  border-radius:999px; cursor:pointer; letter-spacing:.02em; transition:color .18s, border-color .18s;
}
.bd-demo-btn:hover{ color:var(--amber); border-color:var(--amber-dim); }
.bd-demo-btn:focus-visible{ outline:1px solid var(--amber); outline-offset:3px; }
/* 블러 예시 팝업 */
.bd-modal{ position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.72); backdrop-filter:blur(2px); }
.bd-modal[hidden]{ display:none; }
.bd-modal-panel{ position:relative; width:min(90vw,480px); background:var(--bg);
  border:1px solid var(--line2); padding:44px 26px 26px; }
.bd-modal-x{ position:absolute; top:10px; right:12px; width:32px; height:32px; line-height:1;
  background:transparent; border:none; color:var(--muted); font-size:24px; cursor:pointer;
  transition:color .18s; }
.bd-modal-x:hover{ color:var(--amber); }
.bd-modal-x:focus-visible{ outline:1px solid var(--amber); outline-offset:2px; }
.bd-demo{ margin:0 auto; }
.bd-demo-stage{ position:relative; aspect-ratio:16/10; background:#0E0F0D;
  border:1px solid var(--line2); overflow:hidden; }
.bd-demo-obj{ position:absolute; transition:filter .45s ease; }
.bd-demo-sign{ left:7%; top:14%; width:40%; height:26%; border:1px solid var(--amber-dim);
  background:rgba(205,67,44,.10); display:flex; align-items:center; justify-content:center;
  font-family:var(--eng); font-size:13px; font-weight:700; color:var(--amber); letter-spacing:.04em; }
.bd-demo-face{ border-radius:50%; background:#2E302C; border:1px solid var(--line2); }
.bd-demo-f1{ left:14%; bottom:9%; width:19%; aspect-ratio:1; }
.bd-demo-f2{ left:39%; bottom:5%; width:23%; aspect-ratio:1; }
.bd-demo-logo{ right:8%; top:22%; width:22%; height:16%; border:1px solid var(--line2);
  display:flex; align-items:center; justify-content:center; font-family:var(--eng);
  font-size:10px; letter-spacing:.2em; color:var(--muted); }
.bd-demo-price{ right:9%; bottom:14%; font-family:var(--eng); font-size:15px; font-weight:700; color:var(--text); }
.bd-demo.blurred .bd-demo-obj{ filter:blur(9px); }
.bd-demo-stamp{ position:absolute; left:10px; bottom:9px; font-family:var(--eng); font-size:9px;
  letter-spacing:.2em; color:var(--dim); }
.bd-demo.blurred .bd-demo-stamp{ color:var(--rust); }
.bd-demo-sw{ display:flex; gap:0; margin-top:10px; border:1px solid var(--line2); }
.bd-demo-sw button{ flex:1; background:transparent; border:none; color:var(--dim);
  font-family:var(--sans); font-size:11px; padding:8px 0; cursor:pointer; transition:color .18s, background .18s; }
.bd-demo-sw button.on{ color:var(--amber); background:rgba(205,67,44,.10); }
.bd-demo-cap{ font-size:11px; color:var(--dim); text-align:center; margin-top:9px; line-height:1.7; }

#mirrorFlashFull{ position:fixed; top:0; right:0; bottom:0; left:0; background:linear-gradient(120deg,#161616 0%, #000000 38%, #454545 52%, #000000 66%, #000000 100%); z-index:60; display:flex; align-items:flex-end; justify-content:center; cursor:pointer; }
#mirrorFlashFull.hidden{ display:none; }
#mirrorFlashFull span{ font-size:10px; color:rgba(255,255,255,.25); margin-bottom:26px; letter-spacing:.05em; }

/* ---------- filter setup (onboarding + SHIELD) ---------- */
.flt-wrap{ max-width:75vw; margin:26px auto 0; text-align:left; }
.flt-group-label{ font-size:10.5px; color:var(--dim); letter-spacing:.04em; margin:22px 0 8px; }
.flt-list{ border-top:1px solid var(--line); }
.flt-row{
  display:flex; align-items:center; gap:14px; padding:13px 2px;
  border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s;
}
.flt-row:hover{ background:rgba(205,67,44,.05); }
.flt-row:focus-visible{ outline:1px solid var(--amber); outline-offset:-1px; }
.flt-main{ flex:1; min-width:0; }
.flt-name{ font-size:13.5px; color:var(--text); }
.flt-desc{ font-size:11px; color:var(--dim); margin-top:3px; line-height:1.5; }
.flt-meta{ font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right; white-space:nowrap; line-height:1.6; }
.flt-meta b{ color:var(--text); font-weight:500; }
.sw{ width:34px; height:18px; border-radius:999px; border:1px solid var(--line2); position:relative; flex:none; transition:border-color .18s, background .18s; }
.sw::after{ content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--dim); transition:transform .18s, background .18s; }
.flt-row.on .sw{ border-color:var(--amber); background:rgba(205,67,44,.14); }
.flt-row.on .sw::after{ transform:translateX(16px); background:var(--amber); }
.flt-row.on .flt-name{ color:var(--amber); }
.flt-row.locked{ opacity:.45; cursor:default; }
.flt-row.locked:hover{ background:transparent; }

/* ---------- 필터 스테이지 — 명세표 ---------- */
.vfx{ max-width:75vw; margin:36px auto 0; text-align:left; }

.vfx-head{ display:flex; align-items:center; gap:12px; }
.vfx-kicker{ font-family:var(--eng); font-size:10px; font-weight:600; letter-spacing:.28em;
  color:var(--dim); white-space:nowrap; }
.vfx-rule{ flex:1; height:1px; background:var(--line2); }

/* 시야 막대 — 폭이 곧 시야 기여도(pt). 차단하면 그 폭이 실제로 사라진다. */
.vfx-bar{ display:flex; width:100%; height:38px; margin:18px 0 9px;
  border:1px solid var(--line2); overflow:hidden;
  background:repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,255,255,.04) 5px 10px); }
.vfx-bar i{ display:flex; align-items:center; justify-content:center; height:100%;
  overflow:hidden; white-space:nowrap; font-family:var(--sans); font-size:9.5px; font-weight:700;
  color:#16100D; background:var(--amber); opacity:.88; border-right:1px solid rgba(0,0,0,.5);
  transition:width .38s cubic-bezier(.2,.8,.2,1), opacity .28s ease, background .2s ease; }
.vfx-bar i.fixed{ background:var(--line2); color:var(--muted); opacity:1; }
.vfx-bar i.hl{ background:var(--text); opacity:1; }
.vfx-bar i.out{ width:0 !important; opacity:0; border-right-width:0; }
.vfx-barlabel{ display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  font-size:10.5px; color:var(--dim); letter-spacing:.01em; }
.vfx-barlabel b{ font-family:var(--eng); font-feature-settings:'tnum' 1;
  font-weight:700; color:var(--text); font-size:12px; margin-left:4px; }
.vfx-barlabel .r{ text-align:right; }

/* 노출 차단 구독 플랜 */
.plan-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:26px 0 0; }
.plan{ display:flex; flex-direction:column; text-align:left; padding:20px 18px 20px;
  border:1px solid var(--line2); background:transparent; color:inherit; font:inherit;
  cursor:pointer; transition:border-color .2s, background .2s; }
.plan:hover{ border-color:var(--dim); }
.plan.on{ border-color:var(--amber); background:rgba(205,67,44,.07); }
.plan:focus-visible{ outline:1px solid var(--amber); outline-offset:2px; }
.plan-name{ font-family:var(--eng); font-size:10px; font-weight:700; letter-spacing:.26em; color:var(--dim); }
.plan.on .plan-name{ color:var(--amber); }
.plan-ko{ font-size:14px; font-weight:600; color:var(--text); margin-top:9px; letter-spacing:-.01em; }
.plan-price{ font-family:var(--eng); font-feature-settings:'tnum' 1; font-size:25px; font-weight:700;
  color:var(--text); margin-top:11px; letter-spacing:-.01em; line-height:1; }
.plan.on .plan-price{ color:var(--amber); }
.plan-price small{ font-size:11px; font-weight:400; color:var(--dim); margin-left:5px; letter-spacing:0; }
.plan-desc{ font-size:11.5px; color:var(--muted); line-height:1.75; margin-top:13px; }
.plan-list{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.plan-list div{ font-size:11px; color:var(--muted); line-height:1.95; }
.plan-list div.no{ color:var(--faint); text-decoration:line-through; text-decoration-color:var(--line2); }
.plan-list div i{ font-style:normal; display:inline-block; width:11px; color:var(--amber); }
.plan-list div.no i{ color:var(--line2); }
.plan-foot{ margin-top:auto; padding-top:16px; font-family:var(--eng); font-size:9.5px;
  letter-spacing:.18em; color:var(--faint); }
.plan.on .plan-foot{ color:var(--amber); }
@media (max-width:760px){ .plan-grid{ grid-template-columns:1fr; } }

.vfx-list{ margin-top:26px; border-top:1px solid var(--line2); }
.vfx-list + .vfx-sublabel{ margin-top:26px; }
.vfx-sublabel{ font-family:var(--eng); font-size:9.5px; letter-spacing:.24em; color:var(--faint); margin-bottom:9px; }

.vfx-row{ display:flex; align-items:flex-start; gap:16px; padding:17px 6px 16px;
  border-bottom:1px solid var(--line); cursor:pointer; position:relative; }
.vfx-row::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:0;
  background:rgba(205,67,44,.07); transition:width .3s cubic-bezier(.2,.8,.2,1); }
.vfx-row:hover::before{ width:100%; }
.vfx-row:focus-visible{ outline:1px solid var(--amber); outline-offset:-1px; }

.vfx-idx{ font-family:var(--eng); font-size:10px; font-weight:700; letter-spacing:.1em;
  color:var(--faint); width:20px; flex:none; padding-top:6px; position:relative; z-index:1;
  transition:color .25s ease; }
.vfx-row.on .vfx-idx{ color:var(--amber); }

.vfx-body{ flex:1; min-width:0; position:relative; z-index:1; }
.vfx-name{ position:relative; display:inline-block; font-size:19px; font-weight:600;
  letter-spacing:-.015em; line-height:1.25; color:var(--text); transition:color .28s ease; }
.vfx-name i{ position:absolute; left:-3px; right:-3px; top:53%; height:1.5px; background:var(--amber);
  transform:scaleX(0); transform-origin:left;
  transition:transform .38s cubic-bezier(.16,.9,.3,1); }
.vfx-row.cut .vfx-name{ color:var(--muted); }
.vfx-row.cut .vfx-name i{ transform:scaleX(1); }
.vfx-sub{ font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-top:7px; line-height:1.55; }
.vfx-sub em{ font-family:var(--eng); font-style:normal; font-weight:600; color:var(--faint);
  letter-spacing:.18em; margin-right:9px; }

.vfx-num{ flex:none; text-align:right; padding-top:3px; position:relative; z-index:1; }
.vfx-num b{ font-family:var(--eng); font-weight:700; font-size:17px; color:var(--text);
  transition:color .28s ease; }
.vfx-row.cut .vfx-num b{ color:var(--dim); text-decoration:line-through; text-decoration-color:var(--amber); }
.vfx-num span{ font-family:var(--eng); font-size:9.5px; color:var(--dim); letter-spacing:.16em; margin-left:4px; }
.vfx-pt{ font-family:var(--eng); font-size:9.5px; color:var(--faint); letter-spacing:.16em; margin-top:6px; }

/* 토글 — 알약이 아니라 도장 */
.vfx-mark{ flex:none; width:15px; height:15px; margin-top:7px; border:1px solid var(--line2);
  position:relative; z-index:1; transition:background .22s ease, border-color .22s ease; }
.vfx-mark::after{ content:''; position:absolute; left:3px; right:3px; top:50%; height:1px;
  background:var(--bg); transform:scaleX(0); transition:transform .22s .07s cubic-bezier(.2,.8,.2,1); }
.vfx-row.on .vfx-mark{ background:var(--amber); border-color:var(--amber); }
.vfx-row.on .vfx-mark::after{ transform:scaleX(1); }
.vfx-row.locked{ opacity:.38; cursor:default; }
.vfx-row.locked::before{ display:none; }

.vfx-foot{ font-family:var(--mono); font-size:10px; color:var(--faint); line-height:1.7;
  margin-top:10px; padding-left:2px; }
.vfx-readout{ position:sticky; bottom:0; display:flex; margin-top:24px; padding:17px 0 8px;
  border-top:1px solid var(--line2); background:var(--bg); }
.vfx-cell{ flex:1; border-right:1px solid var(--line); padding:0 12px; }
.vfx-cell:first-child{ padding-left:0; }
.vfx-cell:last-child{ border-right:none; padding-right:0; }
.vfx-rv{ font-family:var(--eng); font-weight:700; font-size:26px; letter-spacing:-.01em;
  color:var(--text); line-height:1.05; }
.vfx-rv.good{ color:var(--teal); }
.vfx-rv.warn{ color:var(--rust); }
.vfx-rk{ font-family:var(--eng); font-size:9px; font-weight:600; letter-spacing:.2em;
  color:var(--dim); margin-top:8px; }
.vfx-rk em{ display:block; font-family:var(--sans); font-style:normal; font-size:10px;
  letter-spacing:0; color:var(--faint); margin-top:3px; }

@media (max-width:560px){
  .vfx-name{ font-size:16px; }
  .vfx-rv{ font-size:20px; }
  .vfx-num b{ font-size:15px; }
  .vfx-row{ gap:11px; padding:14px 4px 13px; }
  .vfx-cell{ padding:0 7px; }
  .vfx-bar{ height:30px; }
  .vfx-barlabel{ font-size:9.5px; }
  .vfx-sub{ font-size:10px; }
}

.readout{
  position:sticky; bottom:0; margin-top:18px; padding:14px 0 4px;
  background:linear-gradient(to top, #000 72%, rgba(0,0,0,0));
  display:flex; gap:0; border-top:1px solid var(--line2);
}
.readout-cell{ flex:1; text-align:center; padding:8px 6px; border-right:1px solid var(--line); }
.readout-cell:last-child{ border-right:none; }
.readout-cell .rk{ font-size:10px; color:var(--dim); margin-bottom:5px; }
.readout-cell .rv{ font-family:var(--mono); font-size:15px; color:var(--text); }
.readout-cell .rv.good{ color:var(--teal); }
.readout-cell .rv.warn{ color:var(--rust); }

/* ---------- main experience ---------- */
#experience{ position:absolute; top:0; right:0; bottom:0; left:0; background:#000000; }
#experience[hidden]{ display:none; }
#world{ position:absolute; top:0; right:0; bottom:0; left:0; overflow:hidden; transition:filter .5s ease; background:linear-gradient(#2e2e2e 0%, #141414 55%, #050505 100%); }
#world.dimmed{ filter:brightness(.35) blur(1px); }
.city{ position:absolute; left:0; right:0; bottom:0; height:38%; display:flex; align-items:flex-end; opacity:.9; }
.city i{ display:block; background:#000; flex:none; }
.hud-arc-top{ position:absolute; top:0; left:8%; right:8%; height:3px; background:linear-gradient(90deg, transparent, var(--amber) 35%, var(--amber) 65%, transparent); opacity:.85; }
.hud-gaze{ position:absolute; top:30%; bottom:30%; width:10px; opacity:0; transition:opacity .8s ease; }
.hud-gaze.right{ right:0; background:linear-gradient(to left, rgba(205,67,44,.35), transparent); }
.hud-gaze.left{ left:0; background:linear-gradient(to right, rgba(205,67,44,.35), transparent); }
.hud-gaze.on{ opacity:1; }
.hud-gaze-label{ position:absolute; top:26%; font-size:10px; color:var(--muted); opacity:0; transition:opacity .5s; letter-spacing:.03em; }
.hud-gaze-label.right{ right:22px; text-align:right; }
.hud-gaze-label.left{ left:22px; }
.hud-gaze-label.on{ opacity:1; }

/* live indicators */
.hud-readout{ position:absolute; z-index:12; pointer-events:none; }
.hud-readout .rk{ font-size:9.5px; color:var(--dim); letter-spacing:.04em; }
.hud-readout .rv{ font-family:var(--mono); font-size:17px; color:var(--text); margin-top:2px; }
.hud-readout .rv.small{ font-size:13px; }
.hud-readout .rv.saved{ color:var(--teal); }
.hud-readout .rv.warn{ color:var(--rust); }
#hudTax{ top:22px; left:22px; }
#hudSaved{ top:78px; left:22px; }
#hudVision{ top:22px; right:22px; text-align:right; }
#hudDecid{ top:78px; right:22px; text-align:right; }

.hud-budget{ position:absolute; left:6%; right:6%; bottom:26px; z-index:12; pointer-events:none; }
.hud-budget-head{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--dim); margin-bottom:6px; letter-spacing:.04em; }
.hud-budget-head b{ font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:400; }
.hud-bar{ height:3px; background:var(--line2); position:relative; overflow:hidden; }
.hud-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--rust); opacity:.85; transition:width .5s linear; }
.hud-bar-fill.over{ background:var(--amber); animation:pulseBar 1.2s ease-in-out infinite; }
@keyframes pulseBar{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

.hud-feed{ position:absolute; left:22px; top:146px; z-index:12; pointer-events:none; width:300px; max-width:56%; }
.feed-item{ font-size:10.5px; font-family:var(--mono); color:var(--dim); padding:2px 0; opacity:0; animation:feedIn .35s ease forwards; }
.feed-item .b{ color:var(--teal); }
.feed-item .p{ color:var(--amber); }
@keyframes feedIn{ from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:none;} }

/* passers-by */
.ent{ position:absolute; bottom:0; z-index:8; will-change:transform; pointer-events:none; }
.ent-body{ width:14px; background:#4a4a46; border-radius:7px 7px 0 0; opacity:.85; transition:filter .55s ease, opacity .55s ease, background .55s ease; }
.ent.blocked .ent-body{ background:#000; border:1px dashed rgba(205,67,44,.55); border-bottom:none; opacity:1; }
.ent-tag{ font-family:var(--mono); font-size:9px; white-space:nowrap; margin-top:5px; transform:translateX(-50%); margin-left:7px; color:var(--amber); }
.ent.blocked .ent-tag{ color:var(--teal); }

/* 예산 초과 — 차단이 아니라 블러. 통행에 필요한 윤곽은 남는다. */
#world.over-budget .ent-body{
  background:#4a4a46; border:none; border-radius:7px 7px 0 0;
  opacity:.5; filter:blur(5px);
}
#world.over-budget .ent-tag{ color:var(--teal); opacity:.55; filter:blur(.4px); }
#world.over-budget .city{ filter:blur(2.5px); transition:filter .6s ease; }

.world-hint{
  position:absolute; left:50%; bottom:104px; transform:translateX(-50%);
  font-size:11.5px; color:var(--dim); letter-spacing:.02em; text-align:center; white-space:nowrap;
  opacity:1; transition:opacity 3s ease; z-index:13;
}
.world-hint.faded{ opacity:0; }

.close-progress{ position:fixed; top:0; right:0; bottom:0; left:0; background:radial-gradient(circle at center, transparent 0%, transparent var(--p,150%), rgba(0,0,0,.94) var(--p,150%)); pointer-events:none; z-index:15; transition:none; }

#system{ position:absolute; top:0; right:0; bottom:0; left:0; overflow:hidden; text-align:center; white-space:nowrap; background:#000000; opacity:0; pointer-events:none; transition:opacity .35s ease; z-index:20; }
#system::before{ content:''; display:inline-block; height:100%; vertical-align:middle; width:0; }
#system.active{ opacity:1; pointer-events:auto; }
#sysMenu{ display:inline-block; vertical-align:middle; white-space:normal; text-align:left; width:100%; max-width:440px; padding:30px; }
#sysMenu ul{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
#sysMenu li{ padding:18px 4px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s; display:flex; align-items:baseline; gap:12px; }
#sysMenu li .k{ font-family:var(--mono); font-size:15px; color:var(--text); font-weight:500; flex:none; }
#sysMenu li .s{ font-size:11px; color:var(--dim); flex:1; }
#sysMenu li .v{ font-family:var(--mono); font-size:11px; color:var(--muted); flex:none; }
#sysMenu li.focused{ background:rgba(205,67,44,.09); }
#sysMenu li.focused .k{ color:var(--amber); }
#sysMenu li.void-item{ height:20px; display:block; }
.sys-head{ font-size:10.5px; color:var(--dim); letter-spacing:.04em; margin-bottom:14px; }
.sys-head b{ font-family:var(--mono); color:var(--muted); font-weight:400; }

#sysPanel{ position:absolute; top:0; right:0; bottom:0; left:0; background:#000000; overflow:hidden; text-align:center; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .3s ease; }
#sysPanel::before{ content:''; display:inline-block; height:100%; vertical-align:middle; width:0; }
#sysPanel.active{ opacity:1; pointer-events:auto; }
.panel-inner{ display:inline-block; vertical-align:middle; white-space:normal; text-align:left; width:100%; max-width:560px; padding:64px 40px 40px; }
.panel-title{ font-size:var(--title-size); font-weight:600; line-height:1.25; color:var(--text); margin-bottom:26px; letter-spacing:-.01em; }
.panel-back{ position:absolute; top:26px; left:30px; font-size:11.5px; color:var(--dim); cursor:pointer; z-index:2; }
.panel-back:hover{ color:var(--amber); }
.speak-btn{ position:absolute; top:24px; right:30px; z-index:2; background:transparent; border:1px solid currentColor; color:var(--muted); font-family:var(--sans); font-size:11px; padding:6px 14px; border-radius:999px; cursor:pointer; transition:color .2s; }
.speak-btn:hover, .speak-btn.on{ color:var(--amber); }
.stat-row{ display:flex; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); font-size:13px; gap:16px; }
.stat-row span:first-child{ color:var(--muted); }
.stat-row span:last-child{ font-family:var(--mono); color:var(--text); font-size:14.5px; text-align:right; }
.stat-row.total span:last-child{ color:var(--amber); font-size:16px; }
.crowd{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
.crowd i{ width:6px; height:6px; border-radius:50%; background:var(--faint); display:block; }
.crowd i.focus{ background:var(--amber); box-shadow:0 0 0 3px rgba(205,67,44,.28); }
.italic-line{ font-size:12px; color:var(--muted); font-style:italic; margin-top:16px; line-height:1.7; }
.contract-cols{ display:flex; gap:0; border-top:1px solid var(--line); margin-top:10px; }
.contract-cols > div{ flex:1; padding:16px 14px 14px; border-right:1px solid var(--line); }
.contract-cols > div:last-child{ border-right:none; }
.contract-cols h5{ font-family:var(--mono); font-size:11.5px; margin:0 0 10px; letter-spacing:.02em; }
.contract-cols p{ font-size:12px; color:var(--text); line-height:1.6; margin:0; }
.hold-slider{ width:100%; margin:24px 0 10px; accent-color:var(--amber); }
.hold-compare{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-family:var(--mono); }
.hold-warn{ font-size:11.5px; color:var(--rust); margin-top:18px; line-height:1.6; transition:opacity .3s; }
.ring-family{ display:flex; align-items:center; gap:34px; }
.ring-svg text{ font-family:var(--mono); }
.placeholder-note{ font-size:12.5px; color:var(--dim); line-height:1.7; }
.tabs{ display:flex; border-bottom:1px solid var(--line); margin-bottom:18px; }
.tab{ padding:9px 16px; font-size:12px; color:var(--dim); cursor:pointer; border-bottom:1px solid transparent; margin-bottom:-1px; transition:color .18s, border-color .18s; }
.tab:hover{ color:var(--text); }
.tab.on{ color:var(--amber); border-bottom-color:var(--amber); }
.pbar{ height:3px; background:var(--line2); position:relative; margin:8px 0 4px; }
.pbar > i{ position:absolute; left:0; top:0; bottom:0; background:var(--rust); display:block; }
.pbar > i.teal{ background:var(--teal); }
.pbar-legend{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--dim); font-family:var(--mono); }
.big-metric{ font-family:var(--mono); font-size:34px; color:var(--amber); line-height:1; margin:4px 0 6px; }
.big-metric small{ font-size:13px; color:var(--muted); margin-left:6px; }
.miss-list{ font-size:12px; color:var(--muted); line-height:1.9; margin-top:14px; }
.miss-list i{ color:var(--rust); font-style:normal; margin-right:8px; }

/* ---------- camera / eye tracking ---------- */
#camFeed{ position:fixed; width:150px; height:112px; left:50%; margin-left:-75px; bottom:100px; object-fit:cover;
  border:1px solid var(--line2); border-radius:4px; z-index:30; opacity:.5; transform:scaleX(-1);
  display:none; pointer-events:none; }
#camFeed.show{ display:block; }
.cam-chip{
  position:fixed; left:50%; transform:translateX(-50%); bottom:56px; z-index:31; display:flex; align-items:center; gap:9px;
  border:1px solid var(--line2); border-radius:999px; padding:7px 14px 7px 11px; cursor:pointer;
  background:rgba(0,0,0,.55); transition:border-color .2s;
}
.cam-chip:hover{ border-color:var(--amber-dim); }
.cam-chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--dim); flex:none; transition:background .2s; }
.cam-chip.open .dot{ background:var(--amber); box-shadow:0 0 0 4px rgba(205,67,44,.16); }
.cam-chip.shut .dot{ background:var(--teal); box-shadow:none; }
.cam-chip .lbl{ font-size:10.5px; color:var(--muted); white-space:nowrap; letter-spacing:.02em; }
.cam-chip .eb{ width:40px; height:2px; background:var(--line2); position:relative; flex:none; }
.cam-chip .eb > i{ position:absolute; left:0; top:0; bottom:0; background:var(--amber); width:0%; }
.cam-chip.off{ opacity:.55; }
/* 음성 명령 상태 칩 — 온보딩 조작 중에만, 우상단에 조용히 */
.vc-chip{ left:auto; right:16px; bottom:auto; top:16px; transform:none;
  padding:6px 12px 6px 10px; }
.vc-chip .dot{ background:var(--dim); }
.vc-chip.listening .dot{ background:var(--amber); box-shadow:0 0 0 4px rgba(205,67,44,.16); }
.vc-chip.listening .lbl{ color:var(--amber); }
@media (max-width:640px){ .vc-chip{ top:auto; bottom:96px; right:12px; } }
.cam-chip[hidden], .aud-chip[hidden]{ display:none; }

/* 손 커서 — 검지 끝을 따라다니는 점 + 링 */
#handCursor{ position:fixed; left:0; top:0; z-index:60; pointer-events:none;
  transform:translate(-50%,-50%); transition:opacity .2s ease; }
#handCursor[hidden]{ display:none; }
#handCursor .hc-dot{ position:absolute; left:0; top:0; width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
  border-radius:50%; background:var(--amber); box-shadow:0 0 10px 2px rgba(205,67,44,.5); }
#handCursor .hc-ring{ position:absolute; left:0; top:0; width:34px; height:34px; margin:-17px 0 0 -17px;
  border:1px solid rgba(205,67,44,.5); border-radius:50%;
  transition:width .12s, height .12s, margin .12s, border-color .12s; }
#handCursor.snap .hc-ring{ border-color:var(--amber); box-shadow:0 0 0 3px rgba(205,67,44,.12); }
#handCursor.pinch .hc-ring{ width:16px; height:16px; margin:-8px 0 0 -8px; border-color:#fff; }
#handCursor.pinch .hc-dot{ background:#fff; }

.aud-chip{
  position:fixed; left:50%; transform:translateX(-50%); bottom:20px; z-index:31;
  display:flex; align-items:center; gap:8px; border:1px solid var(--line2); border-radius:999px;
  padding:6px 13px; cursor:pointer; background:rgba(0,0,0,.55); transition:border-color .2s;
}
.aud-chip:hover{ border-color:var(--amber-dim); }
.aud-chip .lbl{ font-size:10.5px; color:var(--muted); white-space:nowrap; letter-spacing:.02em; }
.aud-chip.on .lbl{ color:var(--amber); }
.aud-wave{ display:flex; align-items:flex-end; gap:2px; height:10px; }
.aud-wave i{ width:2px; height:3px; background:var(--dim); display:block; }
.aud-chip.on .aud-wave i{ background:var(--amber); }
.aud-chip.on.talking .aud-wave i{ animation:wv .7s ease-in-out infinite; }
.aud-chip.on.talking .aud-wave i:nth-child(2){ animation-delay:.12s; }
.aud-chip.on.talking .aud-wave i:nth-child(3){ animation-delay:.24s; }
.aud-chip.on.talking .aud-wave i:nth-child(4){ animation-delay:.36s; }
@keyframes wv{ 0%,100%{ height:3px; } 50%{ height:10px; } }

.calib-instr{
  position:fixed; top:9vh; left:0; right:0; z-index:6; text-align:center; padding:0 22px;
  font-size:var(--title-size); font-weight:600; line-height:1.3; letter-spacing:-.01em; color:var(--text);
}
.calib-num{
  position:fixed; top:0; right:0; bottom:0; left:0; z-index:5;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:min(52vw, 62vh); line-height:1;
  color:var(--text); pointer-events:none; user-select:none;
}
.calib-num span{ display:block; animation:numIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes numIn{ from{ opacity:0; transform:scale(1.18); } to{ opacity:1; transform:scale(1); } }
.calib-hint{
  position:fixed; bottom:11vh; left:0; right:0; z-index:6; text-align:center;
  font-size:12.5px; color:var(--dim); letter-spacing:.02em; min-height:18px;
}
.calib-track{ position:fixed; bottom:7vh; left:22%; right:22%; height:1px; background:var(--line2); z-index:6; }
.calib-track > i{ display:block; height:100%; width:0%; background:var(--amber); }

.gather-word{
  position:fixed; top:0; right:0; bottom:0; left:0; z-index:5;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-weight:600; font-size:min(4.5vw, 31px); letter-spacing:.06em; color:var(--text);
}
.gather-word b{ font-weight:600; opacity:.18; animation:gth 1.5s ease-in-out infinite; }
@keyframes gth{ 0%,100%{ opacity:.18; } 50%{ opacity:1; } }
/* ---------- VERIFIED — 체크가 아니라 스캔 락 ---------- */
.verify-mark{ position:fixed; top:0; right:0; bottom:0; left:0; z-index:5;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:22px; }
.vf-stage{ position:relative; width:min(34vw,190px); height:min(34vw,190px); }
.vf-stage svg{ width:100%; height:100%; display:block; overflow:visible; }

.vf-br{ fill:none; stroke:var(--amber); stroke-width:2.5; stroke-linecap:square;
  opacity:0; transform-box:view-box; transform-origin:100px 100px; animation:vfSnap .42s cubic-bezier(.16,1.1,.3,1) forwards; }
.vf-br.b2{ animation-delay:.05s; } .vf-br.b3{ animation-delay:.1s; } .vf-br.b4{ animation-delay:.15s; }
@keyframes vfSnap{ from{ opacity:0; transform:scale(1.55); } 70%{ opacity:1; } to{ opacity:1; transform:scale(1); } }

.vf-ring{ fill:none; stroke:var(--amber); stroke-width:1; opacity:.5;
  stroke-dasharray:6 10; transform-box:view-box; transform-origin:100px 100px; animation:vfSpin 5.5s linear infinite; }
@keyframes vfSpin{ to{ transform:rotate(360deg); } }

.vf-iris{ fill:none; stroke:var(--amber); stroke-width:1.5; transform-box:view-box; transform-origin:100px 100px;
  stroke-dasharray:264; stroke-dashoffset:264; animation:vfDraw .55s .12s cubic-bezier(.3,.9,.3,1) forwards; }
@keyframes vfDraw{ to{ stroke-dashoffset:0; } }

.vf-cross{ stroke:var(--amber); stroke-width:1; opacity:0;
  animation:vfCross .3s .5s ease forwards; }
@keyframes vfCross{ from{ opacity:0; transform:scale(.4); } to{ opacity:.9; transform:scale(1); } }
.vf-cross{ transform-box:view-box; transform-origin:100px 100px; }

.vf-scan{ position:absolute; left:-18%; right:-18%; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--amber), transparent);
  box-shadow:0 0 14px 2px rgba(205,67,44,.55); opacity:0;
  animation:vfScan .85s .1s cubic-bezier(.5,0,.2,1) forwards; }
@keyframes vfScan{
  0%{ transform:translateY(0); opacity:0; }
  12%{ opacity:1; }
  88%{ opacity:1; }
  100%{ transform:translateY(min(34vw,190px)); opacity:0; }
}

.vf-flash{ position:fixed; top:0; right:0; bottom:0; left:0; z-index:6; pointer-events:none;
  background:var(--amber); opacity:0; mix-blend-mode:screen; animation:vfFlash .5s .62s ease-out forwards; }
@keyframes vfFlash{ 0%{ opacity:0; } 8%{ opacity:.17; } 22%{ opacity:.02; } 30%{ opacity:.09; } 100%{ opacity:0; } }

.verify-word{ position:relative; font-weight:600; font-size:min(8vw,44px); letter-spacing:.16em;
  color:var(--text); animation:vfShift 1.5s .55s steps(1,end); }
@keyframes vfShift{
  0%,100%{ transform:none; text-shadow:none; }
  41%{ transform:translateX(-2px); text-shadow:2px 0 var(--amber), -2px 0 var(--teal); }
  43%{ transform:translateX(3px); text-shadow:-3px 0 var(--amber); }
  45%{ transform:none; text-shadow:none; }
  72%{ transform:translateX(2px); text-shadow:-2px 0 var(--amber); }
  74%{ transform:none; text-shadow:none; }
}
.vf-meta{ font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; color:var(--dim);
  opacity:0; animation:riseIn .5s 1.35s ease forwards; }
.vf-meta b{ color:var(--amber); font-weight:400; }
.cam-err{ font-size:11.5px; color:var(--rust); margin-top:16px; line-height:1.6; }

.corner-brand{ position:fixed; left:22px; bottom:8px; font-family:var(--mono); font-size:10px; color:var(--faint); letter-spacing:.05em; opacity:1; transition:opacity 2.5s ease; z-index:5;}
.corner-brand.faded{ opacity:0; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
@media (max-width:640px){
  .voice-line{ font-size:15.5px; padding:0 8px; }
  .contract-cols{ flex-direction:column; }
  .contract-cols > div{ border-right:none; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .panel-inner{ padding:64px 24px 40px; }
  #sysMenu{ padding:24px 20px; }
  .hud-readout .rv{ font-size:14px; }
  #hudTax{ top:16px; left:16px; } #hudSaved{ top:62px; left:16px; }
  #hudVision{ top:16px; right:16px; } #hudDecid{ top:62px; right:16px; }
  .hud-feed{ left:16px; top:118px; width:auto; right:16px; max-width:none; }
  .flt-meta{ font-size:10px; }
  .readout-cell .rv{ font-size:13px; }
}
/* ---------- 온보딩 뒤로가기 ---------- */
.ob-back{
  position:fixed; top:22px; left:24px; z-index:30;
  background:transparent; border:none; padding:6px 4px;
  font-family:var(--sans); font-size:11.5px; letter-spacing:.02em;
  color:var(--dim); cursor:pointer; transition:color .2s;
}
.ob-back:hover{ color:var(--amber); }
.ob-back:focus-visible{ outline:1px solid var(--amber); outline-offset:2px; }
.ob-back[hidden]{ display:none; }
.ob-indicator{
  position:absolute; top:22px; left:50%; transform:translateX(-50%); z-index:5;
  display:flex; align-items:center; gap:10px; color:var(--faint); pointer-events:none;
}
.ob-step-count{ font-family:var(--eng); font-size:9px; letter-spacing:.12em; white-space:nowrap; }
.ob-dots{ display:flex; align-items:center; gap:5px; }
.ob-dot{ width:4px; height:4px; border-radius:0; background:var(--line2); transition:all .25s ease; }
.ob-dot.on{ width:18px; border-radius:0; background:var(--amber); }
.ob-dot.done{ background:var(--dim); }
@media (max-width:640px){ .ob-back{ top:14px; left:14px; } .ob-indicator{ top:16px; } }

/* ---------- 두 번째 하이라이트 (호버) ---------- */
.vfx-row.hov::before{ width:100%; background:rgba(140,143,137,.10); }
.vfx-row.hov .vfx-idx{ color:var(--hl2); }
.vfx-row.hov .vfx-name{ color:#fff; }
.dec-row{ cursor:default; }
.dec-row .vfx-mark{ display:none; }          /* 결정도 목록은 선택하는 것이 아니다 */
.dcx-seg.hov{ background:var(--hl2); box-shadow:none; }
.dcx-seg.hov b{ color:var(--bg); }
.dcx-seg.hov u{ color:rgba(0,0,0,.45); }

/* ---------- 이미지 스캔 ---------- */
/* 데이터가 많은 화면이라 다른 화면(75vw)보다 넓게 쓴다 */
#ob-content:has(.imx){ max-width:92vw; }
.imx{ max-width:1980px; margin:4px auto 0; text-align:left; position:relative; }
.imx-focus{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(420px, 460px); gap:28px; align-items:start; position:relative; }
.imx-detail{ min-width:0; padding:2px 2px 0 0; position:relative; align-self:start; max-height:none; overflow:visible; }
.imx-main{ min-width:0; }
.imx-detail .imx-era{ margin-top:0; }
.imx-stage{ position:relative; width:100%; height:clamp(360px, 53vh, 510px); margin:0; }
.imx-stage canvas{ width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
.imx-stage canvas:active{ cursor:grabbing; }
.imx-face{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; cursor:grab; touch-action:none; user-select:none; -webkit-user-drag:none; }
.imx-model{ position:absolute; inset:0; width:100%; height:100%; background:transparent; --poster-color:transparent; cursor:grab; }
.imx-stage.spinning{ cursor:grabbing; }
.imx-stage.spinning .imx-face{ cursor:grabbing; }
.imx-c{ position:absolute; width:13px; height:13px; border:1px solid var(--line2); pointer-events:none; }
.imx-c.tl{ left:0; top:0; border-right:none; border-bottom:none; }
.imx-c.tr{ right:0; top:0; border-left:none; border-bottom:none; }
.imx-c.bl{ left:0; bottom:0; border-right:none; border-top:none; }
.imx-c.br{ right:0; bottom:0; border-left:none; border-top:none; }
.imx-badge{ position:absolute; left:24px; top:5px; font-size:9.5px; font-weight:600;
  letter-spacing:.24em; color:var(--dim); pointer-events:none; }
.imx-badge b{ color:var(--amber); font-weight:600; }
.imx-hint{ font-size:7.5px; font-weight:600; letter-spacing:.20em; color:var(--faint);
  text-align:center; margin-top:2px; }

/* ---------- 상단 고정 두상 ---------- */
/* 스크롤해도 두상이 남아 있어야, 아래 타임라인을 누른 결과를 바로 볼 수 있다. */
.imx-sticky{ position:relative; z-index:20; background:var(--bg); padding:4px 0 8px; }
.imx-sticky::before{ content:''; position:absolute; top:0; bottom:0; left:-40px; right:-40px;
  background:var(--bg); z-index:-1; }
.imx-sticky::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:16px;
  background:linear-gradient(var(--bg), rgba(0,0,0,0)); transform:translateY(100%);
  pointer-events:none; }
.imx-side{ display:flex; align-items:center; gap:12px; padding:10px 2px 9px; }
.sd-t{ flex:1; min-width:0; font-size:10.5px; color:var(--muted); line-height:1.6; }
.sd-t b{ font-weight:600; color:#E8E8E2; margin-right:5px; }
.imx-side.back .sd-t b{ color:var(--amber); }
.sd-t span{ display:block; font-family:var(--mono); font-size:10px; color:var(--dim);
  margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.imx-flip{ flex:none; background:transparent; border:1px solid var(--line2);
  color:var(--muted); font-family:var(--sans); font-size:10px; padding:6px 11px;
  cursor:pointer; transition:border-color .2s ease, color .2s ease; }
.imx-flip:hover{ border-color:var(--amber); color:var(--amber); }
.imx-flip:focus-visible{ outline:1px solid var(--amber); outline-offset:2px; }
.imx-foot{ display:flex; align-items:baseline; gap:12px; padding:9px 2px 8px;
  border-top:1px solid var(--line2); border-bottom:1px solid var(--line); }
.imx-foot .ft-ym{ font-family:var(--eng); font-size:12px; font-weight:700; color:var(--text);
  font-feature-settings:'tnum' 1; }
.imx-foot .ft-age{ font-family:var(--eng); font-size:11px; font-weight:700; color:var(--amber);
  font-feature-settings:'tnum' 1; }
.imx-foot .ft-nm{ flex:1; min-width:0; font-size:12px; font-weight:600; color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.imx-foot .ft-dec{ font-family:var(--eng); font-size:12px; font-weight:700; color:var(--text);
  font-feature-settings:'tnum' 1; }
.imx-foot .ft-dec em{ font-style:normal; font-size:8px; letter-spacing:.2em;
  color:var(--dim); margin-right:5px; }
.imx-read{ margin-top:34px; border-top:1px solid var(--line2); }
.rdr{ display:flex; align-items:center; gap:16px; padding:14px 2px 13px; border-bottom:1px solid var(--line); }
.rdr-k{ width:104px; flex:none; }
.rdr-k b{ display:block; font-size:13.5px; font-weight:600; color:var(--text); letter-spacing:-.01em; }
.rdr-k em{ display:block; font-family:var(--eng); font-style:normal; font-size:8.5px;
  font-weight:600; letter-spacing:.2em; color:var(--faint); margin-top:4px; }
.rdr-mid{ flex:1; min-width:0; }
.rdr-d{ font-family:var(--mono); font-size:10px; color:var(--dim); margin-bottom:9px; line-height:1.5; }
.rdr-b{ height:2px; background:var(--line2); position:relative; }
.rdr-b i{ position:absolute; left:0; top:0; bottom:0; background:var(--amber);
  transition:width .55s cubic-bezier(.2,.8,.2,1); }
.rdr-v{ font-family:var(--eng); font-weight:700; font-size:19px; color:var(--text);
  width:42px; text-align:right; flex:none; font-feature-settings:'tnum' 1; }

/* ---------- 라이프 타임라인 — 긍정/부정을 종합한 단일 인상선 ---------- */
.lifegraph{ position:relative; margin-top:5px; padding-bottom:45px;
  border-top:1px solid var(--line2); padding-top:16px; }
.lg-svg{ display:block; width:100%; height:auto; overflow:visible; }
.lg-grid{ stroke:var(--line); stroke-width:.55; opacity:.32; }
.lg-grid.major{ opacity:.62; stroke:var(--line2); }
.lg-zero{ stroke:var(--line2); stroke-width:1; }
.lg-composite{ fill:none; stroke:#E8E8E2; stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
.lg-composite-dot{ fill:var(--bg); stroke:#E8E8E2; stroke-width:1.5; }
.lg-composite-dot.on{ fill:#E8E8E2; stroke-width:2; }
.lg-axis{ stroke:var(--line2); stroke-width:1; }
.lg-pred{ stroke:var(--line2); stroke-width:1; stroke-dasharray:2 4; }
.lg-stem{ stroke:var(--line); stroke-width:1; }
.lg-area.pos{ fill:url(#lgPos); }
.lg-area.neg{ fill:url(#lgNeg); }
.lg-line{ fill:none; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
.lg-line.pos{ stroke:#E8E8E2; opacity:.72; }
.lg-line.neg{ stroke:var(--amber); }
.lg-dot{ fill:var(--bg); stroke-width:1.4; transition:r .2s ease; }
.lg-dot.pos{ stroke:#E8E8E2; }
.lg-dot.neg{ stroke:var(--amber); }
.lg-dot.on{ r:4.6; stroke-width:1.8; }
.lg-dot.pos.on{ fill:#E8E8E2; }
.lg-dot.neg.on{ fill:var(--amber); }
.lg-yl{ position:absolute; left:0; font-family:var(--eng); font-size:8.5px; font-weight:700;
  letter-spacing:.24em; color:var(--dim); }
.lg-yl.top{ top:20px; }
.lg-yl.bot{ bottom:66px; }
.lg-predlab{ position:absolute; right:0; top:20px; font-family:var(--eng); font-size:8.5px;
  font-weight:700; letter-spacing:.24em; color:var(--faint); }

.lg-node{ position:absolute; top:22px; bottom:0; width:84px; margin-left:-42px;
  background:transparent; border:none; padding:0; cursor:pointer;
  display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
.lg-stick{ position:absolute; left:50%; top:0; bottom:52px; width:1px; margin-left:-.5px;
  background:transparent; transition:background .2s ease; }
.lg-node:hover .lg-stick{ background:rgba(140,143,137,.24); }
.lg-node.on .lg-stick{ background:rgba(205,67,44,.42); }
.lg-lab{ display:block; text-align:center; padding:6px 2px 0; width:100%;
  border-top:1px solid var(--line); transition:border-color .2s ease; }
.lg-node:hover .lg-lab{ border-top-color:var(--hl2); }
.lg-node.on .lg-lab{ border-top-color:var(--amber); }
.lg-lab u{ display:block; font-family:var(--eng); font-size:13.5px; font-weight:700;
  letter-spacing:.04em; color:var(--dim); text-decoration:none; font-feature-settings:'tnum' 1; }
.lg-lab b{ display:block; font-family:var(--eng); font-size:16.5px; font-weight:700;
  color:var(--muted); margin-top:3px; font-feature-settings:'tnum' 1; }
.lg-lab s{ display:block; font-size:14.25px; font-weight:600; color:var(--faint);
  margin-top:3px; text-decoration:none; }
.lg-node.on .lg-lab b{ color:var(--text); }
.lg-node.on .lg-lab u, .lg-node.on .lg-lab s{ color:var(--amber); }
.lg-node.pred .lg-lab u, .lg-node.pred .lg-lab b{ font-style:italic; }
.lg-node:focus-visible{ outline:1px solid var(--amber); outline-offset:2px; }


.trait-summary{ border-top:1px solid var(--line2); margin-top:6px; padding-top:4px;
  display:grid; grid-template-columns:1fr 1fr; column-gap:44px; }
@media (max-width:560px){ .trait-summary{ grid-template-columns:1fr; column-gap:0; } }
.trait-read{ padding:16px 0; border-bottom:1px solid var(--line); }
.trait-read-head{ display:flex; align-items:baseline; gap:10px; }
.trait-read-head b{ font-size:19px; font-weight:600; color:var(--text); letter-spacing:-.01em; }
.trait-read-head em{ font-family:var(--eng); font-style:normal; font-size:11px; font-weight:700; letter-spacing:.2em; color:var(--faint); }
.trait-read-head .lean{ margin-left:auto; font-family:var(--eng); font-feature-settings:'tnum' 1;
  font-size:18px; color:var(--amber); font-weight:700; letter-spacing:.01em; }
.trait-read-head .lean.mid{ color:var(--muted); font-weight:400; }
.trait-meter{ position:relative; height:1px; background:var(--line2); margin:18px 0 14px; }
.trait-meter .mid{ position:absolute; left:50%; top:-4px; width:1px; height:9px; background:var(--line2); }
.trait-meter .pin{ position:absolute; top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px;
  border-radius:50%; background:var(--amber); transition:left .3s ease; }
.trait-meter .pin.neutral{ background:transparent; border:1px solid var(--muted); }
.trait-poles{ display:flex; justify-content:space-between; }
.trait-poles span{ font-size:15px; color:var(--faint); }
.trait-poles span.on{ color:var(--text); font-weight:600; }

/* ---------- 특성 — 선택 연령대 상세 ---------- */
.trait-cols{ display:grid; grid-template-columns:1fr; gap:0; }
.trait-cols .trait-col{ width:100%; }
.trait-cols .trait-col + .trait-col{ margin-top:18px; }
.trait-col{ min-width:0; }
.tc-h{ display:flex; align-items:baseline; gap:7px; padding-bottom:9px;
  border-bottom:1px solid var(--line2); }
.tc-h b{ font-size:13px; font-weight:600; }
.tc-h em{ flex:1; font-family:var(--eng); font-style:normal; font-size:8px; font-weight:700;
  letter-spacing:.2em; color:var(--faint); }
.tc-h u{ font-family:var(--eng); font-size:11px; font-weight:700; text-decoration:none;
  color:var(--dim); font-feature-settings:'tnum' 1; }
.trait-col.pos .tc-h b{ color:#E8E8E2; }
.trait-col.neg .tc-h b{ color:var(--amber); }
.tr2{ display:flex; align-items:center; gap:9px; padding:8px 0 7px;
  border-bottom:1px solid var(--line); }
.tr2 b{ font-size:12.5px; font-weight:600; color:var(--text); letter-spacing:-.01em;
  white-space:nowrap; }
.tr2 em{ flex:1; min-width:0; font-family:var(--eng); font-style:normal; font-size:8px;
  font-weight:700; letter-spacing:.14em; color:var(--faint); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.tr2-p{ display:flex; gap:2px; width:34px; flex:none; }
.tr2-p s{ display:block; width:100%; height:2px; background:var(--line2); text-decoration:none; }
.trait-col.pos .tr2-p s.f{ background:#E8E8E2; }
.trait-col.neg .tr2-p s.f{ background:var(--amber); }

.imx-era{ margin-top:4px; }
.imx-era-top{ display:flex; align-items:baseline; gap:12px; }
.imx-timeline{ margin-top:10px; padding-top:16px; border-top:1px solid var(--line2); }
.imx-era-name{ font-size:25px; font-weight:600; letter-spacing:-.02em; color:var(--text); line-height:1.1; }
.imx-era-dec{ font-family:var(--eng); font-weight:700; font-size:15px; color:var(--amber);
  font-feature-settings:'tnum' 1; }
.imx-era-dec em{ font-style:normal; font-size:8.5px; letter-spacing:.2em; color:var(--dim); margin-right:6px; }
.imx-era-line{ font-size:12px; color:var(--muted); line-height:1.75; margin-top:12px; max-width:520px; }
.imx-tr-label{ font-family:var(--eng); font-size:8.5px; font-weight:600; letter-spacing:.26em;
  color:var(--faint); margin:24px 0 11px; }


@media (max-width:560px){
  .imx-sticky{ padding-top:36px; }
  .imx-stage{ height:clamp(250px,42vh,340px); }
  .imx-flip{ font-size:9.5px; padding:5px 8px; }
  .sd-t{ font-size:9.5px; }
  .sd-t span{ font-size:9px; }
  .imx-foot{ gap:8px; }
  .imx-foot .ft-ym, .imx-foot .ft-dec{ font-size:11px; }
  .imx-foot .ft-nm{ font-size:11px; }
  .rdr-k{ width:78px; }
  .rdr-k b{ font-size:12.5px; }
  .rdr-d{ display:none; }
  .rdr-v{ font-size:16px; width:34px; }
  .imx-era-name{ font-size:22px; }
  .lifegraph{ padding-bottom:56px; }
  .lg-node{ width:76px; margin-left:-38px; }
  .lg-stick{ bottom:56px; }
  .lg-yl.bot{ bottom:60px; }
  .lg-lab u{ font-size:7.5px; letter-spacing:0; }
  .lg-lab b{ font-size:10px; }
  .lg-lab s{ font-size:9px; }
  .lg-yl, .lg-predlab{ font-size:7.5px; letter-spacing:.14em; }
  .imx-focus{ grid-template-columns:1fr; gap:18px; }
  .imx-stage{ height:clamp(300px,48vh,420px); }
  .imx-detail{ padding-top:0; }
  .trait-cols{ grid-template-columns:1fr; gap:0; }
  .trait-col.neg{ margin-top:18px; }
}

/* ---------- 프로필 직업 선택 ---------- */
.job-groups{ display:grid; gap:8px; }
.job-group{ border:1px solid var(--line2); }
.job-group-toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 14px; background:transparent; border:0; color:var(--text); text-align:left; cursor:pointer; }
.job-group-toggle .jg-main{ display:flex; align-items:baseline; gap:8px; }
.job-group-toggle b{ font-size:12px; font-weight:600; }
.job-group-toggle em{ font-family:var(--eng); font-style:normal; font-size:8px; letter-spacing:.18em; color:var(--faint); }
.job-group-toggle i{ font-style:normal; color:var(--dim); font-size:13px; transition:transform .2s ease; }
.job-group.open .job-group-toggle{ border-bottom:1px solid var(--line2); }
.job-group.open .job-group-toggle i{ transform:rotate(45deg); color:var(--amber); }
.job-chips{ display:none; flex-wrap:wrap; gap:7px; padding:12px 13px 14px; }
.job-group.open .job-chips{ display:flex; }
.job-chips .chip{ margin:0; }
@media (max-width:760px){
  .imx{ max-width:100%; }
  .imx-focus{ grid-template-columns:1fr; gap:12px; }
  .imx-detail{ position:relative; top:auto; max-height:none; overflow:visible; padding-right:0; }
  .imx-stage{ height:clamp(300px,50vh,430px); }
}
@media (max-width:560px){
  .imx-stage{ height:clamp(250px,44vh,340px); }
  .lifegraph{ padding-bottom:50px; }
  .lg-node{ width:70px; margin-left:-35px; }
  .lg-stick{ bottom:50px; }
  .lg-yl.bot{ bottom:54px; }
}

/* ---------- GAZER — 공개 관측망 중계 ---------- */
.gz-box{ position:relative; width:100%; aspect-ratio:16/9; background:#080807;
  border:1px solid var(--line2); overflow:hidden; margin:18px 0 0; }
.gz-box video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  filter:grayscale(.88) contrast(1.1) brightness(.92); opacity:0; transition:opacity .8s ease; }
.gz-box.live video{ opacity:1; }
.gz-scan{ position:absolute; left:0; right:0; top:0; height:1px; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(205,67,44,.55), transparent);
  animation:gzScan 4.2s linear infinite; }
@keyframes gzScan{ 0%{ transform:translateY(0); } 100%{ transform:translateY(100%); } }
.gz-grid{ position:absolute; inset:0; pointer-events:none; opacity:.25;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size:100% 14px, 14px 100%; }
.gz-c{ position:absolute; width:14px; height:14px; border:1px solid rgba(205,67,44,.75); pointer-events:none; }
.gz-c.tl{ left:8px; top:8px; border-right:none; border-bottom:none; }
.gz-c.tr{ right:8px; top:8px; border-left:none; border-bottom:none; }
.gz-c.bl{ left:8px; bottom:8px; border-right:none; border-top:none; }
.gz-c.br{ right:8px; bottom:8px; border-left:none; border-top:none; }
.gz-tag{ position:absolute; left:10px; top:24px; font-family:var(--mono); font-size:10px;
  letter-spacing:.06em; color:var(--text); text-shadow:0 1px 3px #000; pointer-events:none;
  max-width:70%; line-height:1.5; }
.gz-tag i{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--rust);
  margin-right:6px; animation:breathe 2.2s ease-in-out infinite; }
.gz-coord{ position:absolute; right:10px; top:24px; font-family:var(--mono); font-size:9.5px;
  color:var(--muted); text-align:right; text-shadow:0 1px 3px #000; pointer-events:none; line-height:1.6; }
.gz-foot{ position:absolute; left:10px; right:10px; bottom:22px; display:flex;
  justify-content:space-between; align-items:flex-end; font-family:var(--mono);
  font-size:9.5px; color:var(--muted); text-shadow:0 1px 3px #000; pointer-events:none; }
.gz-foot b{ color:var(--rust); font-weight:400; }
.gz-state{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:10px; text-align:center; padding:24px; }
.gz-box.live .gz-state{ display:none; }
.gz-state .s1{ font-family:var(--eng); font-size:11px; font-weight:700; letter-spacing:.26em; color:var(--dim); }
.gz-state .s2{ font-size:11px; color:var(--faint); line-height:1.7; max-width:340px; }
.gz-bar{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.gz-btn{ background:transparent; border:1px solid var(--line2); color:var(--muted);
  font-family:var(--sans); font-size:11.5px; padding:8px 14px; border-radius:999px;
  cursor:pointer; transition:color .18s, border-color .18s; }
.gz-btn:hover{ color:var(--amber); border-color:var(--amber-dim); }
.gz-btn:disabled{ opacity:.35; cursor:default; }
.gz-key{ display:flex; gap:8px; margin-top:12px; }
.gz-key input{ flex:1; min-width:0; background:transparent; border:none;
  border-bottom:1px solid var(--line2); color:var(--text); font-family:var(--mono);
  font-size:11.5px; padding:7px 2px; outline:none; }
.gz-key input:focus{ border-bottom-color:var(--amber); }
</style>
</head>
<body>
<div id="app">

  <section id="onboarding">
    <button class="ob-back" id="obBack" type="button" hidden>← 뒤로</button>
    <div class="ob-indicator" id="obIndicator" aria-label="진행 단계"><span class="ob-step-count" id="obStepCount">01 / 10</span><div class="ob-dots" id="obDots"></div></div>
    <div id="ob-content"></div>
  </section>

  <main id="experience" hidden>
    <div id="world">
      <div class="city" id="city"></div>
      <div class="hud-arc-top"></div>
      <div class="hud-gaze right" id="gazeRight"></div>
      <div class="hud-gaze left" id="gazeLeft"></div>
      <div class="hud-gaze-label right" id="gazeLabelRight">피응시 · 우측</div>
      <div class="hud-gaze-label left" id="gazeLabelLeft">피응시 · 좌측</div>

      <div class="hud-readout" id="hudTax"><div class="rk">오늘 관측세</div><div class="rv" id="rvTax">₩0</div></div>
      <div class="hud-readout" id="hudSaved"><div class="rk">차단으로 아낀 금액</div><div class="rv small saved" id="rvSaved">₩0</div></div>
      <div class="hud-readout" id="hudVision"><div class="rk">시야 완성도</div><div class="rv" id="rvVision">100%</div></div>
      <div class="hud-readout" id="hudDecid"><div class="rk">결정도</div><div class="rv small" id="rvDecid">0.71</div></div>

      <div class="hud-feed" id="hudFeed"></div>

      <div class="hud-budget">
        <div class="hud-budget-head">
          <span>오늘 예산 잔여 <b id="bdLeft">100%</b></span>
          <span id="bdAmt">₩0 / ₩6,000</span>
        </div>
        <div class="hud-bar"><div class="hud-bar-fill" id="bdFill"></div></div>
      </div>

      <div class="world-hint" id="worldHint">화면을 눌러 SYSTEM 열기</div>
    </div>

    <div class="close-progress" id="closeProgress" style="--p:150%"></div>

    <div id="system">
      <div id="sysMenu">
        <div class="sys-head" id="sysHead"></div>
        <ul id="sysList"></ul>
      </div>
      <div id="sysPanel">
        <div class="panel-back" id="panelBack">← 뒤로</div>
        <button class="speak-btn" id="speakBtn" hidden>낭독</button>
        <div class="panel-inner" id="panelInner"></div>
      </div>
    </div>

    <div class="corner-brand" id="cornerBrand">IN-SIGHT OS · WEAR</div>
  </main>

  <video id="camFeed" playsinline muted autoplay></video>
  <div class="cam-chip off" id="camChip" hidden>
    <span class="dot"></span><span class="lbl" id="camLbl">카메라 꺼짐</span>
    <span class="eb"><i id="camBar"></i></span>
  </div>
  <div class="aud-chip on" id="audChip" hidden>
    <span class="aud-wave"><i></i><i></i><i></i><i></i></span>
    <span class="lbl" id="audLbl">음성 안내 켜짐</span>
  </div>
  <div class="cam-chip vc-chip off" id="vcChip" hidden>
    <span class="dot"></span><span class="lbl" id="vcLbl">음성 명령 대기</span>
  </div>
  <div id="handCursor" hidden><i class="hc-dot"></i><i class="hc-ring"></i></div>

  <div id="mirrorFlashFull" class="hidden"><span>탭하여 돌아가기</span></div>
</div>

<script type="module">
import { FaceLandmarker, HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const HAND_MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// 메인 스크립트가 폴링하는 공유 상태
window.EYE = { supported:true, active:false, ready:false, closed:false, score:0, face:false, error:null,
  // 끄덕임: 코끝 y가 아래로 내려갔다 올라오면 nodSeq 가 1 증가한다. 메인이 이 값을 폴링한다.
  nodSeq:0, shakeSeq:0,
  // 손: 검지 끝을 커서로. present=손 보임, x/y=정규화 좌표(셀피 미러 반영),
  // pinch=엄지+검지 붙음, pinchSeq=집는 순간 1 증가(클릭 엣지).
  hand:{ present:false, x:0.5, y:0.5, pinch:false }, pinchSeq:0, handReady:false };

window.WEAR_startEye = async function(){
  const EYE = window.EYE;
  if(EYE.active) return true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    EYE.supported = false; EYE.error = '이 브라우저는 카메라를 지원하지 않습니다.'; return false;
  }
  const video = document.getElementById('camFeed');
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ width:320, height:240, facingMode:'user' } });
  }catch(err){
    EYE.errCode = (err && err.name) || 'UnknownError';
    EYE.error = (EYE.errCode === 'NotAllowedError')
      ? '카메라 권한이 거부되었습니다.'
      : (EYE.errCode === 'NotFoundError' ? '카메라를 찾을 수 없습니다.' : '카메라를 열 수 없습니다.');
    return false;
  }
  video.srcObject = stream;
  try{ await video.play(); }catch(e){}

  let landmarker;
  try{
    const fileset = await FilesetResolver.forVisionTasks(WASM);
    const opts = {
      baseOptions:{ modelAssetPath: MODEL, delegate:'GPU' },
      outputFaceBlendshapes:true, outputFacialTransformationMatrixes:false, runningMode:'VIDEO', numFaces:1
    };
    try{ landmarker = await FaceLandmarker.createFromOptions(fileset, opts); }
    catch(e){ opts.baseOptions.delegate = 'CPU'; landmarker = await FaceLandmarker.createFromOptions(fileset, opts); }
  }catch(err){
    EYE.error = '눈 인식 모델을 불러오지 못했습니다. 네트워크를 확인해 주세요.';
    stream.getTracks().forEach(t => t.stop());
    return false;
  }

  EYE.active = true; EYE.ready = true; EYE.error = null;

  // 손 인식은 선택 사항 — 실패해도 얼굴/끄덕임/음성은 그대로 동작한다.
  let handLm = null;
  (async function loadHand(){
    try{
      const fs2 = await FilesetResolver.forVisionTasks(WASM);
      const hopts = {
        baseOptions:{ modelAssetPath: HAND_MODEL, delegate:'GPU' },
        runningMode:'VIDEO', numHands:1
      };
      try{ handLm = await HandLandmarker.createFromOptions(fs2, hopts); }
      catch(e){ hopts.baseOptions.delegate = 'CPU'; handLm = await HandLandmarker.createFromOptions(fs2, hopts); }
      EYE.handReady = true;
    }catch(err){ EYE.handReady = false; }
  })();

  const SHUT = 0.48, OPEN = 0.32;   // 히스테리시스
  let last = -1, smooth = 0;

  // ── 끄덕임 / 도리도리 감지 ───────────────────────────────
  // 끄덕임: 코끝(landmark 1)의 세로 위치를 기준선과 비교. 숙였다(DOWN)
  //   드는(UP) 왕복 1회를 세고, 짧은 시간 안에 2회 모이면 nodSeq++ (다음).
  // 도리도리: 코끝 가로 위치가 좌↔우로 크게 흔들리면 shakeSeq++ (뒤로).
  let noseBaseY = null, noseBaseX = null;
  let nodPhase = 'idle', nodCount = 0, nodFirstAt = 0, nodLockUntil = 0;
  let shakeDir = 0, shakeTurns = 0, shakeFirstAt = 0, shakeLockUntil = 0;
  const NOD_DOWN = 0.018, NOD_UP = 0.008;   // 세로 왕복 임계 (화면 비율)
  const NOD_PAIR_MS = 1100;                 // 2회 끄덕임이 모여야 하는 시간
  const SHK_AMP = 0.020;                     // 가로 흔들림 임계
  const SHK_PAIR_MS = 1200;                  // 좌우 왕복이 모여야 하는 시간
  function trackHead(res, now){
    const lm = res && res.faceLandmarks && res.faceLandmarks[0];
    if(!lm || !lm[1]){ return; }
    const y = lm[1].y, x = lm[1].x;          // 0~1

    // ---- 끄덕임(세로) : 두 번 끄덕여야 1회 ----
    if(noseBaseY === null){ noseBaseY = y; }
    else {
      const dy = y - noseBaseY;               // +면 숙임
      if(nodPhase === 'idle'){
        if(dy > NOD_DOWN && now > nodLockUntil) nodPhase = 'down';
        else noseBaseY = noseBaseY * 0.98 + y * 0.02;   // 가만히 있을 때만 추종
      } else if(nodPhase === 'down'){
        if(dy < NOD_UP){
          nodPhase = 'idle';
          noseBaseY = y;
          const t = now;
          if(nodCount === 0 || (t - nodFirstAt) > NOD_PAIR_MS){ nodCount = 1; nodFirstAt = t; }
          else { nodCount = 0; nodLockUntil = t + 900; EYE.nodSeq++; }   // ← 2회째 = 다음
        }
      }
    }

    // ---- 도리도리(가로) : 좌우로 크게 왕복하면 뒤로 ----
    if(noseBaseX === null){ noseBaseX = x; }
    else {
      const dx = x - noseBaseX;
      noseBaseX = noseBaseX * 0.9 + x * 0.1;  // 가로 기준선은 빠르게 추종(자세 무관)
      if(now > shakeLockUntil){
        if(dx > SHK_AMP && shakeDir <= 0){
          if(shakeDir === 0){ shakeFirstAt = now; }
          shakeDir = 1; shakeTurns++;
        } else if(dx < -SHK_AMP && shakeDir >= 0){
          if(shakeDir === 0){ shakeFirstAt = now; }
          shakeDir = -1; shakeTurns++;
        }
        if(shakeTurns >= 3 && (now - shakeFirstAt) < SHK_PAIR_MS){
          shakeTurns = 0; shakeDir = 0; shakeLockUntil = now + 900;
          EYE.shakeSeq++;                     // ← 도리도리 = 뒤로
        }
        if((now - shakeFirstAt) > SHK_PAIR_MS){ shakeTurns = 0; shakeDir = 0; }
      }
    }
  }

  // ── 손 커서 / 주먹(grab) 클릭 ─────────────────────────────
  // 검지 끝(8)을 커서로 삼는다. 클릭은 '주먹 쥐기'로 한다 — 네 손가락
  // (검지·중지·약지·새끼) 끝이 각자의 밑마디보다 손바닥 쪽으로 말려들면
  // 접힌 것으로 보고, 3개 이상 접히면 grab 으로 판정한다. 펼친 손과 뚜렷이
  // 구분돼 오탐이 거의 없다. 손 크기로 정규화해 원근에 강인하게.
  // 쥐는 순간 손끝이 흔들리므로, grab 이 시작되면 커서를 그 자리에 고정한다.
  let handSmX = 0.5, handSmY = 0.5, grabOn = false, handMiss = 0, armed = true;
  let frozenX = 0.5, frozenY = 0.5;
  const FOLD_ON = 3, FOLD_OFF = 2, REARM = 1;  // 쥐기 3↑, 풀림 2↓, 재장전은 완전히 펴야(≤1)
  function fingerFolded(lms, tipI, pipI, mcpI, wrist, span){
    // 끝(tip)이 중간마디(pip)보다 손목에 가까우면 접힌 것
    const dTip = Math.hypot(lms[tipI].x - wrist.x, lms[tipI].y - wrist.y);
    const dPip = Math.hypot(lms[pipI].x - wrist.x, lms[pipI].y - wrist.y);
    return (dPip - dTip) / span > 0.06;      // 끝이 pip보다 안쪽으로 충분히
  }
  function trackHand(now){
    if(!handLm){ return; }
    let hres = null;
    try{ hres = handLm.detectForVideo(video, now); }catch(e){ return; }
    const lms = hres && hres.landmarks && hres.landmarks[0];
    if(!lms){
      if(++handMiss > 6){ EYE.hand.present = false; grabOn = false; armed = true; EYE.hand.pinch = false; }
      return;
    }
    handMiss = 0;
    const tip = lms[8], wrist = lms[0], midMcp = lms[9];
    const span = Math.hypot(wrist.x - midMcp.x, wrist.y - midMcp.y) || 0.001;

    // 네 손가락 접힘 개수
    let folded = 0;
    if(fingerFolded(lms, 8,  6,  5,  wrist, span)) folded++;  // 검지
    if(fingerFolded(lms, 12, 10, 9,  wrist, span)) folded++;  // 중지
    if(fingerFolded(lms, 16, 14, 13, wrist, span)) folded++;  // 약지
    if(fingerFolded(lms, 20, 18, 17, wrist, span)) folded++;  // 새끼

    // 커서 좌표 — x 반전(거울), 살짝 스무딩. 단, grab 중이면 고정.
    const cx = 1 - tip.x, cy = tip.y;
    if(!grabOn){
      handSmX = handSmX * 0.5 + cx * 0.5;
      handSmY = handSmY * 0.5 + cy * 0.5;
    }
    EYE.hand.present = true;
    EYE.hand.x = grabOn ? frozenX : handSmX;
    EYE.hand.y = grabOn ? frozenY : handSmY;

    // grab 엣지 — 쥐는 순간 한 번만 클릭. 다시 클릭하려면 손을 완전히
    // 펴야(folded ≤ REARM) 재장전된다. 쥔 채로 부들거려도 재발화 없음.
    if(!grabOn && armed && folded >= FOLD_ON){
      grabOn = true; armed = false;             // 재장전 해제 — 손을 펴기 전엔 다시 클릭 안 됨
      frozenX = handSmX; frozenY = handSmY;
      EYE.pinchSeq++;                           // 클릭 신호(이름은 유지)
    } else if(grabOn && folded <= FOLD_OFF){
      grabOn = false;
    }
    if(folded <= REARM) armed = true;           // 손을 충분히 펴면 다음 클릭 준비
    EYE.hand.pinch = grabOn;                    // 링을 조인 모양으로
  }

  function tick(){
    if(video.readyState >= 2 && video.currentTime !== last){
      last = video.currentTime;
      const now = performance.now();
      let res = null;
      try{ res = landmarker.detectForVideo(video, now); }catch(e){}
      const bs = res && res.faceBlendshapes && res.faceBlendshapes[0];
      if(bs){
        EYE.face = true;
        let l = 0, r = 0;
        for(const c of bs.categories){
          if(c.categoryName === 'eyeBlinkLeft') l = c.score;
          else if(c.categoryName === 'eyeBlinkRight') r = c.score;
        }
        const raw = (l + r) / 2;
        smooth = smooth * 0.55 + raw * 0.45;
        EYE.score = smooth;
        if(!EYE.closed && smooth > SHUT) EYE.closed = true;
        else if(EYE.closed && smooth < OPEN) EYE.closed = false;
        trackHead(res, now);
      } else {
        // 얼굴이 안 잡히면 감음으로 치지 않는다 (기기를 벗은 상태)
        EYE.face = false; EYE.score = 0; EYE.closed = false;
        noseBaseY = null; noseBaseX = null; nodPhase = 'idle'; nodCount = 0;
        shakeDir = 0; shakeTurns = 0;
      }
      trackHand(now);
    }
    requestAnimationFrame(tick);
  }
  tick();
  return true;
};
</script>

<script>
(function(){

  var EXPOSE = [

    { key:'gaze',    name:'시선 방향',            desc:'무엇을 보고 있는지',                        dec:0.07, fee:8 },
    { key:'age',     name:'나이',                 desc:'추정 연령대',                               dec:0.06, fee:7 },
    { key:'income',  name:'소득 신호',            desc:'소지품과 옷의 등급',                        dec:0.05, fee:6 },

      foot:'BASIC · 기본 제공' },
    { key:'veil', name:'VEIL', ko:'부분 차단', price:12000,
      keep:['shape','age','gaze'],
      desc:'형태와 나이, 시선 방향만 남깁니다. 감정 · 과거 · 소득 · 목소리 · 피로는 읽히지 않습니다.',
      foot:'STANDARD · 가장 많이 선택' },
    { key:'blackout', name:'BLACKOUT', ko:'전면 블러', price:39000,
