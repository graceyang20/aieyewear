        '<div class="stat-row"><span>누적 세액</span><span>'+won(monthSpent())+'</span></div>' +
        '<div class="stat-row"><span>누적 절약</span><span>'+won(dailyProjSaved()*S.monthDayIndex + S.saved)+'</span></div>' +
        '<div class="stat-row"><span>일 평균</span><span>'+won(monthSpent()/(S.monthDayIndex+1))+'</span></div>' +
        '<div class="stat-row"><span>월 예산 대비</span><span>'+(monthBudget()?Math.round(monthSpent()/monthBudget()*100)+'%':'—')+'</span></div>' +
        '<div class="stat-row total"><span>이번 달 남은 응시</span><span>'+(monthBudget()?monthLeftoverPct()+'%':'상한 없음')+'</span></div>' +
        '<div class="italic-line">이번 달 예상 청구액 '+wonToMan(dailyProjTax()*30)+' · 수수료 '+wonToMan(dailyProjSaved()*30*0.1)+'</div>';
    }
    var coh = cohortNumbers(S.profile);
    return '<div class="stat-row"><span>현재 예상 연 관측세</span><span>'+wonToMan(annualTax())+'</span></div>' +
      '<div class="stat-row"><span>필터 없이는</span><span>'+wonToMan(FULL_DAILY*365)+'</span></div>' +
      '<div class="stat-row"><span>연 절약</span><span>'+wonToMan(annualSaved())+' ('+Math.round(dailyProjSaved()/FULL_DAILY*100)+'%)</span></div>' +
      '<div class="stat-row"><span>수수료 (절약분 10%)</span><span>'+wonToMan(annualSaved()*0.1)+'</span></div>' +
      '<div class="stat-row"><span>노출 차단 구독료</span><span>'+manwon(holdFee())+'</span></div>' +
      '<div class="stat-row total"><span>연 합계</span><span>'+wonToMan(annualTax() + annualSaved()*0.1 + holdFee()*10000)+'</span></div>' +
      '<div class="italic-line">'+escapeHtml(cohortLabel(S.profile))+' 평균은 '+manwon(coh.annual)+'입니다. 당신은 '+
        (annualTax()/10000 < coh.annual ? '평균보다 '+manwon(coh.annual - annualTax()/10000)+' 아래' : '평균보다 '+manwon(annualTax()/10000 - coh.annual)+' 위')+'입니다.</div>';
  }

  /* ---------- 낭독 ---------- */
  function speechText(key){
    if(key === 'ledger'){
      var ev = S.passed + S.blockedCount;
      return '오늘 응시 ' + ev + '건. 통과 ' + S.passed + '건, 차단 ' + S.blockedCount + '건. ' +
             '차단률 ' + spPct(ev ? S.blockedCount/ev*100 : 0) + '. ' +
             '오늘 세액 ' + spWon(S.spent) + ', 절약 ' + spWon(S.saved) + '. ' +
             '이번 달 누적 ' + spWon(monthSpent()) + '. ' +
             '현재 예상 연 관측세 ' + spMan(annualTax()/10000) + ', ' +
             '연 절약 ' + spMan(annualSaved()/10000) + ', ' +
             '수수료 ' + spMan(annualSaved()*0.1/10000) + '.';
    }
    if(key === 'hold'){
      return '현재 결정도 ' + decidedness().toFixed(2) + ', ' + bandOf(decidedness()).name + ' 구간. ' +
             bandOf(decidedness()).desc + ' 연 구독료 ' + spMan(holdFee()) + '. ' +
             (decidedness() < 0.32 ? '경고. 0.3 아래에서는 사람들이 당신의 얼굴을 기억하지 못합니다.'
                                   : '유지 강도를 낮추면 노출 항목이 순서대로 흐려집니다.');
    }
    if(key === 'family'){
      return '가족 상호 응시 이행률 62퍼센트. 감면 유지 기준 70퍼센트. 잔여 8일. ' +
             '등록 가족 3인은 관계 기록에서 자동 등록되어 예외 목록에 있습니다. 차단할 수 없습니다.';
    }
    if(key === 'gazer'){
      return '공개 관측망 중계. ' +
        (GZ.live ? '지금 ' + (GZ.list[GZ.idx] ? GZ.list[GZ.idx].name : '한 지점') + '에서 송출 중입니다. '
                 : '연결된 관측점이 없습니다. ') +
        '이 화면의 관측세는 면제입니다. 얼굴 인식은 적용되지 않습니다. ' +
        '당신이 사람을 보면 과금되지만, 관측망이 사람을 보는 데에는 아무도 돈을 내지 않습니다.';
    }
    if(key === 'shield'){
      var allow = EXPOSE.filter(function(e){ return S.expose[e.key]; }).map(function(e){ return e.name; });
      var block = EXPOSE.filter(function(e){ return !S.expose[e.key]; }).map(function(e){ return e.name; })
                    .concat(blockedList().map(function(l){ return l.name; }));
      return '허용. ' + (allow.join(', ') || '없음') + '. ' +
             '차단. ' + (block.join(', ') || '없음') + '. ' +
             '예외. ' + FAMILY.join(', ') + ', 전부 허용.';
    }
    if(key === 'optimize'){
      var rules = blockedList()
        .filter(function(l){ return S.byLayer[l.key].block > 0; })
        .map(function(l){ return l.name + ' ' + S.byLayer[l.key].block + '회'; });
      return '오늘 결산. 세액 ' + spWon(S.spent) + '. 최적화 없이는 ' + spWon(S.spent + S.saved) + '. ' +
             '절약 ' + spWon(S.saved) + ', 수수료 ' + spWon(S.saved*0.1) + '. ' +
             '적용 중인 회피 규칙. ' + (rules.join(', ') || '아직 차단된 것이 없습니다') + '. ' +
             '오늘 ' + S.blockedCount + '명을 아무도 아닌 사람으로 두었습니다.';
    }
    if(key === 'vision'){
      var m = blockedList().map(function(l){ return l.name; });
      return '시야 완성도 ' + spPct(visionPct()) + '. 제거된 레이어 ' + m.length + '개. ' +
             '보이지 않는 것. ' + (m.join(', ') || '없음') + '.' +
             (visionPct() < 70 ? ' 거리에서 일어나는 일 중 일부는 당신에게 도달하지 않습니다.' : '');
    }
    if(key === 'budget'){
      return '오늘 남은 응시 ' + (S.budgetDaily ? spPct(leftoverPct()) : '상한 없음') + '. ' +
             '사용 ' + spWon(S.spent) + ', 예산 ' + (S.budgetDaily ? spWon(S.budgetDaily) : '없음') + '. ' +
             '이번 달 남은 응시 ' + (monthBudget() ? spPct(monthLeftoverPct()) : '상한 없음') + '. ' +
             '이번 달 누적 ' + spWon(monthSpent()) + '. 일 평균 ' + spWon(dailyProjTax()) + '.' +
             (S.forced ? ' 오늘 예산을 초과하여 전면 블러 처리 중입니다.' : '');
    }
    return '';
  }

  var SPEAKABLE = { shield:1, optimize:1, vision:1, budget:1, ledger:1, hold:1, family:1, gazer:1 };

  function stopSpeech(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    var b = document.getElementById('speakBtn');
    if(b) b.classList.remove('on');
  }

  function toggleSpeech(){
    var btn = document.getElementById('speakBtn');
    if(!window.speechSynthesis){ btn.textContent = '낭독 불가'; return; }
    if(window.speechSynthesis.speaking){ stopSpeech(); return; }
    var was = AUD.on; AUD.on = true;              // 다시 듣기는 스위치와 무관
    btn.classList.add('on');
    say(speechText(currentPanel), {interrupt:true, rate:0.98});
    AUD.on = was;
    setTimeout(function(){
      if(!window.speechSynthesis.speaking) btn.classList.remove('on');
    }, 400);
  }

  /* ---------- 패널 열고 닫기 ---------- */
  function openPanel(key){
    if(key === 'void'){ openVoid(); return; }
    currentPanel = key;
    document.getElementById('panelInner').innerHTML = panelContent(key);
    document.getElementById('sysPanel').classList.add('active');
    inPanel = true;
    requestAnimationFrame(function(){ WEAR_fitScreen(document.getElementById('sysPanel'), document.getElementById('panelInner')); });
    setTimeout(function(){ WEAR_fitScreen(document.getElementById('sysPanel'), document.getElementById('panelInner')); }, 80);

    var sb = document.getElementById('speakBtn');
    sb.hidden = true;              // 낭독 기능 제거
    sb.classList.remove('on');
    sb.textContent = '낭독';

    if(key === 'hold') wireHold();
    if(key === 'shield') wireShield();
    if(key === 'ledger') wireLedger();
    if(key === 'gazer') wireGazer();

    // 자동 낭독은 하지 않는다. 필요하면 상단 '낭독' 버튼을 누른다.
  }

  function wireLedger(){
    var body = document.getElementById('ledgerBody');
    body.innerHTML = ledgerBody('d');
    Array.prototype.forEach.call(document.querySelectorAll('#ledgerTabs .tab'), function(tab){
      tab.addEventListener('click', function(){
        Array.prototype.forEach.call(document.querySelectorAll('#ledgerTabs .tab'), function(t){ t.classList.remove('on'); });
        tab.classList.add('on');
        body.innerHTML = ledgerBody(tab.getAttribute('data-t'));
      });
    });
  }

  function wireShield(){
    buildToggleList(document.getElementById('pViewList'), VIEW_LAYERS, S.blocked, function(l){
      return '<div class="flt-meta"><b>'+won(l.cost)+'</b>/일<br>시야 −'+l.vision+'</div>';
    });
    buildToggleList(document.getElementById('pExpList'), EXPOSE, S.expose, function(e){
      return '<div class="flt-meta">결정도 <b>+'+e.dec.toFixed(2)+'</b><br>'+e.fee+'만원/년</div>';
    });
  }

  function buildToggleList(host, items, store, metaFn){
    host.innerHTML = '';
    items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'flt-row' + (store[it.key] ? ' on' : '');
      row.setAttribute('tabindex','0');
      row.setAttribute('role','switch');
      row.innerHTML = '<div class="sw"></div><div class="flt-main"><div class="flt-name">'+it.name+'</div>' +
                      '<div class="flt-desc">'+it.desc+'</div></div>' + metaFn(it);
      function toggle(){
        store[it.key] = !store[it.key];
        row.classList.toggle('on', !!store[it.key]);
        stopSpeech();
        paintHud();
        refreshMenuValues();
        // 상단 요약 3열도 갱신
        var again = panelContent('shield');
        var tmp = document.createElement('div'); tmp.innerHTML = again;
        var newCols = tmp.querySelector('.contract-cols');
        var oldCols = document.querySelector('#panelInner .contract-cols');
        if(newCols && oldCols) oldCols.innerHTML = newCols.innerHTML;
      }
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });
      host.appendChild(row);
    });
  }

  function wireHold(){
    var range = document.getElementById('holdRange');
    var amt = document.getElementById('holdAmt');
    var dec = document.getElementById('holdDec');
    var pct = document.getElementById('holdPct');
    var warn = document.getElementById('holdWarn');
    var baseDec = decidedness(), baseFee = holdFee();
    function update(){
      var t = range.value/100;
      var d = DEC_BASE + (baseDec - DEC_BASE) * t;
      var f = baseFee * t;
      dec.innerHTML = d.toFixed(2) + '<small>현재 결정도 · ' + bandOf(d).name + '</small>';
      amt.textContent = manwon(f) + ' / 년';
      pct.textContent = range.value + '%';
      warn.style.opacity = d < 0.32 ? '1' : '0';
    }
    range.addEventListener('input', update);
    update();
  }

  function closePanel(){
    stopSpeech();
    killGazer();
    document.getElementById('speakBtn').hidden = true;
    document.getElementById('sysPanel').classList.remove('active');
    inPanel = false;
    currentPanel = null;
    refreshMenuValues();
  }

  function openVoid(){
    exitToWorldImmediate();
    var f = document.getElementById('mirrorFlashFull');
    f.classList.remove('hidden');
    var handler = function(){ f.classList.add('hidden'); f.removeEventListener('click', handler); };
    f.addEventListener('click', handler);
  }

  function systemBriefing(){
    var lines = [
      '눈 감음. 과금이 정지되었습니다.',
      '오늘 관측세 ' + spWon(S.spent) + '. 차단으로 아낀 금액 ' + spWon(S.saved) + '.',
      S.budgetDaily
        ? '오늘 남은 응시 ' + spPct(leftoverPct()) + '. 이번 달 남은 응시 ' + spPct(monthLeftoverPct()) + '.'
        : '응시 예산은 설정되어 있지 않습니다.',
      '시야 완성도 ' + spPct(visionPct()) + '. 결정도 ' + decidedness().toFixed(2) + '.',
      S.forced ? '예산을 초과하여 전면 블러 처리 중입니다.' : '',
      '메뉴 ' + (sysItems.length-1) + '개. 위아래 방향키로 옮기고 엔터로 여십시오. 첫 항목, ' +
        sysItems[0].label + ', ' + sysItems[0].sub + '.',
      '나가시려면 눈을 뜨십시오. 뜨는 즉시 과금이 재개됩니다.'
    ].filter(Boolean);
    say(lines.join(' '), {interrupt:true});
  }

  function sayFocused(){
    var it = sysItems[focusIndex];
    if(!it || it.key === 'void'){ say('빈 항목.', {interrupt:true}); return; }
    say(it.label + '. ' + it.sub + '. ' + (it.val ? it.val() : ''), {interrupt:true});
  }

  function enterSystem(){
    inSystem = true;
    focusIndex = 0;
    updateFocus();
    refreshMenuValues();
    document.getElementById('world').classList.add('dimmed');
    document.getElementById('system').classList.add('active');
    requestAnimationFrame(function(){ WEAR_fitScreen(document.getElementById('system'), document.getElementById('sysMenu')); });
  }

  function exitToWorldImmediate(){
    inSystem = false; inPanel = false; closing = false;
    document.getElementById('closeProgress').style.setProperty('--p','150%');
    document.getElementById('world').classList.remove('dimmed');
    document.getElementById('system').classList.remove('active');
    closePanel();
  }

  var pressCount = 0;
  function startClosing(){
    if(inSystem || closing) return;
    closing = true; pressCount = 0;
    closeStart = performance.now();
    (function step(){
      if(!closing) return;
      var t = Math.min(1, (performance.now()-closeStart)/HOLD_MS);
      pressCount = countDown(t, pressCount);
      document.getElementById('closeProgress').style.setProperty('--p', (150 - t*150)+'%');
      if(t >= 1){
        closing = false;
        document.getElementById('closeProgress').style.setProperty('--p','150%');
        enterSystem();
        return;
      }
      closeTimer = requestAnimationFrame(step);
    })();
  }

  function cancelClosing(){
    closing = false; pressCount = 0; shutUp();
    if(closeTimer) cancelAnimationFrame(closeTimer);
    document.getElementById('closeProgress').style.setProperty('--p','150%');
  }

  // t(0..1) 진행도를 THREE, TWO, ONE 으로 읽어준다
  function countDown(t, last){
    var remain = Math.max(1, Math.ceil((1-t)*3));
    if(remain !== last){ say(['','One','Two','Three'][remain], {interrupt:true, rate:1.12, lang:'en', blip:false, keep:true}); return remain; }
    return last;
  }

  function setVignette(p){
    document.getElementById('closeProgress').style.setProperty('--p', p+'%');
  }

  /* ---------- 카메라: 감음 = SYSTEM, 뜸 = WORLD ---------- */
  var eyeShutStart = 0, eyeOpenStart = 0, chipTick = 0, eyeCount = 0;

  function eyeLoop(){
    var E = eye();
    if(E.active){
      var shut = E.closed && E.face;

      // SYSTEM 진입/이탈은 클릭으로만. 눈 상태는 칩 표시(과금 정지/중)에만 쓴다.
      if(performance.now() - chipTick > 120){
        chipTick = performance.now();
        var chip = document.getElementById('camChip');
        var lbl = document.getElementById('camLbl');
        var bar = document.getElementById('camBar');
        if(chip && !chip.hidden){
          chip.classList.toggle('shut', shut);
          chip.classList.toggle('open', !shut && E.face);
          lbl.textContent = !E.face ? '얼굴 없음' : (shut ? '눈 감음 · 과금 정지' : '눈 뜸 · 과금 중');
          bar.style.width = Math.round(Math.min(1, E.score)*100) + '%';
        }
      }
    }
    requestAnimationFrame(eyeLoop);
  }

  /* =========================================================
     초기화
     ========================================================= */
  function initExperience(){
    buildCity();
    buildMenu();

    // 오늘 하루 중 이미 지난 분량을 시드로 (오후로 가정)
    S.spent = Math.round(dailyProjTax() * 0.34);
    S.saved = Math.round(dailyProjSaved() * 0.34);
    S.passed = 22; S.blockedCount = Math.round(22 * (dailyProjSaved()/FULL_DAILY || 0));
    if(S.budgetDaily && S.spent >= S.budgetDaily) S.forced = true;
    paintHud();

    var world = document.getElementById('world');
    showAudChip();
    showChip();
    document.getElementById('worldHint').textContent = '화면을 누르면 SYSTEM이 열립니다';
    eyeLoop();
    setTimeout(function(){ document.getElementById('worldHint').classList.add('faded'); }, 5200);
    setTimeout(function(){ document.getElementById('cornerBrand').classList.add('faded'); }, 3600);

    world.addEventListener('click', function(){ if(!inSystem) enterSystem(); });

    document.getElementById('system').addEventListener('click', function(e){
      if(e.target.id === 'system'){ exitToWorldImmediate(); }
    });
    document.getElementById('sysPanel').addEventListener('click', function(e){
      if(e.target.id === 'sysPanel'){ closePanel(); }
    });
    document.getElementById('panelBack').addEventListener('click', closePanel);
    document.getElementById('speakBtn').addEventListener('click', function(e){ e.stopPropagation(); toggleSpeech(); });

    window.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(inPanel){ closePanel(); } else if(inSystem){ exitToWorldImmediate(); }
        return;
      }
      if(!inSystem) return;
      if(e.key === ' '){                       // 눈 감은 채로 다시 듣기
        e.preventDefault();
        if(inPanel) say(speechText(currentPanel), {interrupt:true});
        else systemBriefing();
        return;
      }
      if(inPanel) return;
      if(e.key === 'ArrowDown'){ focusIndex = (focusIndex+1)%sysItems.length; updateFocus(); sayFocused(); e.preventDefault(); }
      else if(e.key === 'ArrowUp'){ focusIndex = (focusIndex-1+sysItems.length)%sysItems.length; updateFocus(); sayFocused(); e.preventDefault(); }
      else if(e.key === 'Enter'){ openPanel(sysItems[focusIndex].key); }
    });

    // 피응시 신호 — 노출 필터가 반영됨
    (function pulseGaze(){
      var side = Math.random() > 0.5 ? 'right' : 'left';
      var el = document.getElementById(side === 'right' ? 'gazeRight' : 'gazeLeft');
      var label = document.getElementById(side === 'right' ? 'gazeLabelRight' : 'gazeLabelLeft');
      var shapeOn = S.expose.shape;
      label.textContent = '피응시 · ' + (side==='right'?'우측':'좌측') + ' · ' +
        (shapeOn ? '결정도 ' + decidedness().toFixed(2) + ' 반영됨' : '형태 차단됨');
      el.classList.add('on'); label.classList.add('on');
      setTimeout(function(){ el.classList.remove('on'); label.classList.remove('on'); }, 2600);
      setTimeout(pulseGaze, 4000 + Math.random()*5000);
    })();

    // 지나가는 것들
    (function loop(){
      var E = eye();
      var shut = E.active && E.closed && E.face;
      if(!inSystem && !shut) spawnEntity();
      setTimeout(loop, 1200 + Math.random()*1400);
    })();
  }

  start();
})();
</script>
</body>
</html>
