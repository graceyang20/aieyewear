      '<div class="bd-wrap">' +
        '<div class="bd-amount" id="bdAmt">—</div>' +
        '<div class="bd-unit" id="bdUnit">1일 상한</div>' +
        '<input class="bd-range" id="bdRange" type="range" ' +
          'min="'+BD_MIN+'" max="'+BD_MAX+'" step="'+BD_STEP+'" value="'+last+'" ' +
          'aria-label="하루 응시 예산" />' +
        '<div class="bd-scale"><span>'+won(BD_MIN)+'</span><span>'+won(BD_MAX)+'</span></div>' +
        '<button class="bd-nolimit" id="bdNo" type="button">상한을 설정하지 않겠습니다</button>' +
      '</div>' +
      '<div class="micro" id="bdNote"></div>' +
      '<button class="ghost-btn" id="bBudget">계속</button>'
    );

    var range = document.getElementById('bdRange');
    var amt   = document.getElementById('bdAmt');
    var unit  = document.getElementById('bdUnit');
    var note  = document.getElementById('bdNote');
    var noBtn = document.getElementById('bdNo');
    var noLimit = (S.budgetDaily === 0);

    function paint(){
      if(noLimit){
        S.budgetDaily = 0;
        amt.textContent = '상한 없음';
        amt.classList.add('off');
        unit.textContent = '제한 없이 과금';
        range.disabled = true;
        noBtn.classList.add('on');
        note.innerHTML = '동일 조건 평균 사용량은 하루 ' + won(FULL_DAILY) + '입니다.';
      } else {
        S.budgetDaily = parseInt(range.value, 10);
        last = S.budgetDaily;
        amt.textContent = won(S.budgetDaily);
        amt.classList.remove('off');
        unit.textContent = '1일 상한';
        range.disabled = false;
        noBtn.classList.remove('on');
        note.innerHTML = '동일 조건 평균 사용량은 하루 ' + won(FULL_DAILY) + '입니다.' +
          (S.budgetDaily < FULL_DAILY
            ? '<br>이 상한이면 평균보다 먼저 블러가 시작됩니다.'
            : '');
      }
    }

    range.addEventListener('input', function(){ if(!noLimit) paint(); });
    range.addEventListener('change', function(){ if(!noLimit) paint(); });
    noBtn.addEventListener('click', function(){
      noLimit = !noLimit;
      if(!noLimit) range.value = last;
      paint();
    });
    paint();

    document.getElementById('bBudget').onclick = function(){
      if(!noLimit) S.budgetDaily = parseInt(range.value, 10);
      stageViewFilter();
    };
  }

  /* ---- 필터 공용 조립 ---- */
  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  // cut = 시야에서 잘려나간 상태(이름에 줄이 그어진다). on = 스위치가 눌린 상태.
  function vfxRow(o){
    var row = document.createElement('div');
    row.className = 'vfx-row' + (o.on ? ' on' : '') + (o.cut ? ' cut' : '');
    row.setAttribute('tabindex', '0');
    row.setAttribute('role', 'switch');
    row.setAttribute('aria-checked', !!o.on);
    row.innerHTML =
      '<div class="vfx-idx">' + pad2(o.i) + '</div>' +
      '<div class="vfx-body">' +
        '<div class="vfx-name">' + o.name + '<i></i></div>' +
        '<div class="vfx-sub"><em>' + o.code + '</em>' + o.desc + '</div>' +
      '</div>' +
      '<div class="vfx-num"><b>' + o.figure + '</b><span>' + o.unit + '</span>' +
        '<div class="vfx-pt">' + o.pt + '</div></div>' +
      '<div class="vfx-mark"></div>';
    return row;
  }

  /* ---- 2/3 시야 필터 (IN) ---- */
  function stageViewFilter(){
    stageEnter(stageBudget);
    setContent(
      '<div class="voice-line">무엇을 보지 않으시겠습니까?</div>' +
      '<div class="voice-line dim" style="font-size:12.5px;">선택한 항목은 시야에서 제거되고, 그만큼 과금되지 않습니다.</div>' +
      '<div class="vfx">' +
        '<div class="vfx-head">' +
          '<span class="vfx-kicker">VIEW FILTER</span>' +
          '<span class="vfx-rule"></span>' +
          '<span class="vfx-kicker">' + pad2(VIEW_LAYERS.length) + ' LAYERS</span>' +
        '</div>' +
        '<div class="vfx-strip" id="vfxStrip"></div>' +
        '<div class="vfx-striplabel"><span>VISION&nbsp; <b id="vfxVis">100%</b></span>' +
          '<span>FIXED ' + (100 - FULL_VISION) + '&nbsp; ·&nbsp; FILTERABLE ' + FULL_VISION + '</span></div>' +
        '<div class="vfx-list" id="fltList"></div>' +
        '<div class="vfx-readout">' +
          '<div class="vfx-cell"><div class="vfx-rv" id="roTax">-</div>' +
            '<div class="vfx-rk">DAILY TAX<em>일 예상 관측세</em></div></div>' +
          '<div class="vfx-cell"><div class="vfx-rv good" id="roSaved">-</div>' +
            '<div class="vfx-rk">SAVED<em>일 절약</em></div></div>' +
          '<div class="vfx-cell"><div class="vfx-rv" id="roVision">-</div>' +
            '<div class="vfx-rk">VISION<em>시야 완성도</em></div></div>' +
        '</div>' +
      '</div>' +
      '<button class="ghost-btn" id="bView">계속</button>'
    );

    // 시야 100을 눈금으로 펼친다.
    // 앞의 59칸은 어떤 필터로도 걷어낼 수 없는 고정분이고,
    // 뒤의 41칸만 레이어에 배정된다. 레이어를 끄면 그 몫의 눈금이 주저앉는다.
    var strip = document.getElementById('vfxStrip');
    var fixed = 100 - FULL_VISION;
    for(var f=0; f<fixed; f++){
      var bt = document.createElement('i');
      bt.className = 'base';
      strip.appendChild(bt);
    }
    strip.lastChild.classList.add('edge');
    VIEW_LAYERS.forEach(function(l){
      for(var k=0; k<l.vision; k++){
        var t = document.createElement('i');
        t.setAttribute('data-k', l.key);
        t.style.transitionDelay = (k * 26) + 'ms';
        strip.appendChild(t);
      }
    });

    var list = document.getElementById('fltList');
    VIEW_LAYERS.forEach(function(l, i){
      var row = vfxRow({
        i: i + 1, name: l.name, code: l.key.toUpperCase(), desc: l.desc,
        figure: won(l.cost), unit: '/일', pt: 'VISION −' + pad2(l.vision),
        on: !!S.blocked[l.key], cut: !!S.blocked[l.key]
      });
      function toggle(){
        S.blocked[l.key] = !S.blocked[l.key];
        row.classList.toggle('on', !!S.blocked[l.key]);
        row.classList.toggle('cut', !!S.blocked[l.key]);
        row.setAttribute('aria-checked', !!S.blocked[l.key]);
        paint();
      }
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });
      // 행에 손을 얹으면 그 레이어가 스트립의 어디를 차지하는지 밝아진다
      row.addEventListener('mouseenter', function(){ hl(l.key, true); });
      row.addEventListener('mouseleave', function(){ hl(l.key, false); });
      row.addEventListener('focus', function(){ hl(l.key, true); });
      row.addEventListener('blur', function(){ hl(l.key, false); });
      list.appendChild(row);
    });

    function hl(key, on){
      Array.prototype.forEach.call(strip.children, function(t){
        if(t.getAttribute('data-k') === key) t.classList.toggle('hl', on && !t.classList.contains('out'));
      });
    }
    strip.addEventListener('mouseleave', function(){
      Array.prototype.forEach.call(strip.children, function(t){ t.classList.remove('hl'); });
    });

    function paint(){
      document.getElementById('roTax').textContent = won(dailyProjTax());
      document.getElementById('roSaved').textContent = won(dailyProjSaved());
      var v = document.getElementById('roVision');
      v.textContent = visionPct() + '%';
      v.className = 'vfx-rv' + (visionPct() < 70 ? ' warn' : '');
      document.getElementById('vfxVis').textContent = visionPct() + '%';
      Array.prototype.forEach.call(strip.children, function(t){
        var k = t.getAttribute('data-k');
        if(!k) return;                       // 고정분은 건드리지 않는다
        var off = !!S.blocked[k];
        t.classList.toggle('out', off);
        if(off) t.classList.remove('hl');
      });
    }
    paint();
    document.getElementById('bView').onclick = stageExposeFilter;
  }

  /* =========================================================
     GAZER — 공개 관측망 중계 설정

     실제로 지금 켜져 있는 공개 카메라를 이 안으로 끌어온다.
     1) https://www.its.go.kr/opendata 에서 무료 인증키를 받아 GAZER_KEY 에 넣는다.
        (cctvType=4 = HTTPS HLS. 아래 bbox 는 서울 전역이다.)
     2) 키 없이 쓰려면 GAZER_FEEDS 에 .m3u8 주소를 직접 적어 둔다.
        전시장에서는 이 방식이 가장 안전하다 — API 가 죽어도 화면이 산다.
     3) 둘 다 막히면 화면은 조용히 NO FEED 상태로 떨어진다. 거짓 영상은 띄우지 않는다.
     ========================================================= */
  var GAZER_KEY = '';
  var GAZER_BBOX = { minX:126.80, maxX:127.18, minY:37.44, maxY:37.66 };
  var GAZER_FEEDS = [
    // { name:'예: 세종대로 사거리', url:'https://.../playlist.m3u8', x:126.977, y:37.570 }
  ];
  var GZ = { list:[], idx:0, hls:null, live:false, tries:0, t0:0 };

  function loadHls(){
    if(window.Hls) return Promise.resolve(window.Hls);
    if(loadHls._p) return loadHls._p;
    loadHls._p = new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
      s.onload = function(){ window.Hls ? res(window.Hls) : rej(new Error('hls.js')); };
      s.onerror = function(){ rej(new Error('hls.js 를 불러오지 못했습니다')); };
      document.head.appendChild(s);
    });
    return loadHls._p;
  }

  // 순서가 매번 같으면 늘 같은 화면만 본다
  function gazerShuffle(a){
    for(var i = a.length-1; i > 0; i--){
      var k = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[k]; a[k] = t;
    }
    return a;
  }

  // 1순위: 같은 주소의 /api/cctv (Vercel 에 올렸을 때. 키가 서버에만 있어 노출되지 않는다)
  // 2순위: GAZER_KEY 로 직접 호출 (로컬 테스트용. 브라우저가 막을 수 있다)
  // 3순위: GAZER_FEEDS 에 적어 둔 주소
  function gazerFetchList(){
    return fetch('/api/cctv').then(function(r){
      if(!r.ok) throw new Error('proxy ' + r.status);
      return r.json();
    }).then(function(j){
      if(j.error) throw new Error(j.error);
      if(!j.list || !j.list.length) throw new Error('empty');
      return gazerShuffle(j.list.slice()).concat(GAZER_FEEDS);
    }).catch(function(){
      return gazerDirect();
    });
  }

  function gazerDirect(){
    if(!GAZER_KEY) return Promise.resolve(GAZER_FEEDS.slice());
    var u = 'https://openapi.its.go.kr:9443/cctvInfo?apiKey=' + encodeURIComponent(GAZER_KEY) +
            '&type=its&cctvType=4&getType=json' +
            '&minX=' + GAZER_BBOX.minX + '&maxX=' + GAZER_BBOX.maxX +
            '&minY=' + GAZER_BBOX.minY + '&maxY=' + GAZER_BBOX.maxY;
    return fetch(u).then(function(r){ return r.json(); }).then(function(j){
      var d = (j && j.response && j.response.data) || [];
      var out = d.filter(function(c){ return c.cctvurl; }).map(function(c){
        return { name:c.cctvname || '이름 없는 관측점', url:c.cctvurl,
                 x:parseFloat(c.coordx), y:parseFloat(c.coordy) };
      });
      return gazerShuffle(out).concat(GAZER_FEEDS);
    });
  }

  function killGazer(){
    if(GZ.hls){ try{ GZ.hls.destroy(); }catch(e){} GZ.hls = null; }
    var v = document.getElementById('gzVideo');
    if(v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} }
    GZ.live = false;
  }

  function gazerState(s1, s2){
    var st = document.getElementById('gzState');
    if(!st) return;
    st.innerHTML = '<div class="s1">' + s1 + '</div>' +
                   (s2 ? '<div class="s2">' + s2 + '</div>' : '');
  }

  function gazerPlay(i){
    var box = document.getElementById('gzBox'), v = document.getElementById('gzVideo');
    if(!box || !v || !GZ.list.length) return;
    GZ.idx = ((i % GZ.list.length) + GZ.list.length) % GZ.list.length;
    var item = GZ.list[GZ.idx];
    killGazer();
    box.classList.remove('live');
    gazerState('CONNECTING', item.name + ' 관측점에 접속하고 있습니다.');
    document.getElementById('gzName').innerHTML = '<i></i>' + escapeHtml(item.name);
    document.getElementById('gzCoord').innerHTML =
      (isFinite(item.y) ? item.y.toFixed(4) : '—') + ' N<br>' +
      (isFinite(item.x) ? item.x.toFixed(4) : '—') + ' E';
    GZ.t0 = performance.now();

    function up(){
      box.classList.add('live'); GZ.live = true;
      var ms = Math.round(performance.now() - GZ.t0);
      var d = document.getElementById('gzDelay');
      if(d) d.textContent = 'HLS · 접속 ' + ms + 'ms';
      refreshMenuValues();
    }
    function down(msg){
      box.classList.remove('live'); GZ.live = false;
      gazerState('NO FEED', msg);
      refreshMenuValues();
    }

    loadHls().then(function(Hls){
      v.crossOrigin = 'anonymous';
      if(Hls.isSupported()){
        var h = new Hls({ lowLatencyMode:true, liveDurationInfinity:true });
        GZ.hls = h;
        h.loadSource(item.url);
        h.attachMedia(v);
        h.on(Hls.Events.MANIFEST_PARSED, function(){ v.play().then(up).catch(up); });
        h.on(Hls.Events.ERROR, function(e, data){
          if(!data.fatal) return;
          down('이 관측점의 신호가 브라우저까지 오지 못했습니다.<br>' +
               '대개 교차 출처(CORS) 차단이거나 주소가 만료된 경우입니다. 다음 관측점을 눌러보세요.');
        });
      } else if(v.canPlayType('application/vnd.apple.mpegurl')){
        v.src = item.url;
        v.addEventListener('loadeddata', up, { once:true });
        v.addEventListener('error', function(){ down('이 관측점을 재생할 수 없습니다.'); }, { once:true });
        v.play().catch(function(){});
      } else {
        down('이 브라우저는 HLS 를 재생하지 못합니다.');
      }
    }).catch(function(err){
      down(err.message + '. 네트워크가 막혀 있는지 확인하세요.');
    });
  }

  function wireGazer(){
    var next = document.getElementById('gzNext');
    var apply = document.getElementById('gzApply');
    var input = document.getElementById('gzInput');

    function boot(){
      gazerState('SEARCHING', '공개 관측망 목록을 받아오고 있습니다.');
      gazerFetchList().then(function(list){
        GZ.list = list;
        if(!list.length){
          gazerState('NO FEED',
            '연결된 관측점이 없습니다.<br>인증키를 넣거나 파일 상단 GAZER_FEEDS 에 주소를 적어두세요.');
          if(next) next.disabled = true;
          return;
        }
        if(next) next.disabled = list.length < 2;
        gazerPlay(0);
      }).catch(function(){
        GZ.list = GAZER_FEEDS.slice();
        if(GZ.list.length){ gazerPlay(0); return; }
        gazerState('BLOCKED',
          '관측망 목록을 받아오지 못했습니다.<br>' +
          'Vercel 에 올렸다면 환경변수 ITS_KEY 가 설정돼 있는지, ' +
          '로컬이라면 .m3u8 주소를 직접 넣었는지 확인하세요.');
      });
    }

    if(next) next.onclick = function(){ gazerPlay(GZ.idx + 1); };
    if(apply) apply.onclick = function(){
      var val = (input.value || '').trim();
      if(!val) return;
      if(/\.m3u8/.test(val)){                       // 주소를 그대로 넣은 경우
        GZ.list = [{ name:'직접 입력한 관측점', url:val, x:NaN, y:NaN }].concat(GAZER_FEEDS);
        if(next) next.disabled = GZ.list.length < 2;
        gazerPlay(0);
      } else {                                      // 인증키
        GAZER_KEY = val;
        boot();
      }
      input.value = '';
    };
    boot();
  }

  function pushFeed(html){

    d.className = 'feed-item';
    d.innerHTML = html;

    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 7000);

  /* ---------- 지나가는 것들 ---------- */
  function pickLayer(){
    var total = VIEW_LAYERS.reduce(function(a,l){ return a+l.cost; }, 0);
    var r = Math.random()*total;
    for(var i=0;i<VIEW_LAYERS.length;i++){
      r -= VIEW_LAYERS[i].cost;
      if(r <= 0) return VIEW_LAYERS[i];
    }
    return VIEW_LAYERS[0];
  }

  function spawnEntity(){
    var world = document.getElementById('world');
    if(!world) return;
    var l = pickLayer();
    var unit = Math.max(20, Math.round(l.cost/14));
    var blocked = isBlocked(l.key);

    var el = document.createElement('div');
    el.className = 'ent' + (blocked ? ' blocked' : '');
    var h = 26 + Math.random()*34;
    var bottom = 4 + Math.random()*16;
    var dir = Math.random() > 0.5 ? 1 : -1;
    var dur = 9000 + Math.random()*5000;
    el.style.bottom = bottom + '%';
    var tag = S.forced ? '블러 · ' + l.short
            : blocked ? '차단 · ' + l.short
            : '+' + won(unit);
    el.innerHTML = '<div class="ent-body" style="height:'+h+'px"></div>' +
                   '<div class="ent-tag">' + tag + '</div>';
    el.style.left = (dir === 1 ? -6 : 106) + '%';
    world.appendChild(el);

    var startX = dir === 1 ? -6 : 106;
    var endX   = dir === 1 ? 106 : -6;
    var t0 = performance.now();
    (function step(now){
      var t = Math.min(1, (now - t0)/dur);
      el.style.left = (startX + (endX-startX)*t) + '%';
      if(t < 1){ requestAnimationFrame(step); }
      else if(el.parentNode){ el.parentNode.removeChild(el); }
    })(t0);

    if(blocked){
      S.saved += unit;
      S.blockedCount++;
      S.byLayer[l.key].block++;
      pushFeed(S.forced
        ? '<span class="b">블러</span> ' + l.name + ' · 절약 ' + won(unit)
        : '<span class="b">차단</span> ' + l.name + ' · 절약 ' + won(unit));
    } else {
      S.spent += unit;
      S.passed++;
      S.byLayer[l.key].pass++;
      pushFeed('<span class="p">통과</span> ' + l.name + ' · ' + won(unit));
      if(S.budgetDaily && S.spent >= S.budgetDaily && !S.forced){
        S.forced = true;
        Array.prototype.forEach.call(world.querySelectorAll('.ent-tag'), function(t){ t.textContent = '블러'; });
        pushFeed('<span class="p">예산 초과</span> 전면 블러로 전환됨');
        say('오늘 응시 예산 ' + spWon(S.budgetDaily) + '을 초과했습니다. 지금부터 모든 물체가 자동으로 블러 처리됩니다. 이동에 필요한 윤곽만 남습니다.', {interrupt:true});
      }
    }
    paintHud();
    if(inSystem) refreshMenuValues();
  }

  /* =========================================================
     SYSTEM 패널
     ========================================================= */

  function ruleLines(){
    var bl = blockedList();
    if(!bl.length) return ['차단 규칙 없음. 모든 것이 과금됩니다.'];
    return bl.map(function(l){
      var c = S.byLayer[l.key].block;
      return l.name + ' — 오늘 ' + c + '회 차단, ' + won(Math.round(l.cost/14)*c) + ' 절약';
    });
  }

  function panelContent(key){
    if(key === 'optimize'){
      var dots = '';
      var total = 36;
      var blockedRatio = FULL_DAILY ? dailyProjSaved()/FULL_DAILY : 0;
      var visibleCount = Math.max(1, Math.round(total * (1 - blockedRatio)));
      for(var i=0;i<total;i++){ dots += '<i class="'+(i<visibleCount?'focus':'')+'"></i>'; }
      var rules = ruleLines().map(function(t){ return '<div class="stat-row" style="font-size:12px;"><span>'+escapeHtml(t)+'</span><span></span></div>'; }).join('');
      return '<div class="panel-title">OPTIMIZE — 회피 규칙과 일일 결산</div>' +
        '<div class="crowd">'+dots+'</div>' +
        '<div class="stat-row"><span>오늘 세액</span><span>'+won(S.spent)+'</span></div>' +
        '<div class="stat-row"><span>최적화 없이는</span><span>'+won(S.spent + S.saved)+'</span></div>' +
        '<div class="stat-row total"><span>절약분 · 수수료</span><span>'+won(S.saved)+' / '+won(S.saved*0.1)+'</span></div>' +
        '<div class="flt-group-label" style="margin-top:24px;">적용 중인 회피 규칙</div>' + rules +
        '<div class="italic-line">오늘 ' + S.blockedCount + '명을 아무도 아닌 사람으로 두었습니다.</div>';
    }

    if(key === 'shield'){
      var allowNames = EXPOSE.filter(function(e){ return S.expose[e.key]; }).map(function(e){ return e.name; });
      var blockNames = EXPOSE.filter(function(e){ return !S.expose[e.key]; }).map(function(e){ return e.name; });
      var viewBlock = blockedList().map(function(l){ return l.name; });
      var html = '<div class="panel-title">SHIELD — 허용 · 차단 · 예외</div>' +
        '<div class="contract-cols">' +
          '<div><h5 style="color:var(--teal)">허용</h5><p>' + (allowNames.join(', ') || '없음') + '</p></div>' +
          '<div><h5 style="color:var(--rust)">차단</h5><p>' + (blockNames.concat(viewBlock).join(', ') || '없음') + '</p></div>' +
          '<div><h5 style="color:var(--muted)">예외</h5><p>' + FAMILY.join(', ') + ' 전부 허용</p></div>' +
        '</div>' +
        '<div class="flt-group-label" style="margin-top:26px;">시야 필터 — 내가 보지 않을 것</div><div class="flt-list" id="pViewList"></div>' +
        '<div class="flt-group-label">노출 필터 — 남이 나에게서 읽을 것</div><div class="flt-list" id="pExpList"></div>' +
        '<div class="italic-line">이 설정을 유지하는 동안, 당신을 다르게 볼 수 있는 사람은 없습니다.</div>';
      return html;
    }

    if(key === 'vision'){
      var miss = blockedList();
      var missHtml = miss.length
        ? miss.map(function(l){ return '<div><i>—</i>'+l.name+' (−'+l.vision+')</div>'; }).join('')
        : '<div style="color:var(--dim)">제거된 레이어가 없습니다.</div>';
      var v = visionPct();
      var off = 314 * (1 - v/100);
      return '<div class="panel-title">VISION — 현재 시야 완성도</div>' +
        '<div class="ring-family">' +
          '<svg class="ring-svg" width="120" height="120" viewBox="0 0 120 120">' +
            '<circle cx="60" cy="60" r="50" fill="none" stroke="#2A2C29" stroke-width="9"/>' +
            '<circle cx="60" cy="60" r="50" fill="none" stroke="'+(v<70?'#CD432C':'#8C8F89')+'" stroke-width="9" stroke-dasharray="314" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/>' +
            '<text x="60" y="66" text-anchor="middle" font-size="21" fill="rgba(255,255,255,.85)">'+v+'%</text>' +
          '</svg>' +
          '<div style="flex:1;">' +
            '<div class="stat-row"><span>제거된 레이어</span><span>'+miss.length+' / '+VIEW_LAYERS.length+'</span></div>' +
            '<div class="stat-row"><span>차단 시야량</span><span>'+blockedList().reduce(function(a,l){return a+l.vision;},0)+' / '+FULL_VISION+'pt</span></div>' +
            '<div class="stat-row" style="border-bottom:none;"><span>오늘 차단 건수</span><span>'+S.blockedCount+'회</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="flt-group-label" style="margin-top:22px;">보이지 않는 것</div>' +
        '<div class="miss-list">'+missHtml+'</div>' +
        (S.forced ? '<div class="hold-warn">예산 초과로 전면 블러 처리 중입니다. 설정과 무관하게 지금 모든 물체가 흐려져 있습니다. 통행에 필요한 윤곽만 유지됩니다.</div>' : '') +
        (v < 70 ? '<div class="hold-warn">시야 완성도가 70% 아래입니다. 거리에서 일어나는 일 중 일부는 당신에게 도달하지 않습니다.</div>' : '');
    }

    if(key === 'budget'){
      var dUsed = S.budgetDaily ? Math.min(100, S.spent/S.budgetDaily*100) : 0;
      var mUsed = monthBudget() ? Math.min(100, monthSpent()/monthBudget()*100) : 0;
      return '<div class="panel-title">BUDGET — 일간 · 월간 잔여 응시</div>' +
        '<div class="big-metric">'+(S.budgetDaily?leftoverPct()+'%':'—')+'<small>오늘 남은 응시</small></div>' +
        '<div class="pbar"><i style="width:'+dUsed.toFixed(1)+'%"></i></div>' +
        '<div class="pbar-legend"><span>'+won(S.spent)+'</span><span>'+(S.budgetDaily?won(S.budgetDaily):'상한 없음')+'</span></div>' +
        '<div class="big-metric" style="margin-top:30px;">'+(monthBudget()?monthLeftoverPct()+'%':'—')+'<small>이번 달 남은 응시</small></div>' +
        '<div class="pbar"><i style="width:'+mUsed.toFixed(1)+'%"></i></div>' +
        '<div class="pbar-legend"><span>'+won(monthSpent())+'</span><span>'+(monthBudget()?won(monthBudget()):'상한 없음')+'</span></div>' +
        '<div class="stat-row" style="margin-top:26px;"><span>일 평균 사용</span><span>'+won(dailyProjTax())+'</span></div>' +
        '<div class="stat-row"><span>이번 달 경과</span><span>'+(S.monthDayIndex+1)+' / 30일</span></div>' +
        '<div class="stat-row" style="border-bottom:none;"><span>현재 속도로 소진되는 날</span><span>'+
          (S.budgetDaily ? (dailyProjTax() ? Math.min(30, Math.floor(monthBudget()/dailyProjTax())) + '일차' : '소진 없음') : '—') +
        '</span></div>' +
        (S.forced ? '<div class="hold-warn">오늘 예산을 넘겼습니다. 모든 물체가 자동으로 블러 처리되고 있습니다.</div>' : '');
    }

    if(key === 'ledger'){
      return '<div class="panel-title">LEDGER — 응시 통계</div>' +
        '<div class="tabs" id="ledgerTabs">' +
          '<div class="tab on" data-t="d">일간</div><div class="tab" data-t="m">월간</div><div class="tab" data-t="y">연간</div>' +
        '</div><div id="ledgerBody"></div>';
    }

    if(key === 'hold'){
      return '<div class="panel-title">HOLD — 유지 대상 · 강도 조정</div>' +
        '<div class="big-metric" id="holdDec">'+decidedness().toFixed(2)+'<small>현재 결정도 · '+bandOf(decidedness()).name+'</small></div>' +
        '<input type="range" min="40" max="100" value="100" class="hold-slider" id="holdRange" aria-label="유지 강도">' +
        '<div class="hold-compare"><span id="holdAmt">'+manwon(holdFee())+' / 년</span><span id="holdPct">100%</span></div>' +
        '<div class="hold-warn" id="holdWarn" style="opacity:0;">0.30 아래로 내려가면 사람들이 당신의 얼굴을 기억하지 못하게 됩니다.</div>' +
        '<div class="italic-line">유지 강도를 낮추면 노출 항목이 순서대로 흐려집니다.</div>';
    }

    if(key === 'family'){
      return '<div class="panel-title">FAMILY — 상호 응시 이행률</div>' +
        '<div class="ring-family">' +
          '<svg class="ring-svg" width="120" height="120" viewBox="0 0 120 120">' +
            '<circle cx="60" cy="60" r="50" fill="none" stroke="#2A2C29" stroke-width="9"/>' +
            '<circle cx="60" cy="60" r="50" fill="none" stroke="#CD432C" stroke-width="9" stroke-dasharray="314" stroke-dashoffset="119" transform="rotate(-90 60 60)"/>' +
            '<text x="60" y="66" text-anchor="middle" font-size="21" fill="rgba(255,255,255,.85)">62%</text>' +
          '</svg>' +
          '<div style="flex:1;">' +
            '<div class="stat-row"><span>감면 유지 기준</span><span>70%</span></div>' +
            '<div class="stat-row"><span>잔여 일수</span><span style="color:var(--rust)">8일</span></div>' +
            '<div class="stat-row" style="border-bottom:none;"><span>등록 경로</span><span>관계 기록 자동</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="italic-line">가족 3인은 당신의 신청 없이 예외 목록에 올라 있습니다. 감면을 받는 대신 그들을 차단할 수 없고, 보지 않으면 이행률이 떨어집니다.</div>';
    }

    if(key === 'gazer'){
      return '<div class="panel-title">GAZER — 공개 관측망 중계</div>' +
        '<div class="placeholder-note">지금 이 순간 공개 관측망이 송출하고 있는 화면입니다. ' +
        '당신의 시야가 아니라, 아무도 응시하지 않아도 계속 켜져 있는 시야입니다.</div>' +
        '<div class="gz-box" id="gzBox">' +
          '<video id="gzVideo" muted playsinline autoplay></video>' +
          '<div class="gz-grid"></div><div class="gz-scan"></div>' +
          '<i class="gz-c tl"></i><i class="gz-c tr"></i><i class="gz-c bl"></i><i class="gz-c br"></i>' +
          '<div class="gz-tag" id="gzName"></div>' +
          '<div class="gz-coord" id="gzCoord"></div>' +
          '<div class="gz-foot"><span id="gzDelay">—</span><span><b>과금 면제</b> · 공공 예외</span></div>' +
          '<div class="gz-state" id="gzState"><div class="s1">STANDBY</div></div>' +
        '</div>' +
        '<div class="gz-bar">' +
          '<button class="gz-btn" id="gzNext" type="button">다음 관측점</button>' +
        '</div>' +
        '<div class="gz-key">' +
          '<input id="gzInput" type="text" placeholder="인증키 또는 .m3u8 주소" autocomplete="off" spellcheck="false">' +
          '<button class="gz-btn" id="gzApply" type="button">연결</button>' +
        '</div>' +
        '<div class="stat-row" style="margin-top:22px;"><span>중계원</span><span>공개 교통 관측망</span></div>' +
        '<div class="stat-row"><span>이 화면의 관측세</span><span>면제</span></div>' +
        '<div class="stat-row" style="border-bottom:none;"><span>얼굴 인식</span><span>미적용</span></div>' +
        '<div class="italic-line">이 중계는 화면 속 사람을 인식하지 않습니다. ' +
        '당신이 사람을 보면 과금되지만, 관측망이 사람을 보는 데에는 아무도 돈을 내지 않습니다. ' +
        '요율표에 없는 응시가 하루 종일 계속되고 있습니다.</div>';
    }
    return '';
  }

  function ledgerBody(t){
    var totalEvents = S.passed + S.blockedCount;
    if(t === 'd'){
      var top = VIEW_LAYERS.slice().sort(function(a,b){ return S.byLayer[b.key].block - S.byLayer[a.key].block; })[0];
      return '<div class="stat-row"><span>응시 건수</span><span>'+totalEvents+'건</span></div>' +
        '<div class="stat-row"><span>통과 · 차단</span><span>'+S.passed+' / '+S.blockedCount+'</span></div>' +
        '<div class="stat-row"><span>차단률</span><span>'+(totalEvents?Math.round(S.blockedCount/totalEvents*100):0)+'%</span></div>' +
        '<div class="stat-row"><span>오늘 세액</span><span>'+won(S.spent)+'</span></div>' +
        '<div class="stat-row"><span>오늘 절약</span><span>'+won(S.saved)+'</span></div>' +
        '<div class="stat-row total"><span>남은 응시</span><span>'+(S.budgetDaily?leftoverPct()+'%':'상한 없음')+'</span></div>' +
        '<div class="italic-line">가장 많이 차단한 레이어: '+(top && S.byLayer[top.key].block ? top.name : '없음')+'</div>';
    }
    if(t === 'm'){
      return '<div class="stat-row"><span>경과</span><span>'+(S.monthDayIndex+1)+' / 30일</span></div>' +
        '<div class="stat-row"><span>누적 세액</span><span>'+won(monthSpent())+'</span></div>' +
        '<div class="stat-row"><span>누적 절약</span><span>'+won(dailyProjSaved()*S.monthDayIndex + S.saved)+'</span></div>' +
        '<div class="stat-row"><span>일 평균</span><span>'+won(monthSpent()/(S.monthDayIndex+1))+'</span></div>' +
        '<div class="stat-row"><span>월 예산 대비</span><span>'+(monthBudget()?Math.round(monthSpent()/monthBudget()*100)+'%':'—')+'</span></div>' +
        '<div class="stat-row total"><span>이번 달 남은 응시</span><span>'+(monthBudget()?monthLeftoverPct()+'%':'상한 없음')+'</span></div>' +
        '<div class="italic-line">이번 달 예상 청구액 '+wonToMan(dailyProjTax()*30)+' · 수수료 '+wonToMan(dailyProjSaved()*30*0.1)+'</div>';
    }
    var coh = cohortNumbers(S.profile);
    return '<div class="stat-row"><span>현재 예상 연 관측세</span><span>'+wonToMan(annualTax())+'</span></div>' +
      '<div class="stat-row"><span>필터 없이는</span><span>'+wonToMan(FULL_DAILY*365)+'</span></div>' +
      '<div class="stat-row"><span>연 절약</span><span>'+wonToMan(annualSaved())+' ('+Math.round(dailyProjSaved()/FULL_DAILY*100)+'%)</span></div>' +
      '<div class="stat-row"><span>수수료 (절약분 10%)</span><span>'+wonToMan(annualSaved()*0.1)+'</span></div>' +
      '<div class="stat-row"><span>결정도 유지비</span><span>'+manwon(holdFee())+'</span></div>' +
      '<div class="stat-row total"><span>연 합계</span><span>'+wonToMan(annualTax() + annualSaved()*0.1 + holdFee()*10000)+'</span></div>' +
      '<div class="italic-line">'+escapeHtml(cohortLabel(S.profile))+' 평균은 '+manwon(coh.annual)+'입니다. 당신은 '+
        (annualTax()/10000 < coh.annual ? '평균보다 '+manwon(coh.annual - annualTax()/10000)+' 아래' : '평균보다 '+manwon(annualTax()/10000 - coh.annual)+' 위')+'입니다.</div>';
  }

  /* ---------- 낭독 ---------- */
  function speechText(key){
    if(key === 'ledger'){
      var ev = S.passed + S.blockedCount;
      return '오늘 응시 ' + ev + '건. 통과 ' + S.passed + '건, 차단 ' + S.blockedCount + '건. ' +
             '차단률 ' + spPct(ev ? S.blockedCount/ev*100 : 0) + '. ' +
             '오늘 세액 ' + spWon(S.spent) + ', 절약 ' + spWon(S.saved) + '. ' +
             '이번 달 누적 ' + spWon(monthSpent()) + '. ' +
             '현재 예상 연 관측세 ' + spMan(annualTax()/10000) + ', ' +
             '연 절약 ' + spMan(annualSaved()/10000) + ', ' +
             '수수료 ' + spMan(annualSaved()*0.1/10000) + '.';

      return '현재 결정도 ' + decidedness().toFixed(2) + ', ' + bandOf(decidedness()).name + ' 구간. ' +

    }
    if(key === 'family'){
      return '가족 상호 응시 이행률 62퍼센트. 감면 유지 기준 70퍼센트. 잔여 8일. ' +
             '등록 가족 3인은 관계 기록에서 자동 등록되어 예외 목록에 있습니다. 차단할 수 없습니다.';

        '이 화면의 관측세는 면제입니다. 얼굴 인식은 적용되지 않습니다. ' +
        '당신이 사람을 보면 과금되지만, 관측망이 사람을 보는 데에는 아무도 돈을 내지 않습니다.';
    }
    if(key === 'shield'){
      var allow = EXPOSE.filter(function(e){ return S.expose[e.key]; }).map(function(e){ return e.name; });
      var block = EXPOSE.filter(function(e){ return !S.expose[e.key]; }).map(function(e){ return e.name; })
                    .concat(blockedList().map(function(l){ return l.name; }));
      return '허용. ' + (allow.join(', ') || '없음') + '. ' +
             '차단. ' + (block.join(', ') || '없음') + '. ' +
             '예외. ' + FAMILY.join(', ') + ', 전부 허용.';
    }
    if(key === 'optimize'){
      var rules = blockedList()
        .filter(function(l){ return S.byLayer[l.key].block > 0; })
        .map(function(l){ return l.name + ' ' + S.byLayer[l.key].block + '회'; });
      return '오늘 결산. 세액 ' + spWon(S.spent) + '. 최적화 없이는 ' + spWon(S.spent + S.saved) + '. ' +
             '절약 ' + spWon(S.saved) + ', 수수료 ' + spWon(S.saved*0.1) + '. ' +
             '적용 중인 회피 규칙. ' + (rules.join(', ') || '아직 차단된 것이 없습니다') + '. ' +
             '오늘 ' + S.blockedCount + '명을 아무도 아닌 사람으로 두었습니다.';
    }
    if(key === 'vision'){
      var m = blockedList().map(function(l){ return l.name; });
      return '시야 완성도 ' + spPct(visionPct()) + '. 제거된 레이어 ' + m.length + '개. ' +
             '보이지 않는 것. ' + (m.join(', ') || '없음') + '.' +
             (visionPct() < 70 ? ' 거리에서 일어나는 일 중 일부는 당신에게 도달하지 않습니다.' : '');
    }
    if(key === 'budget'){
      return '오늘 남은 응시 ' + (S.budgetDaily ? spPct(leftoverPct()) : '상한 없음') + '. ' +
             '사용 ' + spWon(S.spent) + ', 예산 ' + (S.budgetDaily ? spWon(S.budgetDaily) : '없음') + '. ' +
             '이번 달 남은 응시 ' + (monthBudget() ? spPct(monthLeftoverPct()) : '상한 없음') + '. ' +
             '이번 달 누적 ' + spWon(monthSpent()) + '. 일 평균 ' + spWon(dailyProjTax()) + '.' +
             (S.forced ? ' 오늘 예산을 초과하여 전면 블러 처리 중입니다.' : '');
    }
    return '';
  }

  var SPEAKABLE = { shield:1, optimize:1, vision:1, budget:1, ledger:1, hold:1, family:1, gazer:1 };

  function stopSpeech(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    var b = document.getElementById('speakBtn');
    if(b) b.classList.remove('on');
  }

  function toggleSpeech(){
    var btn = document.getElementById('speakBtn');
    if(!window.speechSynthesis){ btn.textContent = '낭독 불가'; return; }
    if(window.speechSynthesis.speaking){ stopSpeech(); return; }
    var was = AUD.on; AUD.on = true;              // 다시 듣기는 스위치와 무관
    btn.classList.add('on');
    say(speechText(currentPanel), {interrupt:true, rate:0.98});
    AUD.on = was;
    setTimeout(function(){
      if(!window.speechSynthesis.speaking) btn.classList.remove('on');
    }, 400);
  }

  /* ---------- 패널 열고 닫기 ---------- */
  function openPanel(key){
    if(key === 'void'){ openVoid(); return; }
    currentPanel = key;
    document.getElementById('panelInner').innerHTML = panelContent(key);
    document.getElementById('sysPanel').classList.add('active');
    inPanel = true;

    var sb = document.getElementById('speakBtn');
    sb.hidden = !SPEAKABLE[key];
    sb.classList.remove('on');
    sb.textContent = '낭독';

    if(key === 'hold') wireHold();
    if(key === 'shield') wireShield();
    if(key === 'ledger') wireLedger();
    if(key === 'gazer') wireGazer();

    // 눈을 감은 채로 열었을 수 있으므로 바로 읽어준다
    if(SPEAKABLE[key]) say(speechText(key), {interrupt:true});
  }

  function wireLedger(){
    var body = document.getElementById('ledgerBody');
    body.innerHTML = ledgerBody('d');
    Array.prototype.forEach.call(document.querySelectorAll('#ledgerTabs .tab'), function(tab){
      tab.addEventListener('click', function(){
        Array.prototype.forEach.call(document.querySelectorAll('#ledgerTabs .tab'), function(t){ t.classList.remove('on'); });
        tab.classList.add('on');
        body.innerHTML = ledgerBody(tab.getAttribute('data-t'));
      });
    });
  }

  function wireShield(){
    buildToggleList(document.getElementById('pViewList'), VIEW_LAYERS, S.blocked, function(l){
      return '<div class="flt-meta"><b>'+won(l.cost)+'</b>/일<br>시야 −'+l.vision+'</div>';
    });
    buildToggleList(document.getElementById('pExpList'), EXPOSE, S.expose, function(e){
      return '<div class="flt-meta">결정도 <b>+'+e.dec.toFixed(2)+'</b><br>'+e.fee+'만원/년</div>';
    });
  }

  function buildToggleList(host, items, store, metaFn){
    host.innerHTML = '';
    items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'flt-row' + (store[it.key] ? ' on' : '');
      row.setAttribute('tabindex','0');
      row.setAttribute('role','switch');
      row.innerHTML = '<div class="sw"></div><div class="flt-main"><div class="flt-name">'+it.name+'</div>' +
                      '<div class="flt-desc">'+it.desc+'</div></div>' + metaFn(it);
      function toggle(){
        store[it.key] = !store[it.key];
        row.classList.toggle('on', !!store[it.key]);
        stopSpeech();
        paintHud();
        refreshMenuValues();
        // 상단 요약 3열도 갱신
        var again = panelContent('shield');
        var tmp = document.createElement('div'); tmp.innerHTML = again;
        var newCols = tmp.querySelector('.contract-cols');
        var oldCols = document.querySelector('#panelInner .contract-cols');
        if(newCols && oldCols) oldCols.innerHTML = newCols.innerHTML;
      }
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });
      host.appendChild(row);
    });
  }

  function wireHold(){
    var range = document.getElementById('holdRange');
    var amt = document.getElementById('holdAmt');
    var dec = document.getElementById('holdDec');
    var pct = document.getElementById('holdPct');
    var warn = document.getElementById('holdWarn');
    var baseDec = decidedness(), baseFee = holdFee();
    function update(){
      var t = range.value/100;
      var d = DEC_BASE + (baseDec - DEC_BASE) * t;
      var f = baseFee * t;
      dec.innerHTML = d.toFixed(2) + '<small>현재 결정도 · ' + bandOf(d).name + '</small>';
      amt.textContent = manwon(f) + ' / 년';
      pct.textContent = range.value + '%';
      warn.style.opacity = d < 0.32 ? '1' : '0';
    }
    range.addEventListener('input', update);
    update();
  }

  function closePanel(){
    stopSpeech();
    killGazer();
    document.getElementById('speakBtn').hidden = true;
    document.getElementById('sysPanel').classList.remove('active');
    inPanel = false;
    currentPanel = null;
    refreshMenuValues();
  }

  function openVoid(){
    exitToWorldImmediate();
    var f = document.getElementById('mirrorFlashFull');
    f.classList.remove('hidden');
    var handler = function(){ f.classList.add('hidden'); f.removeEventListener('click', handler); };
    f.addEventListener('click', handler);
  }

  function systemBriefing(){
    var lines = [
      '눈 감음. 과금이 정지되었습니다.',
      '오늘 관측세 ' + spWon(S.spent) + '. 차단으로 아낀 금액 ' + spWon(S.saved) + '.',
      S.budgetDaily
        ? '오늘 남은 응시 ' + spPct(leftoverPct()) + '. 이번 달 남은 응시 ' + spPct(monthLeftoverPct()) + '.'
        : '응시 예산은 설정되어 있지 않습니다.',
      '시야 완성도 ' + spPct(visionPct()) + '. 결정도 ' + decidedness().toFixed(2) + '.',
      S.forced ? '예산을 초과하여 전면 블러 처리 중입니다.' : '',
      '메뉴 ' + (sysItems.length-1) + '개. 위아래 방향키로 옮기고 엔터로 여십시오. 첫 항목, ' +
        sysItems[0].label + ', ' + sysItems[0].sub + '.',
      '나가시려면 눈을 뜨십시오. 뜨는 즉시 과금이 재개됩니다.'
    ].filter(Boolean);
    say(lines.join(' '), {interrupt:true});
  }

  function sayFocused(){
    var it = sysItems[focusIndex];
    if(!it || it.key === 'void'){ say('빈 항목.', {interrupt:true}); return; }
    say(it.label + '. ' + it.sub + '. ' + (it.val ? it.val() : ''), {interrupt:true});
  }

  function enterSystem(){
    inSystem = true;
    focusIndex = 0;
    updateFocus();
    refreshMenuValues();
    document.getElementById('world').classList.add('dimmed');
    document.getElementById('system').classList.add('active');
    systemBriefing();
  }

  function exitToWorldImmediate(){
    if(inSystem) say('눈 뜸. 과금이 재개됩니다.', {interrupt:true});
    inSystem = false; inPanel = false; closing = false;
    document.getElementById('closeProgress').style.setProperty('--p','150%');
    document.getElementById('world').classList.remove('dimmed');
    document.getElementById('system').classList.remove('active');
    closePanel();
  }

  var pressCount = 0;
  function startClosing(){
    if(inSystem || closing) return;
    closing = true; pressCount = 0;
    closeStart = performance.now();
    (function step(){
      if(!closing) return;
      var t = Math.min(1, (performance.now()-closeStart)/HOLD_MS);
      pressCount = countDown(t, pressCount);
      document.getElementById('closeProgress').style.setProperty('--p', (150 - t*150)+'%');
      if(t >= 1){
        closing = false;
        document.getElementById('closeProgress').style.setProperty('--p','150%');
        enterSystem();
        return;
      }
      closeTimer = requestAnimationFrame(step);
    })();
  }

  function cancelClosing(){
    closing = false; pressCount = 0; shutUp();
    if(closeTimer) cancelAnimationFrame(closeTimer);
    document.getElementById('closeProgress').style.setProperty('--p','150%');
  }

  // t(0..1) 진행도를 THREE, TWO, ONE 으로 읽어준다
  function countDown(t, last){
    var remain = Math.max(1, Math.ceil((1-t)*3));
    if(remain !== last){ say(['','One','Two','Three'][remain], {interrupt:true, rate:1.12, lang:'en', blip:false}); return remain; }
    return last;
  }

  function setVignette(p){
    document.getElementById('closeProgress').style.setProperty('--p', p+'%');
  }

  /* ---------- 카메라: 감음 = SYSTEM, 뜸 = WORLD ---------- */
  var eyeShutStart = 0, eyeOpenStart = 0, chipTick = 0, eyeCount = 0;

  function eyeLoop(){
    var E = eye();
    if(E.active){
      var shut = E.closed && E.face;

      if(shut && !inSystem){
        if(!eyeShutStart){ eyeShutStart = performance.now(); eyeCount = 0; }
        var t = Math.min(1, (performance.now()-eyeShutStart)/EYE_HOLD_MS);
        setVignette(150 - t*150);
        eyeCount = countDown(t, eyeCount);
        if(t >= 1){ eyeShutStart = 0; eyeCount = 0; setVignette(150); enterSystem(); }
      } else if(!shut){
        if(eyeShutStart){ eyeShutStart = 0; eyeCount = 0; setVignette(150); }
        // 패널을 읽는 동안은 눈을 떠도 유지된다 (읽으려면 봐야 하므로)
        if(inSystem && !inPanel){
          if(!eyeOpenStart) eyeOpenStart = performance.now();
          if(performance.now()-eyeOpenStart > 600){ eyeOpenStart = 0; exitToWorldImmediate(); }
        } else { eyeOpenStart = 0; }
      } else { eyeOpenStart = 0; }

      if(performance.now() - chipTick > 120){
        chipTick = performance.now();
        var chip = document.getElementById('camChip');
        var lbl = document.getElementById('camLbl');
        var bar = document.getElementById('camBar');
        if(chip && !chip.hidden){
          chip.classList.toggle('shut', shut);
          chip.classList.toggle('open', !shut && E.face);
          lbl.textContent = !E.face ? '얼굴 없음' : (shut ? '눈 감음 · 과금 정지' : '눈 뜸 · 과금 중');
          bar.style.width = Math.round(Math.min(1, E.score)*100) + '%';
        }
      }
    }
    requestAnimationFrame(eyeLoop);
  }

  /* =========================================================
     초기화
     ========================================================= */
  function initExperience(){
    buildCity();
    buildMenu();

    // 오늘 하루 중 이미 지난 분량을 시드로 (오후로 가정)
    S.spent = Math.round(dailyProjTax() * 0.34);
    S.saved = Math.round(dailyProjSaved() * 0.34);
    S.passed = 22; S.blockedCount = Math.round(22 * (dailyProjSaved()/FULL_DAILY || 0));
    if(S.budgetDaily && S.spent >= S.budgetDaily) S.forced = true;
    paintHud();

    var world = document.getElementById('world');
    showAudChip();
    if(eye().active) showChip();
    if(eye().active){
      document.getElementById('worldHint').textContent = '눈을 감으면 SYSTEM이 열립니다';
      eyeLoop();
    }
    say(eye().active
      ? '눈을 3초간 감으면 시스템이 열립니다.'
      : '화면을 3초간 누르면 시스템이 열립니다.', {interrupt:true});
    setTimeout(function(){ document.getElementById('worldHint').classList.add('faded'); }, 5200);
    setTimeout(function(){ document.getElementById('cornerBrand').classList.add('faded'); }, 3600);

    var pressing = false;
    world.addEventListener('pointerdown', function(){ pressing = true; startClosing(); });
    window.addEventListener('pointerup', function(){ if(pressing){ pressing=false; if(closing) cancelClosing(); } });
    world.addEventListener('pointerleave', function(){ if(pressing && closing){ cancelClosing(); pressing=false; } });

    document.getElementById('system').addEventListener('click', function(e){
      if(e.target.id === 'system'){ exitToWorldImmediate(); }
    });
    document.getElementById('sysPanel').addEventListener('click', function(e){
      if(e.target.id === 'sysPanel'){ closePanel(); }
    });
    document.getElementById('panelBack').addEventListener('click', closePanel);
    document.getElementById('speakBtn').addEventListener('click', function(e){ e.stopPropagation(); toggleSpeech(); });

    window.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(inPanel){ closePanel(); } else if(inSystem){ exitToWorldImmediate(); }
        return;
      }
      if(!inSystem) return;
      if(e.key === ' '){                       // 눈 감은 채로 다시 듣기
        e.preventDefault();
        if(inPanel) say(speechText(currentPanel), {interrupt:true});
        else systemBriefing();
        return;
      }
      if(inPanel) return;
      if(e.key === 'ArrowDown'){ focusIndex = (focusIndex+1)%sysItems.length; updateFocus(); sayFocused(); e.preventDefault(); }
      else if(e.key === 'ArrowUp'){ focusIndex = (focusIndex-1+sysItems.length)%sysItems.length; updateFocus(); sayFocused(); e.preventDefault(); }
      else if(e.key === 'Enter'){ openPanel(sysItems[focusIndex].key); }
    });

    // 피응시 신호 — 노출 필터가 반영됨
    (function pulseGaze(){
      var side = Math.random() > 0.5 ? 'right' : 'left';
      var el = document.getElementById(side === 'right' ? 'gazeRight' : 'gazeLeft');
      var label = document.getElementById(side === 'right' ? 'gazeLabelRight' : 'gazeLabelLeft');
      var shapeOn = S.expose.shape;
      label.textContent = '피응시 · ' + (side==='right'?'우측':'좌측') + ' · ' +
        (shapeOn ? '결정도 ' + decidedness().toFixed(2) + ' 반영됨' : '형태 차단됨');
      el.classList.add('on'); label.classList.add('on');
      setTimeout(function(){ el.classList.remove('on'); label.classList.remove('on'); }, 2600);
      setTimeout(pulseGaze, 4000 + Math.random()*5000);
    })();

    // 지나가는 것들
    (function loop(){
      var E = eye();
      var shut = E.active && E.closed && E.face;
      if(!inSystem && !shut) spawnEntity();
      setTimeout(loop, 1200 + Math.random()*1400);
    })();
  }

  start();
})();
</script>
</body>
</html>
