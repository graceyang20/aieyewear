      desc:'타인의 시야에서 당신의 얼굴 자체가 블러로 처리됩니다. 아무 신호도 남지 않습니다.',
      foot:'MAX · 완전 차단' }
  ];

  var DEC_BASE = 0.10;                       // 전부 차단해도 남는 결정도
  var FULL_DAILY = VIEW_LAYERS.reduce(function(a,l){ return a+l.cost; }, 0); // 6,100
  var FULL_VISION = VIEW_LAYERS.reduce(function(a,l){ return a+l.vision; }, 0); // 41
  var FAMILY = ['등록 가족 3인'];

  var S = {
    profile: { job:null, age:null, sex:null },
    blocked: {},          // 시야 필터: key -> true(차단)
    expose: {},           // 노출 필터: key -> true(허용). 구독 플랜이 결정한다.
    shieldPlan: 'open',   // 노출 차단 구독 플랜
    budgetDaily: 6100,
    spent: 0,             // 오늘 누적 관측세
    saved: 0,             // 오늘 누적 절약
    passed: 0,            // 통과 건수
    blockedCount: 0,      // 차단 건수
    byLayer: {},          // key -> {pass, block}
    monthDayIndex: 13,    // 이번 달 경과 일수(오늘 이전)
    yearDayIndex: 194,
    forced: false         // 예산 초과로 전면 블러 처리된 상태
  };
  EXPOSE.forEach(function(e){ S.expose[e.key] = true; });   // 기본값: 전부 허용 = 결정도 0.71
  VIEW_LAYERS.forEach(function(l){ S.byLayer[l.key] = { pass:0, block:0 }; });

  /* =========================================================
     계산
     ========================================================= */

  function isBlocked(k){ return S.forced || !!S.blocked[k]; }
  function blockedList(){ return VIEW_LAYERS.filter(function(l){ return S.blocked[l.key]; }); }
  function allowedList(){ return VIEW_LAYERS.filter(function(l){ return !S.blocked[l.key]; }); }
  function dailyProjTax(){ return allowedList().reduce(function(a,l){ return a+l.cost; }, 0); }
  function dailyProjSaved(){ return FULL_DAILY - dailyProjTax(); }
  function visionPct(){ return 100 - blockedList().reduce(function(a,l){ return a+l.vision; }, 0); }
  function decidedness(){
    return EXPOSE.reduce(function(a,e){ return a + (S.expose[e.key] ? e.dec : 0); }, DEC_BASE);
  }
  function planOf(){
    for(var i=0;i<SHIELD_PLANS.length;i++){ if(SHIELD_PLANS[i].key === S.shieldPlan) return SHIELD_PLANS[i]; }
    return SHIELD_PLANS[0];
  }
  function applyPlan(k){
    S.shieldPlan = k;
    var p = planOf();
    EXPOSE.forEach(function(e){ S.expose[e.key] = p.keep.indexOf(e.key) >= 0; });
  }
  function holdFee(){ // 만원/년 — 선택한 구독 플랜의 연 환산 요금
    return planOf().price * 12 / 10000;
  }
  function annualTax(){ return dailyProjTax() * 365; }
  function annualSaved(){ return dailyProjSaved() * 365; }
  function leftoverPct(){
    if(!S.budgetDaily) return 100;
    return Math.max(0, Math.round((1 - S.spent/S.budgetDaily) * 100));
  }
  function monthSpent(){ return dailyProjTax()*S.monthDayIndex + S.spent; }
  function monthBudget(){ return S.budgetDaily ? S.budgetDaily*30 : 0; }
  function monthLeftoverPct(){
    if(!monthBudget()) return 100;
    return Math.max(0, Math.round((1 - monthSpent()/monthBudget()) * 100));
  }

  function won(v){ return '₩' + Math.round(v).toLocaleString('ko-KR'); }
  function manwon(v){ return (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,'') + '만원'; }
  function wonToMan(v){ return manwon(v/10000); }
  function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  /* =========================================================
     온보딩
     ========================================================= */

  var ob = document.getElementById('ob-content');
  var onboarding = document.getElementById('onboarding');

  /* ---------- AR HUD 화면 맞춤 ----------
     안경 화면은 스크롤이 불가능하므로, 각 화면의 내용이 세로로 넘치면
     뷰포트 안에 들어오도록 자동 축소한다(zoom 은 레이아웃을 다시 계산해
     기존 세로 중앙정렬이 그대로 유지된다). 넘치지 않으면 원본 크기. */
  function WEAR_fitScreen(container, content){
    if(!container || !content) return;
    content.style.zoom = '1';
    var avH = container.clientHeight, avW = container.clientWidth;
    var h = content.offsetHeight, w = content.offsetWidth;
    if(!h || !w || !avH || !avW) return;
    var s = Math.min(1, avH / h, avW / w);
    content.style.zoom = (s < 0.999) ? String(s) : '1';
  }
  function WEAR_fitAll(){
    WEAR_fitScreen(onboarding, ob);
    WEAR_fitScreen(document.getElementById('system'),  document.getElementById('sysMenu'));
    WEAR_fitScreen(document.getElementById('sysPanel'), document.getElementById('panelInner'));
  }
  window.WEAR_fitAll = WEAR_fitAll;
  window.addEventListener('resize', function(){ requestAnimationFrame(WEAR_fitAll); });

  var obEyeRaf = null;
  var OB_DISPOSE = [];
  function setContent(html){
    if(obEyeRaf){ cancelAnimationFrame(obEyeRaf); obEyeRaf = null; }
    OB_DISPOSE.forEach(function(f){ try{ f(); }catch(e){} });
    OB_DISPOSE = [];
    ob.innerHTML = html; onboarding.scrollTop = 0;
    requestAnimationFrame(function(){ WEAR_fitScreen(onboarding, ob); navBind(); });
  }

  /* ---------- 온보딩 뒤로가기 ----------
     각 단계는 들어올 때 자기 이전 단계를 등록한다.
     토큰은 뒤로 간 뒤에 이전 단계의 타이머가 되살아나는 것을 막는다. */
  var OB_PREV = null, OB_TOKEN = 0;
  var OB_TOTAL = 12;
  function obPaintIndicator(step){
    var wrap = document.getElementById('obIndicator');
    var dots = document.getElementById('obDots');
    var count = document.getElementById('obStepCount');
    if(!wrap || !dots || !count) return;
    if(!dots.children.length){
      for(var i=1;i<=OB_TOTAL;i++){ var d=document.createElement('i'); d.className='ob-dot'; dots.appendChild(d); }
    }
    step = Math.max(1, Math.min(OB_TOTAL, step || 1));
    count.textContent = String(step).padStart(2,'0') + ' / ' + String(OB_TOTAL).padStart(2,'0');
    Array.prototype.forEach.call(dots.children,function(d,i){
      d.className='ob-dot' + (i+1===step?' on':(i+1<step?' done':''));
    });
  }
  function stageEnter(prev, step){
    OB_PREV = prev || null;
    OB_TOKEN++;
    var b = document.getElementById('obBack');
    if(b) b.hidden = !OB_PREV;
    obPaintIndicator(step);
    return OB_TOKEN;
  }
  (function(){
    var b = document.getElementById('obBack');
    if(!b) return;
    b.addEventListener('click', function(){
      if(!OB_PREV) return;
      var p = OB_PREV;
      shutUp();
      p();
    });
  })();
  function eye(){ return window.EYE || { active:false, closed:false, score:0, face:false }; }
  var EYE_HOLD_MS = 3000;

  /* ================= 음성 안내 =================
     눈을 감으면 화면을 볼 수 없으므로, 그동안의 UI는 소리다. */
  // 클릭할 때마다 자동으로 낭독하는 동작은 없앴다.
  // 다만 캘리브레이션 안내와 three-two-one 카운트다운은 진행에 필요하므로 남긴다.
  // 전부 끄고 싶으면 우측 하단 음성 칩을 누른다.
  var AUD = { on:true, voice:null, voiceEn:null, talking:false };

  function pickVoice(){
    if(!window.speechSynthesis) return;
    var vs = window.speechSynthesis.getVoices() || [];
    // 뉴럴·프리미엄 보이스는 너무 사람 같다. 로컬 합성 보이스를 우선한다.
    function rank(list){
      var human = /neural|premium|enhanced|natural|siri|google\s|wavenet/i;
      var synth = /compact|espeak|microsoft|eloquence|novelty/i;
      var local = list.filter(function(v){ return v.localService !== false; });
      var pool  = local.length ? local : list;
      return pool.filter(function(v){ return synth.test(v.name); })[0]
          || pool.filter(function(v){ return !human.test(v.name); })[0]
          || pool[0] || null;
    }
    AUD.voice   = rank(vs.filter(function(v){ return /^ko/i.test(v.lang); }));
    AUD.voiceEn = rank(vs.filter(function(v){ return /^en/i.test(v.lang); }));
  }
  // 영어 안내(gathering/verified/321)는 반드시 영어 보이스로. 없으면 그 자리에서 다시 찾는다.
  // 보이스를 못 지정하면 한국어 기본 보이스가 영어를 한국어 발음으로 읽는다.
  function enVoice(){
    var vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    // 캐시가 현재 목록에 실제로 존재할 때만 신뢰한다 (교체되면 stale 참조가 무시돼 한국어로 샌다).
    if(AUD.voiceEn && vs.indexOf(AUD.voiceEn) !== -1) return AUD.voiceEn;
    pickVoice();
    vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    if(AUD.voiceEn && vs.indexOf(AUD.voiceEn) !== -1) return AUD.voiceEn;
    return vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null;
  }
  if(window.speechSynthesis){
    pickVoice();
    window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function paintAud(){
    var c = document.getElementById('audChip');
    if(!c) return;
    c.classList.toggle('on', AUD.on);
    c.classList.toggle('talking', AUD.talking);
    document.getElementById('audLbl').textContent = AUD.on ? '음성 안내 켜짐' : '음성 안내 꺼짐';
  }

  /* ================= 기계 음색 =================
     브라우저 TTS 는 합성된 음성 자체를 가공할 수 없다. 그래서
     (1) 음정을 내리고 (2) 어절을 짧게 끊어 억양을 죽이고
     (3) 그 아래에 캐리어 톤과 신호음을 따로 깔아 기계처럼 들리게 한다. */
  var MACHINE = { pitch:0.60, rate:0.97 };
  var AC = null, humOsc = null, humGain = null;

  function ac(){
    if(!AC){
      try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ return null; }
    }
    if(AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
    return AC;
  }

  // 안내 시작을 알리는 2음 신호
  function blip(){
    var c = ac(); if(!c) return;
    var t0 = c.currentTime;
    [[1180, 0], [1760, 0.05]].forEach(function(p){
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(p[0], t0 + p[1]);
      g.gain.setValueAtTime(0.0001, t0 + p[1]);
      g.gain.exponentialRampToValueAtTime(0.03, t0 + p[1] + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + p[1] + 0.055);
      o.connect(g); g.connect(c.destination);
      o.start(t0 + p[1]); o.stop(t0 + p[1] + 0.08);
    });
  }

  // 말하는 동안 아래에 깔리는 캐리어 — 기기가 돌아가는 소리
  function humOn(){
    var c = ac(); if(!c || humOsc) return;
    humOsc = c.createOscillator();
    var det = c.createOscillator();
    humGain = c.createGain();
    var lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 220;
    humOsc.type = 'sawtooth'; humOsc.frequency.value = 57;
    det.type = 'sine'; det.frequency.value = 85.5;
    humGain.gain.setValueAtTime(0.0001, c.currentTime);
    humGain.gain.linearRampToValueAtTime(0.016, c.currentTime + 0.18);
    humOsc.connect(lp); det.connect(lp); lp.connect(humGain); humGain.connect(c.destination);
    humOsc.start(); det.start();
    humOsc._det = det;
  }
  function humOff(){
    if(!humOsc || !AC) return;
    var o = humOsc, g = humGain, t = AC.currentTime;
    humOsc = null; humGain = null;
    try{
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.22);
      o.stop(t + 0.26); if(o._det) o._det.stop(t + 0.26);
    }catch(e){}
  }

  function shutUp(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    humOff();
    AUD.talking = false; paintAud();
  }

  // TTS가 기호를 그대로 읽지 않도록 말로 바꾼다
  function spClean(t){
    return String(t)
      .replace(/₩\s?([\d,]+)/g, function(m,n){ return n.replace(/,/g,'') + '원'; })
      .replace(/([\d.]+)\s?%/g, '$1퍼센트')
      .replace(/\s*·\s*/g, ', ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  // 문장을 짧은 토막으로 끊는다. 억양이 이어지지 않아 기계가 읽는 것처럼 들린다.
  function chunkText(t){
    var marked = String(t)
      .replace(/([.?!])\s+/g, '$1\u0000')
      .replace(/\s*,\s*/g, ',\u0000');
    var out = [];
    marked.split('\u0000').forEach(function(part){
      part = part.trim();
      if(!part) return;
      var w = part.split(/\s+/);
      for(var i=0; i<w.length; i+=3) out.push(w.slice(i, i+3).join(' '));
    });
    return out.filter(Boolean);
  }

  // 안내가 끝나는 시점을 알아야 하는 곳이 있다. opts.onEnd 로 알린다.
  // 말할 수 없는 상태면 false 를 돌려준다.
  function say(text, opts){
    opts = opts || {};
    // 낭독 전면 중단: 캘리브레이션 안내와 321 카운트(keep:true)만 소리로 남긴다.
    if(!opts.keep) return false;
    if(!AUD.on || !text || !window.speechSynthesis) return false;
    var en = (opts.lang === 'en');
    var body = en ? String(text) : spClean(text);
    var parts = en ? [body] : chunkText(body);
    if(!parts.length) return false;

    function fire(){
      if(!AUD.on) return;
      if(opts.blip !== false) blip();
      parts.forEach(function(seg, i){
        var u = new SpeechSynthesisUtterance(seg);
        u.lang = en ? 'en-US' : 'ko-KR';
        try{
          var pick = en ? enVoice() : AUD.voice;
          if(pick) u.voice = pick;
        }catch(e){ AUD.voice = null; AUD.voiceEn = null; }
        u.rate  = (opts.rate || 1) * MACHINE.rate;
        u.pitch = MACHINE.pitch;   // 토막마다 같은 음정 — 억양이 생기지 않는다
        if(i === 0) u.onstart = function(){ AUD.talking = true; humOn(); paintAud(); };
        u.onend = u.onerror = function(){
          var live = window.speechSynthesis.speaking || window.speechSynthesis.pending;
          AUD.talking = live;
          if(!live) humOff();
          paintAud();
          if(i === parts.length-1 && opts.onEnd){
            var done = opts.onEnd; opts.onEnd = null; done();
          }
        };
        window.speechSynthesis.speak(u);
      });
    }

    if(opts.interrupt){
      window.speechSynthesis.cancel();
      // 크롬은 cancel 직후의 speak 를 삼키는 일이 있다
      setTimeout(fire, 60);
    } else {
      fire();
    }
    return true;
  }

  // 숫자는 쉼표를 빼야 TTS가 끊지 않고 읽는다
  function spWon(v){ return Math.round(v) + '원'; }
  function spPct(v){ return Math.round(v) + '퍼센트'; }
  function spMan(v){ return (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,'') + '만원'; }

  /* =========================================================
     손 없는 조작 — 끄덕임 · 음성으로 CTA 실행

     이 세계의 안경은 손으로 누르는 물건이 아니다. 화면의
     '다음/뒤로'를 눌러도 진행되지 않고, 대신 "고개를 끄덕이거나
     '다음'이라고 말하세요" 안내가 나온다. 실제 진행은 끄덕임 또는
     음성으로만 이뤄진다.

       - 다음(primary): 현재 화면에서 비활성이 아닌 .ghost-btn
       - 뒤로(back)   : #obBack
       - 끄덕임        : window.EYE.nodSeq 증가 → 다음
       - 음성          : "다음/계속/시작/응/그래/네" → 다음,
                         "뒤로/취소/이전"           → 뒤로

     안전 밸브: CTA 를 빠르게 두 번 누르면(더블클릭/더블탭) 그대로
     실행된다. 카메라·마이크가 없는 환경에서 데모를 이어가기 위한 것.
     ========================================================= */
  var NAV = {
    on:false, primary:null, back:null,
    nodSeen:0, shakeSeen:0, guided:false, voiceLbl:'다음',
    lastTapEl:null, lastTapAt:0, bypass:false
  };

  // 현재 온보딩 화면의 CTA 를 다시 스캔한다. setContent 직후에 한 번,
  // 그리고 navPollNod 가 매 프레임 다시 부른다 — 버튼이 disabled 였다가
  // 칩 선택으로 활성화되는 화면(직업·나이·성별)에서도 곧바로 잡히도록.
  function navRescan(){
    if(!NAV.on) return;
    var buttons = ob.querySelectorAll('.ghost-btn');
    var primary = null;
    Array.prototype.forEach.call(buttons, function(b){
      if(!primary && !b.disabled && b.offsetParent !== null) primary = b;
    });
    var back = document.getElementById('obBack');
    var backEl = (back && !back.hidden) ? back : null;

    var changed = (primary !== NAV.primary) || (backEl !== NAV.back);
    NAV.primary = primary || null;
    NAV.back = backEl;
    if(!changed) return;                         // 바뀐 게 없으면 힌트 재생성 안 함

    NAV.voiceLbl = (primary && /다음/.test(primary.textContent)) ? '다음' :
                   (primary ? primary.textContent.trim().split(/\s+/)[0] : '다음');

    var old = ob.querySelector('.cta-hint'); if(old) old.remove();
    if(primary){
      var hint = document.createElement('div');
      hint.className = 'cta-hint';
      var backHint = NAV.back
        ? '<span class="sep">·</span><span class="shake"><i>↔</i> 도리도리로 뒤로</span>'
        : '';
      hint.innerHTML = '<span class="nod"><i>↓↓</i> 두 번 끄덕임</span>' +
        '<span class="k">' + escapeHtml(NAV.voiceLbl).toUpperCase() + '</span>' +
        '<span>이라고 말하기</span>' + backHint;
      if(primary.parentNode) primary.parentNode.insertBefore(hint, primary.nextSibling);
      requestAnimationFrame(function(){ hint.classList.add('show'); });
    }
  }

  // setContent 직후 호출 — 새 화면이므로 카운터 기준선을 리셋하고 스캔한다.
  function navBind(){
    if(!NAV.on) return;
    NAV.primary = null; NAV.back = null;         // 강제 재구성
    NAV.nodSeen   = (window.EYE && window.EYE.nodSeq)   || 0;
    NAV.shakeSeen = (window.EYE && window.EYE.shakeSeq) || 0;
    navRescan();
  }

  // CTA 를 눌렀을 때 — 진행 대신 안내. (두 번째 빠른 탭은 통과)
  function navGuide(kind){
    var now = Date.now();
    var el = kind === 'back' ? NAV.back : NAV.primary;
    if(NAV.lastTapEl === el && (now - NAV.lastTapAt) < 600){
      navGo(kind); return;                    // 안전 밸브: 더블탭 통과
    }
    NAV.lastTapEl = el; NAV.lastTapAt = now;
    NAV.guided = true;
    if(NAV.primary) NAV.primary.classList.add('await');
    var msg = kind === 'back'
      ? '고개를 좌우로 저으시거나 뒤로라고 말하세요'
      : '고개를 두 번 끄덕이거나 ' + NAV.voiceLbl + '이라고 말하세요';
    say(msg, { keep:true, interrupt:true, blip:false });
  }

  // 실제 진행
  function navGo(kind){
    var el = kind === 'back' ? NAV.back : NAV.primary;
    if(!el || el.disabled) return;
    shutUp();
    NAV.primary = NAV.back = null;            // 중복 실행 방지
    NAV.bypass = true;                         // 가로채기 우회
    el.click();
    NAV.bypass = false;
  }

  // 끄덕임/도리도리 폴링 — nodSeq↑=다음, shakeSeq↑=뒤로.
  // 겸사겸사 CTA 를 다시 스캔한다(버튼이 뒤늦게 활성화되는 화면 대응).
  var navScanAt = 0;
  function navPollNod(){
    if(NAV.on){
      var now = performance.now();
      if(now - navScanAt > 200){ navScanAt = now; navRescan(); }
      if(window.EYE){
        if(window.EYE.nodSeq > NAV.nodSeen){
          NAV.nodSeen = window.EYE.nodSeq;
          if(NAV.primary && !NAV.primary.disabled) navGo('next');
        }
        if(window.EYE.shakeSeq > NAV.shakeSeen){
          NAV.shakeSeen = window.EYE.shakeSeq;
          if(NAV.back) navGo('back');
        }
      }
    }
    requestAnimationFrame(navPollNod);
  }

  // 음성 인식 — 크롬 계열의 webkitSpeechRecognition
  var VOICE = { rec:null, want:false, active:false };
  function voiceSupported(){
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }
  function vcSet(txt, state){                    // state: 'listen' | 'off' | 'err'
    var chip = document.getElementById('vcChip');
    if(!chip) return;
    chip.hidden = false;
    chip.classList.toggle('listening', state === 'listen');
    chip.classList.toggle('off', state !== 'listen');
    var lbl = document.getElementById('vcLbl');
    if(lbl) lbl.textContent = txt;
  }
  function voiceStart(){
    if(!NAV.on || !voiceSupported() || VOICE.active) return;
    // 보안 컨텍스트가 아니면(예: file://) 마이크가 아예 안 열린다
    if(!window.isSecureContext && location.protocol !== 'http:'){
      vcSet('음성 불가 · localhost로 여세요', 'err'); return;
    }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var rec = new SR();
    rec.lang = 'ko-KR'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = function(ev){
      for(var i=ev.resultIndex; i<ev.results.length; i++){
        var t = (ev.results[i][0].transcript || '').replace(/\s/g,'');
        if(/(뒤로|이전|취소|백)/.test(t)){ if(NAV.back) navGo('back'); return; }
        if(/(다음|계속|시작|확인|넘어가|응|그래|네|예|오케이|오키|고)/.test(t)){
          if(NAV.primary && !NAV.primary.disabled) navGo('next'); return;
        }
      }
    };
    rec.onend = function(){ VOICE.active = false; if(VOICE.want) setTimeout(voiceStart, 250); };
    rec.onerror = function(e){
      VOICE.active = false;
      var err = e && e.error;
      if(err === 'not-allowed' || err === 'service-not-allowed'){
        VOICE.want = false; vcSet('마이크 차단됨 · 눌러서 재시도', 'err');
      } else if(err === 'no-speech' || err === 'aborted'){
        /* 무시하고 onend 에서 재시작 */
      } else if(err === 'network'){
        vcSet('음성 네트워크 오류 · 재시도', 'err');
      } else {
        vcSet('음성 오류 · 눌러서 재시도', 'err');
      }
    };
    try{
      rec.start(); VOICE.rec = rec; VOICE.active = true; VOICE.want = true;
      vcSet('음성 명령 듣는 중', 'listen');
    }catch(e){ VOICE.active = false; vcSet('음성 시작 실패 · 눌러서 재시도', 'err'); }
  }
  function voiceStop(){
    VOICE.want = false;
    try{ if(VOICE.rec) VOICE.rec.stop(); }catch(e){}
    var chip = document.getElementById('vcChip');
    if(chip){ chip.classList.remove('listening'); chip.hidden = true; }
  }
  // 칩을 누르면 수동 재시도 (사용자 제스처가 있어야 마이크를 여는 브라우저 대응)
  (function(){
    var chip = document.getElementById('vcChip');
    if(chip) chip.addEventListener('click', function(){
      if(!voiceSupported()) return;
      VOICE.want = true; VOICE.active = false;
      try{ if(VOICE.rec) VOICE.rec.stop(); }catch(e){}
      setTimeout(voiceStart, 120);
    });
  })();

  // 온보딩 전체에 클릭 위임 — 어느 화면의 CTA든 여기서 가로챈다
  function navInit(){
    if(NAV.on) return;
    NAV.on = true;
    onboarding.addEventListener('click', function(ev){
      if(NAV.bypass) return;                   // navGo 가 실행한 클릭은 통과
      var b = ev.target.closest && ev.target.closest('.ghost-btn, #obBack');
      if(!b) return;
      if(b.disabled) return;
      // 진행 성격의 CTA만 가로챈다. 화면 안의 선택 칩/토글 등은 그대로 둔다.
      var isBack = (b.id === 'obBack');
      var isPrimary = (b === NAV.primary);
      if(!isBack && !isPrimary) return;
      ev.preventDefault(); ev.stopPropagation();
      navGuide(isBack ? 'back' : 'next');
    }, true);
    navPollNod();
    handCursorLoop();
    if(!voiceSupported()){
      vcSet('음성 미지원 · 끄덕임만', 'off');
    }
  }

  /* ================= 손 커서 + pinch 클릭 =================
     EYE.hand(검지 끝, 정규화 좌표)를 화면 좌표로 옮겨 커서를 그린다.
     CTA(다음/뒤로) 근처에 가면 자석처럼 스냅되고, 집으면(pinchSeq↑)
     스냅된 버튼을 실행한다. 스냅 대상이 없으면 커서 아래 요소를 클릭. */
  var HAND = { pinchSeen:0, target:null, lastClickAt:0, COOLDOWN:800, slider:null };
  function handCursorLoop(){
    var cur = document.getElementById('handCursor');
    var E = window.EYE;
    if(NAV.on && cur && E && E.hand && E.hand.present){
      var vw = window.innerWidth, vh = window.innerHeight;
      var px = E.hand.x * vw, py = E.hand.y * vh;

      // 슬라이더가 있으면 트랙 근처에서 커서가 트랙 위로 붙는다(가로 조작 전용)
      var slider = document.getElementById('bdRange');
      var onSlider = false, sRect = null;
      if(slider){
        sRect = slider.getBoundingClientRect();
        // 트랙 세로 중심에서 ±60px, 가로로는 트랙 범위 ±40px 안이면 슬라이더 조작 영역
        var band = 60, padX = 40;
        if(py > sRect.top - band && py < sRect.bottom + band &&
           px > sRect.left - padX && px < sRect.right + padX){
          onSlider = true;
        }
      }

      // 스냅 대상 찾기 — 현재 화면의 CTA 중 커서에 가장 가까운 것
      var targets = [];
      if(NAV.primary) targets.push(NAV.primary);
      if(NAV.back) targets.push(NAV.back);
      var best = null, bestD = 1e9, SNAP = 90;
      targets.forEach(function(el){
        var r = el.getBoundingClientRect();
        var cx = r.left + r.width/2, cy = r.top + r.height/2;
        var dx = px - cx, dy = py - cy;
        var inside = px>=r.left && px<=r.right && py>=r.top && py<=r.bottom;
        var d = inside ? 0 : Math.hypot(dx, dy);
        if(d < bestD){ bestD = d; best = { el:el, cx:cx, cy:cy, d:d }; }
      });

      var snapped = best && bestD < SNAP;
      // 슬라이더 영역이 CTA 스냅보다 우선 — 트랙 위로 커서를 끌어올린다
      if(onSlider){
        snapped = false; HAND.target = null; HAND.slider = slider;
        var trackY = sRect.top + sRect.height/2;
        px = Math.max(sRect.left, Math.min(sRect.right, px));  // 트랙 밖으로 안 나가게
        py = py*0.4 + trackY*0.6;
        cur.classList.add('snap');
      } else {
        HAND.slider = null;
        if(snapped){ px = px*0.45 + best.cx*0.55; py = py*0.45 + best.cy*0.55; }
        HAND.target = snapped ? best.el : null;
        cur.classList.toggle('snap', !!snapped);
      }

      cur.hidden = false;
      cur.style.left = px + 'px';
      cur.style.top  = py + 'px';
      cur.classList.toggle('pinch', !!E.hand.pinch);

      // pinch 엣지 → 클릭/점프 (직후 쿨다운 동안은 무시)
      if(E.pinchSeq > HAND.pinchSeen){
        HAND.pinchSeen = E.pinchSeq;
        var nowMs = Date.now();
        if(nowMs - HAND.lastClickAt < HAND.COOLDOWN){
          /* 방금 조작함 — 손 펴는 도중의 재발화로 보고 무시 */
        } else if(HAND.slider){
          // 슬라이더: 커서 x → 값. 트랙 비율을 그대로 값에 매핑하고 스텝에 맞춘다.
          HAND.lastClickAt = nowMs;
          var sr = HAND.slider.getBoundingClientRect();
          var ratio = (px - sr.left) / (sr.width || 1);
          ratio = Math.max(0, Math.min(1, ratio));
          var mn = parseInt(HAND.slider.min,10), mx = parseInt(HAND.slider.max,10);
          var stp = parseInt(HAND.slider.step,10) || 1;
          var raw = mn + ratio * (mx - mn);
          var val = mn + Math.round((raw - mn) / stp) * stp;
          HAND.slider.value = val;
          HAND.slider.dispatchEvent(new Event('input', { bubbles:true }));
          HAND.slider.dispatchEvent(new Event('change', { bubbles:true }));
        } else {
          HAND.lastClickAt = nowMs;
          if(HAND.target === NAV.back){ if(NAV.back) navGo('back'); }
          else if(HAND.target){        // 다음/기타 CTA
            if(HAND.target === NAV.primary){ if(!NAV.primary.disabled) navGo('next'); }
            else { NAV.bypass = true; HAND.target.click(); NAV.bypass = false; }
          } else {
            // 스냅 대상이 없으면 커서 아래 실제 요소를 누른다(칩/토글 선택용)
            var elu = document.elementFromPoint(px, py);
            if(elu && onboarding.contains(elu)){
              var clickable = elu.closest('button, .chip, .plan, [role="button"], .vfx-row, .bd-demo-sw button');
              if(clickable){ NAV.bypass = true; clickable.click(); NAV.bypass = false; }
            }
          }
        }
      }
    } else if(cur){
      cur.hidden = true; HAND.target = null; HAND.slider = null;
      if(E && E.pinchSeq) HAND.pinchSeen = E.pinchSeq;   // 손이 사라진 동안의 pinch는 무시
    }
    requestAnimationFrame(handCursorLoop);
  }

  function stageCamera(){
    stageEnter(null,1);
    setContent(
      '<div class="breathe-dot"></div>' +
      '<div class="voice-line">지금부터 시선을 스캔하겠습니다.</div>' +
      '<button class="ghost-btn" id="bCam">카메라를 허용합니다</button>' +
      '<div class="cam-err" id="camErr"' + (envNote() ? '' : ' style="display:none;"') + '>' + envNote() + '</div>' +
      '<div class="micro">이 단계는 건너뛸 수 없습니다. 카메라를 허용해야 다음으로 넘어갑니다.<br>' +
      '영상은 기기 밖으로 나가지 않습니다. 눈꺼풀 개폐 값만 계산됩니다.</div>'
    );
    var btn = document.getElementById('bCam');
    var err = document.getElementById('camErr');
    btn.onclick = function(){
      btn.disabled = true; btn.textContent = '눈을 찾는 중…';
      var wait = 0;
      (function go(){
        if(!window.WEAR_startEye){
          if(wait++ > 120){ fail('눈 인식 모듈을 불러오지 못했습니다.'); return; }
          setTimeout(go, 100); return;
        }
        window.WEAR_startEye().then(function(ok){
          if(ok){ navInit(); voiceStart(); stageWear(); }
          else { fail((window.EYE && window.EYE.error) || '카메라를 열 수 없습니다.'); }
        }).catch(function(){ fail('카메라를 열 수 없습니다.'); });
      })();
    };
    function fail(msg){
      btn.disabled = false; btn.textContent = '다시 시도';
      err.style.display = 'block';
      var why = envNote();
      if(!why && (window.EYE && window.EYE.errCode === 'NotAllowedError')){
        why = '브라우저 주소창의 카메라 아이콘에서 이 사이트를 허용으로 바꾼 뒤 다시 시도하세요.';
      }
      err.innerHTML = msg + (why ? '<br>' + why : '') +
        '<br>카메라 없이는 진행할 수 없습니다. 허용한 뒤 다시 시도하세요.<br>' + envDiag();
    }
  }

  function inFrame(){
    try { return window.self !== window.top; } catch(e){ return true; }
  }
  function framePolicyBlocked(){
    if(!inFrame()) return false;
    try{
      if(document.featurePolicy && document.featurePolicy.allowsFeature)
        return !document.featurePolicy.allowsFeature('camera');
    }catch(e){}
    return true; // 프레임 안이면 일단 차단으로 가정
  }
  function insecure(){
    return location.protocol === 'file:' || !window.isSecureContext;
  }
  function frameMsg(){
    return '<b style="color:var(--text); font-weight:400;">미리보기 프레임 안에서는 카메라가 차단됩니다.</b><br>' +
           '이 파일을 내려받아 브라우저 탭에서 직접 열면 동작합니다.';
  }
  function insecureMsg(){
    return '파일을 직접 연 상태라 카메라가 막힐 수 있습니다. 폴더에서 ' +
           '<code style="font-family:var(--mono)">python3 -m http.server</code> 를 실행하고 ' +
           'localhost 로 여세요.';
  }
  function envNote(){
    if(framePolicyBlocked()) return frameMsg();
    if(insecure()) return insecureMsg();
    return '';
  }
  function envDiag(){
    return '<span style="color:var(--faint); font-family:var(--mono); font-size:10px;">' +
      location.protocol + ' · ' + (inFrame() ? 'iframe' : 'top') +
      ' · secure ' + (window.isSecureContext ? 'y' : 'n') + '</span>';
  }

  function showChip(){
    var chip = document.getElementById('camChip');

  /* ---------- 시선 캘리브레이션 ----------
     감음 3초 → 뜸 3초 → 정보 수집 → 확인 */

  function calibPhase(instr, wantClosed, next){
    var tk = OB_TOKEN;
    setContent(
      '<div class="calib-instr">' + instr + '</div>' +
      '<div class="calib-num" id="calibNum"></div>' +
      '<div class="calib-hint" id="calibHint"></div>' +
      '<div class="calib-track"><i id="calibBar"></i></div>'
    );

    var num = document.getElementById('calibNum');
    var hintEl = document.getElementById('calibHint');
    var bar = document.getElementById('calibBar');
    var held = 0, prev = 0, shown = 0, spoken = 0, started = false;
    // '눈을 감아주세요'는 3,2,1 (3초). '눈을 떠주세요'는 2,1 (2초)만 센다.
    var COUNT = wantClosed ? 3 : 2;
    var DUR = COUNT * 1000;
    var EN = ['','One','Two','Three'];

    // 안내 뒤 카운트를 또렷하게 센다.
    var spoke = say(instr, { interrupt:true, onEnd:begin, rate:0.95, keep:true });
    var guard = setTimeout(begin, spoke ? 1700 : 500);

    function begin(){
      if(started || tk !== OB_TOKEN) return;
      started = true;
      clearTimeout(guard);
      prev = performance.now();
      obEyeRaf = requestAnimationFrame(tick);
    }

    function tick(now){
      if(tk !== OB_TOKEN) return;
      var dt = now - prev; prev = now;
      var E = eye();
      var ok = E.face && (wantClosed ? E.closed : !E.closed);

      if(ok){
        held += dt;
        hintEl.textContent = '';
      } else {
        held = 0; spoken = 0;
        hintEl.textContent = !E.face
          ? '얼굴이 보이지 않습니다'
          : (wantClosed ? '아직 눈을 떠주세요' : '눈을 떠주세요');
      }

      var t = Math.min(1, held/DUR);
      bar.style.width = (t*100).toFixed(1) + '%';

      var n = Math.max(1, COUNT - Math.floor(held/1000));
      if(n !== shown){ shown = n; num.innerHTML = '<span>' + n + '</span>'; }
      if(ok && n !== spoken){ spoken = n; say(EN[n], {interrupt:true, rate:1.0, lang:'en', blip:false, keep:true}); }

      if(t >= 1){ next(); return; }
      obEyeRaf = requestAnimationFrame(tick);
    }
  }

  /* 글자를 무작위로 굴리다 왼쪽부터 자리를 잡는 디코딩 연출 */
  function scrambleTo(el, word, delay, dur){
    if(!el) return;
    var POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    var t0 = null;
    function frame(now){
      if(!el.isConnected) return;
      if(t0 === null) t0 = now;
      var t = Math.min(1, (now - t0) / dur);
      var settled = Math.floor(Math.pow(t, .78) * word.length + 0.0001);
      var out = '';
      for(var i=0;i<word.length;i++){
        out += (i < settled) ? word.charAt(i) : POOL.charAt(Math.floor(Math.random()*POOL.length));
      }
      el.textContent = out;
      if(t < 1) requestAnimationFrame(frame);
      else el.textContent = word;
    }
    setTimeout(function(){ if(el.isConnected) requestAnimationFrame(frame); }, delay);
  }

  /* ---------- 결정도 구간 ---------- */
  var DEC_BANDS = [
    { lo:0.00, hi:0.30, name:'소실',
      desc:'얼굴이 기억되지 않습니다. 재회, 계약, 추천이 성립하지 않습니다.' },
    { lo:0.30, hi:0.55, name:'유동',
      desc:'다르게 보일 여지가 큽니다. 대신 어떤 인상도 쌓이지 않습니다.' },
    { lo:0.55, hi:0.78, name:'정착',
      desc:'대체로 같은 사람으로 보입니다. 변동의 폭이 좁아지고 있습니다.' },
    { lo:0.78, hi:1.00, name:'고착',
      desc:'남이 본 형태가 당신보다 앞섭니다. 되돌리려면 재조정 비용이 듭니다.' }
  ];
  var SCANNED_DEC = 0.71;

  function bandOf(v){
    for(var i=0;i<DEC_BANDS.length;i++){
      if(v < DEC_BANDS[i].hi || i === DEC_BANDS.length-1) return DEC_BANDS[i];
    }
    return DEC_BANDS[0];
  }

  var DEC_CODE = { '소실':'VANISHED', '유동':'FLUID', '정착':'SETTLED', '고착':'FIXED' };

  // 반원 게이지 대신 0.00–1.00 계측 레일. 구간 폭이 곧 실제 범위 폭이다.
  function decRailHtml(v){
    var segs = DEC_BANDS.map(function(b, i){
      var on = bandOf(v) === b;
      var left = (b.lo * 100), w = ((b.hi - b.lo) * 100);
      return '<div class="dcx-seg' + (on ? ' on' : '') + '" data-i="' + i + '" tabindex="0" ' +
             'style="left:calc(' + left + '% + ' + (i ? 1 : 0) + 'px); ' +
             'width:calc(' + w + '% - ' + (i && i < DEC_BANDS.length-1 ? 2 : 1) + 'px);">' +
               '<u>' + DEC_CODE[b.name] + '</u><b>' + b.name + '</b>' +
             '</div>';
    }).join('');
    return '<div class="dcx">' +
      '<div class="vfx-head">' +
        '<span class="vfx-kicker">DECIDEDNESS</span>' +
        '<span class="vfx-rule"></span>' +
        '<span class="vfx-kicker">SCAN · 06M</span>' +
      '</div>' +
      '<div class="dcx-big">' +
        '<div class="dcx-val" id="dcxVal">0.00</div>' +
        '<div class="dcx-band"><em>BAND</em><span id="dcxBand">' + bandOf(v).name + '</span></div>' +
      '</div>' +
      '<div class="dcx-rail" id="dcxRail">' + segs +
        '<div class="dcx-mark" id="dcxMark" style="left:0%;">' +
          '<b id="dcxMarkVal">0.00</b><i></i><u>YOU</u></div>' +
      '</div>' +
      '<div class="dcx-scale">' +
        '<span style="left:0%">0.00</span><span style="left:30%">0.30</span>' +
        '<span style="left:55%">0.55</span><span style="left:78%">0.78</span>' +
        '<span style="left:100%">1.00</span>' +
      '</div>' +
    '</div>';
  }

  // 레전드는 필터 화면과 같은 문법으로 쌓는다
  function buildDecLegend(host, v){
    var active = bandOf(v);
    DEC_BANDS.forEach(function(b, i){
      var on = (b === active);
      var row = vfxRow({
        i: i + 1, name: b.name, code: DEC_CODE[b.name], desc: b.desc,
        figure: b.lo.toFixed(2) + '–' + b.hi.toFixed(2), unit: '',
        pt: on ? '현재 구간' : '', on: on, cut: false
      });
      row.classList.add('dec-row');
      row.removeAttribute('role');
      row.removeAttribute('aria-checked');
      row.setAttribute('data-i', i);
      host.appendChild(row);
    });
  }

  // 현재 구간은 늘 켜져 있고, 나머지는 손을 얹은 동안만 두 번째 색으로 밝아진다
  function wireDecLegend(v){
    var rows = document.querySelectorAll('#decLegend .vfx-row');
    var segs = document.querySelectorAll('.dcx-seg');
    var activeIdx = DEC_BANDS.indexOf(bandOf(v));

    function hoverBand(i){
      Array.prototype.forEach.call(rows, function(r, j){
        r.classList.toggle('on', j === activeIdx);
        r.classList.toggle('hov', i !== null && j === i && j !== activeIdx);
        var tag = r.querySelector('.vfx-pt');
        if(tag) tag.textContent = (j === activeIdx) ? '현재 구간' : '';
      });
      Array.prototype.forEach.call(segs, function(sg, j){
        sg.classList.toggle('on', j === activeIdx);
        sg.classList.toggle('hov', i !== null && j === i && j !== activeIdx);
      });
    }

    // 화면이 뜬 순간 커서가 우연히 구간 위에 있어도 현재 구간이 유지되도록,
    // 실제 움직임(mousemove)이 있어야 호버로 인정한다
    var armed = false;
    function bind(el, i){
      el.addEventListener('mousemove', function(){ armed = true; hoverBand(i); });
      el.addEventListener('mouseenter', function(){ if(armed) hoverBand(i); });
      el.addEventListener('mouseleave', function(){ hoverBand(null); });
      el.addEventListener('focus', function(){ hoverBand(i); });
      el.addEventListener('blur', function(){ hoverBand(null); });
    }
    Array.prototype.forEach.call(rows, bind);
    Array.prototype.forEach.call(segs, bind);
    var legend = document.getElementById('decLegend');
    legend.addEventListener('mouseleave', function(){ hoverBand(null); });
    var rail = document.getElementById('dcxRail');
    if(rail) rail.addEventListener('mouseleave', function(){ hoverBand(null); });
    hoverBand(null);
  }

  // 0.00 에서 실제 값까지 굴러 올라간다
  function countUpDec(els, target, dur){
    els = els.filter(Boolean);
    if(!els.length) return;
    var t0 = null;
    function step(now){
      if(!els[0].isConnected) return;
      if(t0 === null) t0 = now;
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      var txt = (t < 1 ? target * e : target).toFixed(2);
      els.forEach(function(el){ el.textContent = txt; });
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

    );

    wireDecLegend(v);

    // 마커가 0에서 제자리로 걸어가고, 숫자가 그 속도로 따라 오른다
    setTimeout(function(){
      var mark = document.getElementById('dcxMark');
      if(mark) mark.style.left = (v * 100) + '%';

  /* =========================================================
     이미지 스캔 — 두상 스캔 데이터
     ========================================================= */

  // 제어점을 지나는 부드러운 곡선. 두상의 세로 프로파일을 만든다.
  function crSpline(cps){
    var us = [], vs = [];
    cps.forEach(function(c){ us.push(c[0]); vs.push(c[1]); });
    return function(u){
      if(u <= us[0]) return vs[0];
      if(u >= us[us.length-1]) return vs[vs.length-1];
      var i = 0; while(i < us.length-2 && u > us[i+1]) i++;
      var t = (u - us[i]) / (us[i+1] - us[i]);
      var p0 = vs[Math.max(0,i-1)], p1 = vs[i], p2 = vs[i+1], p3 = vs[Math.min(vs.length-1,i+2)];
      var t2 = t*t, t3 = t2*t;
      return 0.5*((2*p1) + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t2 + (-p0+3*p1-3*p2+p3)*t3);
    };
  }
  // u=0 턱끝 → u=1 정수리
  var HD_W = crSpline([[0,0.03],[0.05,0.24],[0.13,0.40],[0.24,0.53],[0.36,0.62],
                       [0.48,0.69],[0.60,0.72],[0.72,0.72],[0.84,0.665],[0.93,0.50],[1,0.06]]);
  var HD_D = crSpline([[0,0.24],[0.08,0.42],[0.20,0.56],[0.34,0.70],[0.50,0.80],
                       [0.66,0.86],[0.78,0.845],[0.88,0.74],[0.95,0.52],[1,0.08]]);
  function gz(v, mu, sg){ var d = (v-mu)/sg; return Math.exp(-d*d); }

  function headPt(th, u, M){
    var W = HD_W(u), D = HD_D(u);
    W *= 1 + (M.jaw-1)   * gz(u, 0.30, 0.16);
    W *= 1 + (M.skull-1) * gz(u, 0.78, 0.20);
    D *= 1 + (M.skull-1) * 0.8 * gz(u, 0.74, 0.22);
    W *= 1 + (M.cheek-1) * 0.16 * gz(u, 0.40, 0.14);

    var ct = Math.cos(th), st = Math.sin(th);
    var f = ct > 0 ? ct : 0, b = ct < 0 ? -ct : 0, l = Math.abs(st);
    var f2 = f*f, f3 = f2*f, f4 = f2*f2;

    var X = W*st, Z = D*ct;
    Z *= 1 - 0.13*f*l*l;                              // 얼굴 앞면은 평평하다
    Z += 0.07*f*gz(u, 0.05, 0.09);                    // 턱끝
    Z += 0.045*M.brow*f2*gz(u, 0.665, 0.05);          // 눈썹뼈
    Z -= 0.055*f*Math.sqrt(f)*gz(u, 0.60, 0.045);     // 눈두덩
    Z += 0.20*M.nose*f4*gz(u, 0.50, 0.10);            // 콧대
    Z += 0.085*f4*f4*gz(u, 0.425, 0.035);             // 코끝
    Z -= 0.035*f3*gz(u, 0.385, 0.028);                // 인중
    Z += 0.05*f4*gz(u, 0.302, 0.035);                 // 입술
    Z -= 0.03*f3*gz(u, 0.235, 0.03);                  // 아랫입술 아래

            if(!open){ ctx.moveTo(qx, qy); open = true; } else ctx.lineTo(qx, qy);
          } else open = false;
        }
        ctx.globalAlpha = 0.75*ge;
        ctx.stroke();
      }

      // 지시선 — 앞을 보고 있으면 판독값, 등을 보이면 남은 인상
      var era = IMG_ERAS[cur];
      var frontAmt = cyw*cpt;                       // +면 앞면, -면 뒷면
      var showBack = frontAmt < 0;
      var sideNow = showBack ? 'back' : 'front';
      if(sideNow !== lastSide){
        lastSide = sideNow;
        if(opts.onSide) opts.onSide(sideNow);
      }
      var annos = showBack ? IMG_BACK_ANNO : IMG_ANNO;
      var turn = Math.min(1, Math.abs(frontAmt)/0.30);   // 옆모습에서는 지시선을 숨긴다

      ctx.font = '600 ' + (9.5*dpr).toFixed(0) + 'px "JetBrains Mono", Pretendard, monospace';
      ctx.textBaseline = 'middle';
      annos.forEach(function(an){
        var p = headPt(an.th, an.u, IMG_ERAS[cur].M);
        var nl = Math.sqrt(p[0]*p[0] + p[1]*p[1] + p[2]*p[2]) || 1;
        var ax = p[0]*ge, ay2 = p[1]*ge, az = p[2]*ge;
        var rx = ax*cyw + az*syw, rz = -ax*syw + az*cyw;
        var ry = ay2*cpt - rz*spt, rz2 = ay2*spt + rz*cpt;
        var facing = (p[1]/nl)*spt + ((-p[0]/nl)*syw + (p[2]/nl)*cyw)*cpt;
        if(facing < 0.12) return;
        var al = Math.min(1, (facing - 0.12)*3.4)*ge*turn;
        if(al <= 0.02) return;
        var kk = dd/(dd - rz2);
        var qx = cx + rx*sc*kk, qy = cy - ry*sc*kk;
        var tx = an.side < 0 ? 14*dpr : cv.width - 14*dpr;
        var ty = cv.height*an.slot;
        var accent = showBack ? '#8C8F89' : '#CD432C';
        ctx.globalAlpha = al*0.55;
        ctx.strokeStyle = accent;
        ctx.lineWidth = Math.max(1, dpr);
        if(showBack){ ctx.setLineDash([3*dpr, 3*dpr]); }
        ctx.beginPath();
        ctx.moveTo(qx, qy);
        ctx.lineTo(tx + (an.side < 0 ? 30*dpr : -30*dpr), ty);
        ctx.lineTo(tx, ty);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = al;
        ctx.fillStyle = accent;
        ctx.fillRect(qx - 1.5*dpr, qy - 1.5*dpr, 3*dpr, 3*dpr);
        ctx.textAlign = an.side < 0 ? 'left' : 'right';
        ctx.fillStyle = '#5A5D57';
        ctx.fillText(an.part, tx, ty - 8*dpr);
        ctx.fillStyle = '#E8E8E2';
        ctx.fillText(showBack
          ? era.back[an.bi]
          : READ_KEYS[an.ri].k + ' ' + era.read[an.ri], tx, ty + 6*dpr);
      });
      ctx.globalAlpha = 1;
    }
    raf = requestAnimationFrame(frame);

    return {
      setEra: setEra,
      spinTo: function(target){    // 0 = 정면, 1 = 뒷면
        var TAU = Math.PI*2;
        var want = target ? Math.PI : 0;
        var d = want - (((yaw % TAU) + TAU) % TAU);
        if(d > Math.PI) d -= TAU;
        if(d <= -Math.PI) d += TAU;
        spinA = yaw; spinB = yaw + d;
        spinT0 = performance.now(); spinning = true; vy = 0;
      },
      dispose: function(){
        dead = true;
        if(raf) cancelAnimationFrame(raf);
        window.removeEventListener('resize', onResize);
      }
    };
  }

  /* ---------- 스테이지 ---------- */

  // 라이프 타임라인 좌표 — 나이 0~40을 가로축으로 편다
  var LG_W = 760, LG_H = 158, LG_AXIS = 76, LG_L = 22, LG_R = 12, LG_MAXAGE = 40;
  function lgX(age){ return LG_L + (age/LG_MAXAGE)*(LG_W - LG_L - LG_R); }
  function lgPct(age){ return (lgX(age)/LG_W*100).toFixed(3) + '%'; }
  function lifeScore(e){ return e.pv - e.nv; }
  function lifeY(score){ return LG_AXIS - (score * 0.72); }
  function denseLifePoints(){
    var out=[];
    for(var age=4; age<=39; age++){
      var left=IMG_ERAS[0], right=IMG_ERAS[IMG_ERAS.length-1];
      for(var i=0;i<IMG_ERAS.length-1;i++){
        if(age>=IMG_ERAS[i].age && age<=IMG_ERAS[i+1].age){ left=IMG_ERAS[i]; right=IMG_ERAS[i+1]; break; }
      }
      var span = Math.max(1, right.age-left.age);
      var t = Math.max(0, Math.min(1,(age-left.age)/span));
      var score = lifeScore(left) + (lifeScore(right)-lifeScore(left))*t;
      out.push([lgX(age), lifeY(score)]);
    }
    return out;
  }
  function smoothPath(pts){
    if(!pts.length) return '';
    var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
    for(var i=0;i<pts.length-1;i++){
      var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
      var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+='C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
    }
    return d;
  }
  function lifeGraphSvg(){
    var dense=denseLifePoints(), line=smoothPath(dense);
    var dots=IMG_ERAS.map(function(e,i){
      var score=lifeScore(e);
      return '<circle class="lg-composite-dot" data-d="'+i+'" cx="'+lgX(e.age).toFixed(1)+'" cy="'+lifeY(score).toFixed(1)+'" r="3.2"/>';
    }).join('');
    var denseDots=denseLifePoints().map(function(pt){
      return '<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="1.25" fill="#8C8F89" opacity=".34"/>';
    }).join('');
    var grid='', xlabels='';
    for(var age=0; age<=40; age++){
      var major = age%5===0;
      var medium = age%1===0;
      grid+='<line class="lg-grid '+(major?'major':'')+'" x1="'+lgX(age).toFixed(1)+'" y1="8" x2="'+lgX(age).toFixed(1)+'" y2="'+(LG_H-34)+'"/>';
      if(major || age % 5 === 0){
        xlabels+='<text x="'+lgX(age).toFixed(1)+'" y="'+(LG_H-20)+'" text-anchor="middle" fill="#6D706B" font-size="'+(major?'8':'6.5')+'" font-family="var(--eng)" font-weight="'+(major?'700':'500')+'">'+age+'Y</text>';
      }
    }
    for(var score=-80; score<=80; score+=20){
      grid+='<line class="lg-grid '+(score===0?'major':'')+'" x1="'+LG_L+'" y1="'+lifeY(score).toFixed(1)+'" x2="'+(LG_W-LG_R)+'" y2="'+lifeY(score).toFixed(1)+'"/>';
    }
    var stems=IMG_ERAS.map(function(e){
      return '<line class="lg-stem" data-stem="'+e.age+'" x1="'+lgX(e.age).toFixed(1)+'" y1="'+lifeY(lifeScore(e))+'" x2="'+lgX(e.age).toFixed(1)+'" y2="'+(LG_H-34)+'"/>';
    }).join('');
    var x0=LG_L, xN=LG_W-LG_R;
    var predEra = IMG_ERAS.filter(function(e){ return e.pred; })[0] || IMG_ERAS[IMG_ERAS.length-1];
    var predX=lgX(predEra.age);
    var area=line+'L'+xN+','+LG_AXIS+'L'+x0+','+LG_AXIS+'Z';
    return '<svg class="lg-svg" viewBox="0 0 '+LG_W+' '+LG_H+'" role="img" aria-label="나이에 따른 종합 인상 추이">'+
      '<defs><linearGradient id="lgMix" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8E8E2" stop-opacity=".22"/><stop offset="100%" stop-color="#E8E8E2" stop-opacity="0"/></linearGradient>'+
      '<pattern id="lgPred" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2A2C29" stroke-width="1"/></pattern></defs>'+
      grid+'<rect x="'+predX.toFixed(1)+'" y="0" width="'+(LG_W-predX).toFixed(1)+'" height="'+LG_H+'" fill="url(#lgPred)" opacity=".5"/>'+
      '<line class="lg-pred" x1="'+predX.toFixed(1)+'" y1="0" x2="'+predX.toFixed(1)+'" y2="'+LG_H+'"/>'+
      '<line class="lg-zero" x1="'+LG_L+'" y1="'+LG_AXIS+'" x2="'+(LG_W-LG_R)+'" y2="'+LG_AXIS+'"/>'+
      stems+denseDots+'<path class="lg-composite" d="'+line+'"/>'+dots+
      '</svg>';
  }

  function stageImageScan(){
    var tk = stageEnter(stageDecidedness,5);
    var sel = 0;
    for(var si=0; si<IMG_ERAS.length; si++){ if(IMG_ERAS[si].age === 29){ sel = si; break; } }

    var readHtml = READ_KEYS.map(function(r, i){
      return '<div class="rdr">' +
        '<div class="rdr-k"><b>' + r.k + '</b><em>' + r.e + '</em></div>' +
        '<div class="rdr-mid"><div class="rdr-d">' + r.d + '</div>' +
          '<div class="rdr-b"><i data-r="' + i + '" style="width:0%"></i></div></div>' +
        '<div class="rdr-v" data-rv="' + i + '">0</div>' +
      '</div>';
    }).join('');

    var nodesHtml = IMG_ERAS.map(function(e, i){
      return '<button class="lg-node' + (i === sel ? ' on' : '') + (e.pred ? ' pred' : '') +
        '" data-e="' + i + '" style="left:' + lgPct(e.age) + ';" ' +

        '<div class="imx-sticky">' +
          '<div class="imx-focus">' +
            '<div class="imx-main">' +
              '<div class="imx-stage" id="imxStage">' +
                '<img class="imx-face" id="imxFace" alt="" draggable="false" />' +

                  'camera-controls disable-zoom disable-pan interaction-prompt="none" ' +
                  'min-camera-orbit="auto 90deg auto" max-camera-orbit="auto 90deg auto" ' +
                  'camera-orbit="0deg 90deg auto" shadow-intensity="0.7" exposure="1.05" ' +
                  'environment-image="neutral" alt="8세 3D 얼굴 · 끌어서 돌려보기"></model-viewer>' +
                '<i class="imx-c tl"></i><i class="imx-c tr"></i><i class="imx-c bl"></i><i class="imx-c br"></i>' +
                '<div class="imx-badge eng" id="imxBadge"></div>' +
              '</div>' +
              '<div class="imx-hint eng">DRAG ↔ SPIN · 좌우로 끌면 360° 돌아갑니다 · 나이대는 아래에서 선택</div>' +
            '</div>' +
            '<div class="imx-detail">' +
              '<div class="imx-era">' +
                '<div class="imx-era-top"><div class="imx-era-name" id="imxName"></div>' +
                '<div class="imx-era-dec"><em>DEC</em><span id="imxDec"></span></div></div>' +
                '<div class="imx-era-line" id="imxLine"></div>' +
              '</div>' +
              '<div class="imx-side"><span class="sd-t" id="imxSide"></span>' +
                '<button class="imx-flip" id="imxFlip" type="button">뒤에서 보기</button></div>' +
              '<div class="imx-foot" id="imxFoot"></div>' +
              '<div class="imx-tr-label" style="margin-top:16px;">TRAITS · 종합</div>' +
              '<div class="trait-summary" id="imxTraits"></div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="imx-timeline">' +
          '<div class="imx-tr-label" style="margin:0 0 5px;">LIFE TIMELINE · 종합 인상 · 년월 · 나이</div>' +
          '<div class="lifegraph" id="lifeGraph">' +
            '<span class="lg-predlab">종합 인상 = 긍정 − 부정</span>' +
            lifeGraphSvg() +
            nodesHtml +
          '</div>' +
        '</div>' +


      '</div>' +
      '<button class="ghost-btn" id="bImg" style="margin-bottom:20px;">계속</button>'
    );

    var badge  = document.getElementById('imxBadge');
    var sideEl = document.getElementById('imxSide');
    var footEl = document.getElementById('imxFoot');
    var flipEl = document.getElementById('imxFlip');
    var nameEl = document.getElementById('imxName');
    var decEl  = document.getElementById('imxDec');
    var lineEl = document.getElementById('imxLine');
    var traitsEl = document.getElementById('imxTraits');

    // 턴어라운드: 나이별 24프레임(0~345°, 15° 간격). 좌우 드래그로 360° 회전.
    var ANGLES = 24, STEP_DEG = 360 / ANGLES;
    var faceImg = document.getElementById('imxFace');
    var modelEl = document.getElementById('imxModel');
    var stageEl = document.getElementById('imxStage');
    var MODEL_AGE = 8;              // 이 나이대만 사진 대신 3D 모델을 보여준다
    var usingModel = false;         // 지금 화면이 3D 모델을 쓰는 중인지
    var curAge = null, angleIdx = 0, spinTimer = null;
    var frameCache = {};

    function pad2(n){ return String(n).padStart(2, '0'); }
    function pad3(n){ n = ((n % 360) + 360) % 360; return String(n).padStart(3, '0'); }
    function framePath(age, deg){ var a = pad2(age); return 'assets/turnaround/' + a + '/' + a + '_' + pad3(deg) + '.png'; }
    function preloadAge(age){
      if(frameCache[age]) return;
      var arr = [];
      for(var k = 0; k < ANGLES; k++){ var im = new Image(); im.src = framePath(age, k * STEP_DEG); arr.push(im); }
      frameCache[age] = arr;
    }
    function showFrame(){ if(curAge != null) faceImg.src = framePath(curAge, angleIdx * STEP_DEG); }
    function setFace(e){
      curAge = e.age;
      usingModel = (modelEl && e.age === MODEL_AGE);
      if(usingModel){
        if(!modelEl.getAttribute('src')){ modelEl.setAttribute('src', 'assets/models/age08.glb'); }  // 처음 열 때만 71MB 로드
        faceImg.style.display = 'none';
        modelEl.style.display = 'block';
        try{ modelEl.cameraOrbit = '0deg 90deg auto'; }catch(_){}   // 정면부터 시작
        facing = 'front';
      } else {
        if(modelEl) modelEl.style.display = 'none';
        faceImg.style.display = '';
        preloadAge(curAge);
        showFrame();
      }
    }
    function facingFromAngle(){
      var deg = ((angleIdx * STEP_DEG) % 360 + 360) % 360;
      return (deg > 90 && deg < 270) ? 'back' : 'front';
    }

    // 앞/뒤 판독 텍스트 — 회전 각도(정면 0° · 뒤통수 180°)에 연동된다.
    var facing = 'front';
    function paintSide(){
      var e = IMG_ERAS[sel];
      var wrap = sideEl.parentNode;
      if(facing === 'back'){
        sideEl.innerHTML = '<b>뒷모습</b> 타인에게 남은 인상<span>' + e.back.join(' · ') + '</span>';
        wrap.classList.add('back');
        flipEl.textContent = '정면으로';
      } else {
        sideEl.innerHTML = '<b>정면</b> 타인이 읽는 판독값<span>' +
          READ_KEYS.map(function(r, i){ return r.k + ' ' + e.read[i]; }).join(' · ') + '</span>';
        wrap.classList.remove('back');
        flipEl.textContent = '뒤에서 보기';
      }
    }

    // 드래그 스핀
    var dragging = false, lastX = 0, acc = 0, PX_PER_STEP = 14;
    function xOf(ev){ return ev.touches ? ev.touches[0].clientX : ev.clientX; }
    function onDown(ev){ if(usingModel) return; dragging = true; acc = 0; lastX = xOf(ev); stageEl.classList.add('spinning'); if(spinTimer){ clearInterval(spinTimer); spinTimer = null; } ev.preventDefault(); }
    function onMove(ev){
      if(usingModel) return;
      if(!dragging) return;
      var x = xOf(ev); acc += (x - lastX); lastX = x;
      var moved = false;
      while(acc <= -PX_PER_STEP){ angleIdx = (angleIdx + 1) % ANGLES; acc += PX_PER_STEP; moved = true; }
      while(acc >=  PX_PER_STEP){ angleIdx = (angleIdx - 1 + ANGLES) % ANGLES; acc -= PX_PER_STEP; moved = true; }
      if(moved){ showFrame(); facing = facingFromAngle(); paintSide(); }
      ev.preventDefault();
    }
    function onUp(){ if(!dragging) return; dragging = false; stageEl.classList.remove('spinning'); }
    stageEl.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);

    // 3D 모델(8세)이 켜져 있으면 카메라를 앞/뒤로 돌린다 — 사진 프레임 회전과 별개
    function modelFacing(){
      try{
        var th = modelEl.getCameraOrbit().theta * 180 / Math.PI;   // 라디안 → 도
        th = ((th % 360) + 360) % 360;
        return (th > 90 && th < 270) ? 'back' : 'front';
      }catch(_){ return facing; }
    }
    if(modelEl){
      modelEl.addEventListener('camera-change', function(){
        if(!usingModel) return;
        var f = modelFacing();
        if(f !== facing){ facing = f; paintSide(); }
      });
    }

    // 앞↔뒤 반바퀴 애니메이션 (최단 방향)
    flipEl.onclick = function(){
      if(usingModel){
        var toBack = (modelFacing() === 'front');
        try{ modelEl.cameraOrbit = (toBack ? '180deg' : '0deg') + ' 90deg auto'; }catch(_){}
        return;
      }
      var target = (facingFromAngle() === 'front') ? 12 : 0;   // 12 * 15° = 180°
      if(spinTimer) clearInterval(spinTimer);
      spinTimer = setInterval(function(){
        if(angleIdx === target){ clearInterval(spinTimer); spinTimer = null; facing = facingFromAngle(); paintSide(); return; }
        var cw = (target - angleIdx + ANGLES) % ANGLES, ccw = (angleIdx - target + ANGLES) % ANGLES;
        angleIdx = (cw <= ccw) ? (angleIdx + 1) % ANGLES : (angleIdx - 1 + ANGLES) % ANGLES;
        showFrame(); facing = facingFromAngle(); paintSide();
      }, 28);
    };

    OB_DISPOSE.push(function(){
      if(spinTimer){ clearInterval(spinTimer); spinTimer = null; }
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    });

    var TRAIT_DEFS = [
      {code:'WARMTH', label:'온기', left:'따뜻한', right:'차가운'},
      {code:'TRUST', label:'신뢰감', left:'믿음직한', right:'수상한'},
      {code:'APPROACH', label:'친근감', left:'다가가기 쉬운', right:'다가가기 어려운'},
      {code:'STRENGTH', label:'강인함', left:'단단한', right:'여린'},
      {code:'VITALITY', label:'활력', left:'밝은', right:'어두운'},
      {code:'DELICACY', label:'섬세함', left:'부드러운', right:'거친'}
    ];
    function renderTraits(e){
      return TRAIT_DEFS.map(function(t, i){
        var v = Math.max(0, Math.min(100, Number(e.traits[i] || 50)));
        var mag = Math.round(Math.abs(v - 50) * 2);  // 중앙에서 벗어난 정도 0~100
        var leansLeft = v < 50, leansRight = v > 50, neutral = mag === 0;
        // 왼쪽 극(따뜻한·믿음직한…)이 + 방향, 오른쪽 극이 − 방향이다.
        var leanTxt = neutral ? '0%' : (leansLeft ? '+' : '−') + mag + '%';
        return '<div class="trait-read">' +
          '<div class="trait-read-head">' +
            '<b>' + t.label + '</b><em>' + t.code + '</em>' +
            '<span class="lean' + (neutral ? ' mid' : '') + '">' + leanTxt + '</span>' +
          '</div>' +
          '<div class="trait-meter"><i class="mid"></i>' +
            '<i class="pin' + (neutral ? ' neutral' : '') + '" style="left:' + v + '%;"></i></div>' +
          '<div class="trait-poles">' +
            '<span>' + t.left + '</span>' +
            '<span>' + t.right + '</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function paint(i){
      var e = IMG_ERAS[i];
      badge.innerHTML = e.code + ' · <b>' + e.name + '</b>' + (e.pred ? ' · 예측' : '');
      footEl.innerHTML = '<span class="ft-ym">' + e.ym + '</span>' +
        '<span class="ft-age">' + e.age + '세</span>' +
        '<span class="ft-nm">' + e.name + (e.pred ? ' · 예측' : '') + '</span>' +
        '<span class="ft-dec"><em>DEC</em>' + e.dec.toFixed(2) + '</span>';
      nameEl.textContent = e.name;
      decEl.textContent = e.dec.toFixed(2);
      lineEl.textContent = e.line;
      traitsEl.innerHTML = renderTraits(e);
      e.read.forEach(function(v, ri){
        var bar = document.querySelector('.rdr-b i[data-r="' + ri + '"]');
        if(bar) bar.style.width = v + '%';
        var num = document.querySelector('.rdr-v[data-rv="' + ri + '"]');
        if(num) num.textContent = v;
      });
      Array.prototype.forEach.call(document.querySelectorAll('.lg-node'), function(n, j){
        n.classList.toggle('on', j === i);

  function cohortNumbers(p){
    var meta = JOB_META[p.job] || JOB_META.other;
    var ageMul  = { '20':1.12, '30':1.05, '40':0.98, '50':0.90 }[p.age];
    var annual  = 216 * meta.mul * ageMul;
    var saved   = annual * meta.save;
    return { annual:annual, saved:saved, fee:saved*0.10, rate:Math.round(meta.save*100) };
  }
  function cohortLabel(p){
    var meta = JOB_META[p.job] || JOB_META.other;
    var age = { '20':'20대', '30':'30대', '40':'40대', '50':'50대 이상' }[p.age];
    var sex = { f:'여성', m:'남성', n:'' }[p.sex];
    return age + ' ' + (sex ? sex + ' ' : '') + meta.label;
  }

  ];

  /* =========================================================
     GAZER — 공개 관측망 중계 설정

     실제로 지금 켜져 있는 공개 카메라를 이 안으로 끌어온다.
     1) https://www.its.go.kr/opendata 에서 무료 인증키를 받아 GAZER_KEY 에 넣는다.
        (cctvType=1 = 실시간 HLS. 4 는 없는 값이라 항상 0건이 온다. 아래 bbox 는 서울 전역이다.)
     2) 키 없이 쓰려면 GAZER_FEEDS 에 .m3u8 주소를 직접 적어 둔다.
        전시장에서는 이 방식이 가장 안전하다 — API 가 죽어도 화면이 산다.
     3) 둘 다 막히면 화면은 조용히 NO FEED 상태로 떨어진다. 거짓 영상은 띄우지 않는다.
     ========================================================= */
  var GAZER_KEY = '';
  var GAZER_BBOX = { minX:126.80, maxX:127.18, minY:37.44, maxY:37.66 };
  var GAZER_FEEDS = [
    // { name:'예: 세종대로 사거리', url:'https://.../playlist.m3u8', x:126.977, y:37.570 }
  ];
  var GZ = { list:[], idx:0, hls:null, live:false, tries:0, t0:0, why:'', status:0, diag:null };

  function loadHls(){
    if(window.Hls) return Promise.resolve(window.Hls);
    if(loadHls._p) return loadHls._p;
    loadHls._p = new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
      s.onload = function(){ window.Hls ? res(window.Hls) : rej(new Error('hls.js')); };
      s.onerror = function(){ rej(new Error('hls.js 를 불러오지 못했습니다')); };
      document.head.appendChild(s);
    });
    return loadHls._p;
  }

  // 순서가 매번 같으면 늘 같은 화면만 본다
  function gazerShuffle(a){
    for(var i = a.length-1; i > 0; i--){
      var k = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[k]; a[k] = t;
    }
    return a;
  }

  // 1순위: 같은 주소의 /api/cctv (Vercel 에 올렸을 때. 키가 서버에만 있어 노출되지 않는다)
  // 2순위: GAZER_KEY 로 직접 호출 (로컬 테스트용. 브라우저가 막을 수 있다)
  // 3순위: GAZER_FEEDS 에 적어 둔 주소
  // https 페이지에서 http 스트림은 브라우저가 막는다
  function gazerHttps(u){ return String(u || '').replace(/^http:\/\//i, 'https://'); }
  function gazerStreamUrl(u){ return '/api/hls?url=' + encodeURIComponent(String(u || '')); }

  function gazerFetchList(){
    GZ.why = '';
    return fetch('/api/cctv').then(function(r){
      GZ.status = r.status;
      return r.json().catch(function(){ throw new Error('/api/cctv 가 JSON 을 돌려주지 않았습니다 (HTTP ' + r.status + '). 함수가 배포되지 않았거나 실행 중 죽었습니다.'); });
    }).then(function(j){
      GZ.diag = j.diag || null;
      if(j.error) throw new Error(j.error);
      if(!j.list || !j.list.length) throw new Error('목록이 비어 있습니다.');
      return gazerShuffle(j.list.slice()).concat(GAZER_FEEDS);
    }).catch(function(err){
      GZ.why = (err && err.message) || String(err);
      return GAZER_FEEDS.length ? gazerDirect() : Promise.reject(err);       // API가 실패할 때만 직접 호출을 시도한다
    });
  }

  function gazerDirect(){
    if(!GAZER_KEY) return Promise.resolve(GAZER_FEEDS.slice());
    function one(type){
      var u = 'https://openapi.its.go.kr:9443/cctvInfo?apiKey=' + encodeURIComponent(GAZER_KEY) +
              '&type=' + type + '&cctvType=1&getType=json' +
              '&minX=' + GAZER_BBOX.minX + '&maxX=' + GAZER_BBOX.maxX +
              '&minY=' + GAZER_BBOX.minY + '&maxY=' + GAZER_BBOX.maxY;
      return fetch(u).then(function(r){ return r.json(); }).then(function(j){
        var r2 = (j && j.response) || {};
        var d = Array.isArray(r2.data) ? r2.data : (r2.data ? [r2.data] : []);
        return d.filter(function(c){ return c && c.cctvurl; }).map(function(c){
          return { name:c.cctvname || '이름 없는 관측점', url:gazerHttps(c.cctvurl),
                   x:parseFloat(c.coordx), y:parseFloat(c.coordy) };
        });
      }).catch(function(){ return []; });
    }
    return Promise.all([one('its'), one('ex')]).then(function(rs){
      var seen = {}, out = [];
      rs.forEach(function(arr){ arr.forEach(function(c){
        if(seen[c.url]) return; seen[c.url] = 1; out.push(c);
      }); });
      return gazerShuffle(out).concat(GAZER_FEEDS);
    });
  }

  function killGazer(){
    if(GZ.hls){ try{ GZ.hls.destroy(); }catch(e){} GZ.hls = null; }
    var v = document.getElementById('gzVideo');
    if(v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} }
    GZ.live = false;
  }

  function gazerState(s1, s2){
    var st = document.getElementById('gzState');
    if(!st) return;
    st.innerHTML = '<div class="s1">' + s1 + '</div>' +
                   (s2 ? '<div class="s2">' + s2 + '</div>' : '');
  }

  function gazerPlay(i){
    var box = document.getElementById('gzBox'), v = document.getElementById('gzVideo');
    if(!box || !v || !GZ.list.length) return;
    GZ.idx = ((i % GZ.list.length) + GZ.list.length) % GZ.list.length;
    var item = GZ.list[GZ.idx];
    killGazer();
    box.classList.remove('live');
    gazerState('CONNECTING', item.name + ' 관측점에 접속하고 있습니다.');
    document.getElementById('gzName').innerHTML = '<i></i>' + escapeHtml(item.name);
    document.getElementById('gzCoord').innerHTML =
      (isFinite(item.y) ? item.y.toFixed(4) : '—') + ' N<br>' +
      (isFinite(item.x) ? item.x.toFixed(4) : '—') + ' E';
    GZ.t0 = performance.now();

    function up(){
      box.classList.add('live'); GZ.live = true;
      var ms = Math.round(performance.now() - GZ.t0);
      var d = document.getElementById('gzDelay');
      if(d) d.textContent = 'HLS · 접속 ' + ms + 'ms';
      refreshMenuValues();
    }
    function down(msg){
      box.classList.remove('live'); GZ.live = false;
      gazerState('NO FEED', msg);
      refreshMenuValues();
    }

    loadHls().then(function(Hls){
      if(Hls.isSupported()){
        var h = new Hls({ lowLatencyMode:true, liveDurationInfinity:true });
        GZ.hls = h;
        h.loadSource(gazerStreamUrl(item.url));
        h.attachMedia(v);
        h.on(Hls.Events.MANIFEST_PARSED, function(){ v.play().then(up).catch(up); });
        h.on(Hls.Events.ERROR, function(e, data){
          if(!data.fatal) return;
          down('이 관측점의 신호가 브라우저까지 오지 못했습니다.<br>' +
               '대개 교차 출처(CORS) 차단이거나 주소가 만료된 경우입니다. 다음 관측점을 눌러보세요.');
        });
      } else if(v.canPlayType('application/vnd.apple.mpegurl')){
        v.src = gazerStreamUrl(item.url);
        v.addEventListener('loadeddata', up, { once:true });
        v.addEventListener('error', function(){ down('이 관측점을 재생할 수 없습니다.'); }, { once:true });
        v.play().catch(function(){});
      } else {
        down('이 브라우저는 HLS 를 재생하지 못합니다.');
      }
    }).catch(function(err){
      down(err.message + '. 네트워크가 막혀 있는지 확인하세요.');
    });
  }

  function wireGazer(){
    var next = document.getElementById('gzNext');
    var apply = document.getElementById('gzApply');
    var input = document.getElementById('gzInput');

    // 왜 안 되는지는 추측이 아니라 화면에 적혀 있어야 한다
    function gazerDiagLine(){
      var d = GZ.diag, bits = [];
      if(GZ.status) bits.push('/api/cctv → HTTP ' + GZ.status);
      if(d){
        bits.push(d.keyPresent ? 'ITS_KEY 있음' : 'ITS_KEY 없음 (데모키 test 로 시도)');
        bits.push('cctvType=' + d.cctvType);
        (d.probes || []).forEach(function(p){
          bits.push(p.type + ': ' + (p.error ? p.error : p.count + '건 → ' + p.kept + '개'));
        });
      }
      if(GZ.why) bits.push(GZ.why);
      return bits.length
        ? '<span style="font-family:var(--mono); font-size:9.5px; color:var(--faint);">' +
          escapeHtml(bits.join('  ·  ')) + '</span>'
        : '';
    }

    function boot(){
      gazerState('SEARCHING', '공개 관측망 목록을 받아오고 있습니다.');
      gazerFetchList().then(function(list){
        GZ.list = list;
        if(!list.length){
          gazerState('NO FEED',
            '연결된 관측점이 없습니다.<br>' +
            (GZ.why ? escapeHtml(GZ.why) + '<br>' : '') +
            'Vercel 이라면 Settings → Environment Variables 의 ITS_KEY 를 확인하고, ' +
            '추가한 뒤에는 Redeploy 를 한 번 눌러야 반영됩니다.<br>' + gazerDiagLine());
          if(next) next.disabled = true;
          return;
        }
        if(next) next.disabled = list.length < 2;
        gazerPlay(0);
      }).catch(function(err){
        GZ.list = GAZER_FEEDS.slice();
        if(GZ.list.length){ gazerPlay(0); return; }
        gazerState('BLOCKED',
          '관측망 목록을 받아오지 못했습니다.<br>' +
          escapeHtml((err && err.message) || GZ.why || '') + '<br>' + gazerDiagLine());
      });
    }

    if(next) next.onclick = function(){ gazerPlay(GZ.idx + 1); };

    var diagBtn = document.getElementById('gzDiag');
    if(diagBtn) diagBtn.onclick = function(){
      killGazer();
      document.getElementById('gzBox').classList.remove('live');
      gazerState('DIAGNOSING', '/api/cctv 를 직접 호출하고 있습니다.');
      fetch('/api/cctv').then(function(r){
        GZ.status = r.status;
        return r.text();
      }).then(function(t){
        var j = null;
        try{ j = JSON.parse(t); }catch(e){}
        if(!j){
          gazerState('FUNCTION DOWN',
            '/api/cctv 가 JSON 대신 다른 것을 돌려줬습니다 (HTTP ' + GZ.status + ').<br>' +
            'api 폴더와 package.json 이 함께 배포됐는지 확인하세요.<br>' +
            '<span style="font-family:var(--mono); font-size:9.5px; color:var(--faint);">' +
            escapeHtml(t.slice(0, 200)) + '</span>');
          return;
        }
        GZ.diag = j.diag || null;
        GZ.why = j.error || '';
        gazerState(j.count ? 'OK · ' + j.count + '개' : 'EMPTY', gazerDiagLine());
      }).catch(function(e){
        gazerState('UNREACHABLE', escapeHtml(String((e && e.message) || e)));
      });
    };
    if(apply) apply.onclick = function(){
      var val = (input.value || '').trim();
      if(!val) return;
      if(/\.m3u8/.test(val)){                       // 주소를 그대로 넣은 경우
        GZ.list = [{ name:'직접 입력한 관측점', url:val, x:NaN, y:NaN }].concat(GAZER_FEEDS);
        if(next) next.disabled = GZ.list.length < 2;
        gazerPlay(0);
      } else {                                      // 인증키
        GAZER_KEY = val;
        boot();
      }
      input.value = '';
    };
    boot();
  }

  var focusIndex = 0, inSystem = false, inPanel = false, closing = false;
  var closeTimer = null, closeStart = 0, HOLD_MS = 3000;

  function buildCity(){
    var el = document.getElementById('city'), html = '', x = 0;
    while(x < 100){
      var w = 4 + Math.random()*7, h = 30 + Math.random()*70;
      html += '<i style="width:'+w+'%; height:'+h+'%;"></i>';

  function buildMenu(){
    var list = document.getElementById('sysList');
    list.innerHTML = '';
    sysItems.forEach(function(item, i){
      var li = document.createElement('li');
      if(item.key === 'void'){ li.className = 'void-item'; }
      else {
        li.innerHTML = '<div class="k">'+item.label+'</div><div class="s">'+item.sub+'</div>' +
                       '<div class="v">'+(item.val?item.val():'')+'</div>';
      }
      li.addEventListener('click', function(){ focusIndex = i; updateFocus(); openPanel(item.key); });
      list.appendChild(li);
    });
    updateFocus();
  }

  function refreshMenuValues(){
    var lis = document.querySelectorAll('#sysList li');
    sysItems.forEach(function(item, i){
      if(item.key === 'void' || !lis[i]) return;
      var v = lis[i].querySelector('.v');
      if(v && item.val) v.textContent = item.val();
    });
    document.getElementById('sysHead').innerHTML =
      '눈 감음 · 과금 정지 중<br>오늘 관측세 <b>'+won(S.spent)+'</b> · 절약 <b>'+won(S.saved)+'</b>';
  }

  function updateFocus(){
    var lis = document.querySelectorAll('#sysList li');
    Array.prototype.forEach.call(lis, function(li, i){ li.classList.toggle('focused', i === focusIndex); });
  }

  /* ---------- HUD ---------- */
  function paintHud(){
    document.getElementById('rvTax').textContent = won(S.spent);
    document.getElementById('rvSaved').textContent = won(S.saved);
    var vEl = document.getElementById('rvVision');
    vEl.textContent = visionPct() + '%';
    vEl.className = 'rv' + (visionPct() < 70 ? ' warn' : '');
    document.getElementById('rvDecid').textContent = decidedness().toFixed(2);

    var left = leftoverPct();
    document.getElementById('bdLeft').textContent = S.budgetDaily ? left + '%' : '—';
    document.getElementById('bdAmt').textContent =
      won(S.spent) + ' / ' + (S.budgetDaily ? won(S.budgetDaily) : '상한 없음');
    var fill = document.getElementById('bdFill');
    var used = S.budgetDaily ? Math.min(100, (S.spent/S.budgetDaily)*100) : Math.min(100,(S.spent/FULL_DAILY)*100);
    fill.style.width = used.toFixed(1) + '%';
    fill.classList.toggle('over', S.forced);

    // 시야 완성도가 낮을수록 세계가 덜 보임 (약한 결합)
    var w = document.getElementById('world');
    w.style.opacity = (0.72 + 0.28 * visionPct()/100).toFixed(2);
    w.classList.toggle('over-budget', S.forced);
  }

  function pushFeed(html){
    var feed = document.getElementById('hudFeed');
    var d = document.createElement('div');
    d.className = 'feed-item';
    d.innerHTML = html;
    feed.appendChild(d);
    while(feed.children.length > 5) feed.removeChild(feed.firstChild);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 7000);
  }

  /* ---------- 지나가는 것들 ---------- */
  function pickLayer(){
    var total = VIEW_LAYERS.reduce(function(a,l){ return a+l.cost; }, 0);
    var r = Math.random()*total;
    for(var i=0;i<VIEW_LAYERS.length;i++){
      r -= VIEW_LAYERS[i].cost;
      if(r <= 0) return VIEW_LAYERS[i];
    }
    return VIEW_LAYERS[0];
  }

  function spawnEntity(){
    var world = document.getElementById('world');
    if(!world) return;
    var l = pickLayer();
    var unit = Math.max(20, Math.round(l.cost/14));
    var blocked = isBlocked(l.key);

    var el = document.createElement('div');
    el.className = 'ent' + (blocked ? ' blocked' : '');
    var h = 26 + Math.random()*34;
    var bottom = 4 + Math.random()*16;
    var dir = Math.random() > 0.5 ? 1 : -1;
    var dur = 9000 + Math.random()*5000;
    el.style.bottom = bottom + '%';
    var tag = S.forced ? '블러 · ' + l.short
            : blocked ? '차단 · ' + l.short
            : '+' + won(unit);
    el.innerHTML = '<div class="ent-body" style="height:'+h+'px"></div>' +
                   '<div class="ent-tag">' + tag + '</div>';
    el.style.left = (dir === 1 ? -6 : 106) + '%';
    world.appendChild(el);

    var startX = dir === 1 ? -6 : 106;
    var endX   = dir === 1 ? 106 : -6;
    var t0 = performance.now();
    (function step(now){
      var t = Math.min(1, (now - t0)/dur);
      el.style.left = (startX + (endX-startX)*t) + '%';
      if(t < 1){ requestAnimationFrame(step); }
      else if(el.parentNode){ el.parentNode.removeChild(el); }
    })(t0);

    if(blocked){
      S.saved += unit;
      S.blockedCount++;
      S.byLayer[l.key].block++;
      pushFeed(S.forced
        ? '<span class="b">블러</span> ' + l.name + ' · 절약 ' + won(unit)
        : '<span class="b">차단</span> ' + l.name + ' · 절약 ' + won(unit));
    } else {
      S.spent += unit;
      S.passed++;
      S.byLayer[l.key].pass++;
      pushFeed('<span class="p">통과</span> ' + l.name + ' · ' + won(unit));
      if(S.budgetDaily && S.spent >= S.budgetDaily && !S.forced){
        S.forced = true;
        Array.prototype.forEach.call(world.querySelectorAll('.ent-tag'), function(t){ t.textContent = '블러'; });
        pushFeed('<span class="p">예산 초과</span> 전면 블러로 전환됨');
        say('오늘 응시 예산 ' + spWon(S.budgetDaily) + '을 초과했습니다. 지금부터 모든 물체가 자동으로 블러 처리됩니다. 이동에 필요한 윤곽만 남습니다.', {interrupt:true});
      }
    }
    paintHud();
    if(inSystem) refreshMenuValues();
  }
